  --surface-brand:var(--green-900); --surface-accent:var(--terracotta-500); --surface-accent-subtle:var(--terracotta-100);
  --surface-reward:var(--ochre-500); --surface-reward-subtle:var(--ochre-100);
  --surface-inverse:var(--ink-900); --surface-brand-soft:var(--green-700);
  --surface-indicator:var(--green-100); --surface-track:var(--cream-100); --surface-segment:var(--oat-200); --surface-unavailable:var(--terracotta-700);
  --surface-progress:var(--terracotta-500); --surface-progress-track:var(--oat-200);
  --border-subtle:var(--stone-300); --border-strong:var(--stone-500); --border-brand:var(--green-900); --border-focus:var(--info-600);
  --action-primary:var(--green-900); --action-primary-hover:var(--green-700); --action-primary-pressed:var(--green-950);
  --action-accent:var(--terracotta-700); --action-accent-pressed:var(--terracotta-800); --action-disabled:var(--oat-200);
  /* [NEW] M01-home-v3: dark Home action cards, waiting clock */
  --action-leave:var(--ink-900); --action-leave-pressed:var(--ink-950); --icon-on-leave:var(--ochre-500);
  --action-find:var(--green-700); --action-find-pressed:var(--green-900); --icon-on-find:var(--ochre-300);
  --icon-waiting:var(--ochre-800);
  --map-park:var(--green-100); --map-marker:var(--ink-900);
  --map-tile-filter:saturate(.55) sepia(.3) brightness(1.04) contrast(.9); /* [NEW] v0.7 warms the tiles toward Cream */
  /* type */
  --font-serif:Fraunces,Georgia,serif; --font-sans:Rubik,system-ui,-apple-system,sans-serif;
  /* spacing (multiples of 4) */
  --space-4:4px; --space-8:8px; --space-12:12px; --space-16:16px; --space-20:20px; --space-24:24px;
  --space-28:28px; --space-32:32px; --space-40:40px; --space-48:48px; --space-56:56px; --space-64:64px;
  /* radius */
  --radius-none:0; --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:999px;
  /* elevation and focus */
  --shadow-card:0 1px 2px rgba(43,36,30,.08),0 8px 24px rgba(43,36,30,.08);
  --shadow-sheet:0 -4px 24px rgba(43,36,30,.12);
  --shadow-focus:0 0 0 2px #FFFFFF,0 0 0 5px #2F6E8C;
  /* size and motion */
  --size-tap-min:44px; --size-control:48px; --frame-max:430px; --size-avatar:48px; --size-tab-indicator:64px;
  --motion-fast:150ms; --motion-base:250ms; --ease:cubic-bezier(.2,0,0,1);
  --motion-tab:200ms; --ease-in-out:cubic-bezier(.65,0,.35,1); /* [NEW] QA round 2: sliding tab indicator */
  /* [NEW] QA round 3: notifications (top toasts) */
  --motion-notify:600ms; --notify-ms:5000; --tint-pressed:rgba(43,36,30,.08);
  --surface-notify-success:var(--green-100); --icon-notify-success:var(--success-700);
  --surface-notify-info:var(--paper-0);      --icon-notify-info:var(--green-900);
  --surface-notify-warning:var(--ochre-100); --icon-notify-warning:var(--ochre-800);   /* gold: 4.4:1 icon on tint */
  --surface-notify-error:var(--terracotta-100); --icon-notify-error:var(--terracotta-700); /* 4.6:1 icon on tint */
  /* [NEW] QA round 8 */
  --surface-result:var(--green-50); --surface-result-pressed:var(--oat-200); --border-result:var(--green-700);  /* map / list location rows */
  /* [NEW] QA round 7 */
  --surface-toggle-on:var(--ink-900); --icon-on-toggle:var(--ochre-500);  /* Map / List selected: Ink, gold icon 5.1:1 */
  /* [NEW] QA round 4 */
  --icon-destructive:var(--terracotta-700);  /* delete / remove: 5.8:1 on Paper */
  --icon-not-allowed:var(--terracotta-700);  /* "Not on the shelf" red flags */
  --icon-best-before:var(--info-600);        /* best-before date icon (G06) */
  --surface-sealed:var(--green-100); --icon-sealed:var(--success-700);  /* Sealed badge: Leaf pill, Ink text */
  --type-rules-head:700 14px/20px var(--font-sans);
  --border-notify-success:var(--green-700); --border-notify-warning:var(--ochre-500); --border-notify-error:var(--terracotta-500);
}

/* =====================================================================
   1b. Values written in design-system.md §3, §6 and §8 recipes,
       expressed as custom properties so components stay token-only.
   ===================================================================== */
:root{
  /* §3 type scale: weight size/line family */
  --type-display:700 32px/40px var(--font-serif);
  --type-heading-1:700 28px/36px var(--font-serif);
  --type-heading-2:700 24px/32px var(--font-serif);
  --type-heading-3:700 20px/28px var(--font-serif);
  --type-section:500 18px/24px var(--font-sans);   /* v0.7: was 20/28 */
  --type-title:500 17px/22px var(--font-sans);     /* v0.7: was 18/24 */
  --type-action-title:400 18px/24px var(--font-sans); /* [NEW] Home action cards */
  --type-body-list:400 15px/22px var(--font-sans);  /* [NEW] list rows, item names, settings rows */
  --type-body-large:400 18px/28px var(--font-sans);
  --type-body:400 16px/24px var(--font-sans);
  --type-button:500 16px/24px var(--font-sans);
  --type-body-small:400 14px/20px var(--font-sans);
  --type-label:500 14px/20px var(--font-sans);
  --type-caption:400 12px/16px var(--font-sans);
  --type-status-sub:400 13px/18px var(--font-sans);
  --type-coupon-value:700 40px/48px var(--font-serif); /* [NEW] QA 15 Nov: coupon value in its gift-card panel (round 2: 30 → 40) */ /* [NEW] QA 15 Nov: status under item names (body-list − 2px) */
  --type-overline:500 12px/16px var(--font-sans);
  --tracking-display:-0.02em; --tracking-heading:-0.01em; --tracking-overline:0.06em;
  /* §6 sizes */
  --size-icon-16:16px; --size-icon-20:20px; --size-icon-24:24px; --size-icon-32:32px;
  --frame-w:390px; --frame-h:844px;
  --size-tab-indicator-h:32px; --size-toggle-w:52px; --size-toggle-h:32px;
  /* §8 recipe values */
  --border-w:1.5px;                 /* outline controls, secondary button */
  --size-checkbox:24px;             /* checkbox row */
  --size-marker:32px;               /* map marker */
  --size-chip:32px;                 /* availability chip */
  --size-tile:44px;                 /* icon tile */
  --size-tile-sm:32px;              /* item status tile */
  --size-icon-tile:28px;            /* icon inside action-card tile */
  --size-band:6px;                  /* Rescue Bonus hero band (coupons no longer have one, QA 15 Nov) */
  --size-notch:10px;                /* [NEW] coupon ticket notch radius */
  --notch-l-bottom:radial-gradient(circle var(--size-notch) at 0 100%, transparent 98%, #000) left / 51% 100% no-repeat;
  --notch-r-bottom:radial-gradient(circle var(--size-notch) at 100% 100%, transparent 98%, #000) right / 51% 100% no-repeat;
  --notch-l-top:radial-gradient(circle var(--size-notch) at 0 0, transparent 98%, #000) left / 51% 100% no-repeat;
  --notch-r-top:radial-gradient(circle var(--size-notch) at 100% 0, transparent 98%, #000) right / 51% 100% no-repeat;
  --shadow-ticket:drop-shadow(0 1px 1px rgba(43,36,30,.10)) drop-shadow(0 6px 10px rgba(43,36,30,.08)); /* [NEW] shadow-card as a filter, follows the ticket shape */
  --size-step-bar:6px;              /* step header progress */
  --size-bonus-bar:8px;             /* Rescue Bonus bar */
  --size-row-min:72px;              /* food item row */
  --size-settings-row:64px;         /* settings list */
  --size-status-row:48px;           /* item status list */
  --size-grabber-w:36px; --size-grabber-h:4px;
  --size-segment-min:44px;          /* §8 says ≥ 40; §12 needs 44px targets */
  --size-sheet-max:85dvh;
  --focus-on-dark:0 0 0 3px var(--paper-0);
  --tint-on-dark:rgba(255,255,255,.12);  /* subtle fill on surface-brand (G04 illustration panel) */
  --scrim:rgba(43,36,30,.4);             /* behind bottom sheets */
  --tint-me:rgba(47,110,140,.2);          /* halo around the "you are here" dot (info-600 at 20%) */
  /* [NEW] Part 2 photos (Q88) */
  --shimmer:linear-gradient(90deg,transparent 25%,rgba(255,255,255,.45) 50%,transparent 75%);
  --motion-shimmer:1200ms;
  --scrim-photo-top:linear-gradient(180deg,rgba(43,36,30,.55) 0%,rgba(43,36,30,0) 100%); /* R03: keeps Back and the status bar readable */
  --size-scrim:96px;
}


/* =====================================================================
   2. BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font:var(--type-body);color:var(--text-primary);background:var(--surface-canvas);
  min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0}
a{color:var(--text-link)}
a.action-card,a.shelf,a.result,a.avatar,a.tab,a.card{text-decoration:none;color:inherit}
img,svg{display:block}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus{outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none}
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{box-shadow:none}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* type classes (§3) */
.t-display{font:var(--type-display);letter-spacing:var(--tracking-display);color:var(--text-brand)}
.t-h1{font:var(--type-heading-1);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.t-h2{font:var(--type-heading-2);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.t-h3{font:var(--type-heading-3);color:var(--text-brand)}
.t-section{font:var(--type-section);color:var(--text-primary)}
.t-title{font:var(--type-title)}
.t-body-large{font:var(--type-body-large)}
.t-body{font:var(--type-body)}
.t-small{font:var(--type-body-small)}
.t-label{font:var(--type-label)}
.t-caption{font:var(--type-caption)}
.t-overline{font:var(--type-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase}
.c-secondary{color:var(--text-secondary)}
.c-tertiary{color:var(--text-tertiary)}
.c-brand{color:var(--text-brand)}
.c-accent{color:var(--text-accent)}
.c-reward{color:var(--text-reward)}
.c-problem{color:var(--text-problem)}

/* icons (§7) */
.icon{width:var(--size-icon-24);height:var(--size-icon-24);color:var(--icon-primary);flex:none}
.icon--sm{width:var(--size-icon-20);height:var(--size-icon-20)}
.icon--xs{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5}
.icon--lg{width:var(--size-icon-32);height:var(--size-icon-32)}
.icon--tile{width:var(--size-icon-tile);height:var(--size-icon-tile)}
.icon--secondary{color:var(--icon-secondary)} .icon--tertiary{color:var(--icon-tertiary)}
.icon--accent{color:var(--icon-accent)} .icon--reward{color:var(--icon-reward)}
.icon--on-primary{color:var(--icon-on-primary)} .icon--disabled{color:var(--icon-disabled)}
.icon--neutral{color:var(--icon-neutral)} .icon--on-inverse{color:var(--icon-on-inverse)}
.icon--success{color:var(--icon-success)} .icon--warning{color:var(--icon-warning)}
.icon--problem{color:var(--icon-problem)} .icon--info{color:var(--icon-info)}
.icon--not-allowed{color:var(--icon-not-allowed)} .icon--destructive{color:var(--icon-destructive)}

/* =====================================================================
   3. APP SHELL: phone-width column, centred in a frame on desktop
   ===================================================================== */
.app{
  position:relative;margin:0 auto;width:100%;max-width:var(--frame-max);
  height:100dvh;overflow:hidden;background:var(--surface-canvas);
  display:flex;flex-direction:column;
}
@media (min-width:600px) and (min-height:700px){
  body{background:var(--surface-subtle);display:flex;align-items:center;justify-content:center;padding:var(--space-24)}
  .app{width:var(--frame-w);height:min(var(--frame-h),calc(100dvh - var(--space-48)));border-radius:var(--radius-xl);box-shadow:var(--shadow-card)}
}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:var(--surface-canvas);
  padding:max(env(safe-area-inset-top),var(--space-24)) var(--space-20) var(--space-32);
}
.screen--brand{background:var(--surface-brand);color:var(--text-on-primary)}
.screen--flush{padding-left:0;padding-right:0}
.screen.with-actions{display:flex;flex-direction:column}
.screen .spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--space-16)}
.stack-8{display:flex;flex-direction:column;gap:var(--space-8)}
.stack-24{display:flex;flex-direction:column;gap:var(--space-24)}
.row{display:flex;align-items:center;gap:var(--space-12)}
.grow{flex:1;min-width:0}

/* screen transitions (§6): push 250ms, fade 150ms for overlays */
.screen.enter-fwd{animation:in-fwd var(--motion-base) var(--ease) both}
.screen.leave-fwd{animation:out-fwd var(--motion-base) var(--ease) both}
.screen.enter-back{animation:in-back var(--motion-base) var(--ease) both}
.screen.leave-back{animation:out-back var(--motion-base) var(--ease) both}
.screen.enter-fade{animation:fade-in var(--motion-fast) var(--ease) both}
@keyframes in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes out-fwd{from{transform:none}to{transform:translateX(-30%)}}
@keyframes in-back{from{transform:translateX(-30%)}to{transform:none}}
@keyframes out-back{from{transform:none}to{transform:translateX(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.screen.leave-back{z-index:2}
/* QA round 6: moving between screens that keep the tab bar slides the content the way the Leaf pill moves
   (right-hand tab: content comes in from the right; left-hand tab: from the left). Same time and curve as the pill. */
.screen.tab-in-r{animation:tab-in-r var(--motion-tab) var(--ease-in-out) both}
.screen.tab-out-l{animation:tab-out-l var(--motion-tab) var(--ease-in-out) both}
.screen.tab-in-l{animation:tab-in-l var(--motion-tab) var(--ease-in-out) both}
.screen.tab-out-r{animation:tab-out-r var(--motion-tab) var(--ease-in-out) both}
@keyframes tab-in-r{from{transform:translateX(100%)}to{transform:none}}
@keyframes tab-out-l{from{transform:none}to{transform:translateX(-100%)}}
@keyframes tab-in-l{from{transform:translateX(-100%)}to{transform:none}}
@keyframes tab-out-r{from{transform:none}to{transform:translateX(100%)}}

/* =====================================================================
   4. COMPONENTS (§8)
   ===================================================================== */

/* ---- Button: v0.5 pill ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-8);
  min-height:var(--size-control);padding:var(--space-12) var(--space-24);
  border-radius:var(--radius-full);border:var(--border-w) solid transparent;
  font:var(--type-button);text-align:center;text-decoration:none;
  transition:background-color var(--motion-fast) var(--ease),transform var(--motion-fast) var(--ease);
  user-select:none;
}
.btn .icon{width:var(--size-icon-20);height:var(--size-icon-20);color:currentColor}
.btn--block{display:flex;width:100%}
.btn--primary{background:var(--action-primary);color:var(--text-on-primary)}
.btn--accent{background:var(--action-accent);color:var(--text-on-accent)}
.btn--secondary{background:var(--surface-default);color:var(--text-brand);border-color:var(--border-brand)}
.btn--link{min-height:var(--size-tap-min);padding:var(--space-8) var(--space-4);color:var(--text-link);text-decoration:underline;text-underline-offset:3px;border-radius:var(--radius-sm)}
.btn--on-brand{background:var(--surface-default);color:var(--text-brand)}
.btn--outline-on-brand{background:transparent;color:var(--text-on-primary);border-color:var(--text-on-primary)}
@media (hover:hover){
  .btn--primary:hover:not(:disabled){background:var(--action-primary-hover)}
  .btn--secondary:hover:not(:disabled){background:var(--surface-canvas)}
}
.btn--primary.is-hover{background:var(--action-primary-hover)}
.btn--secondary.is-hover{background:var(--surface-canvas)}
.btn--primary:active:not(:disabled),.btn--primary.is-pressed{background:var(--action-primary-pressed)}
.btn--accent:active:not(:disabled),.btn--accent.is-pressed{background:var(--action-accent-pressed)}
.btn--secondary:active:not(:disabled),.btn--secondary.is-pressed{background:var(--surface-selected)}
.btn--on-brand:active:not(:disabled),.btn--on-brand.is-pressed{background:var(--surface-selected)}
.btn--outline-on-brand:active:not(:disabled),.btn--outline-on-brand.is-pressed{background:var(--tint-on-dark)}
.btn--link:active,.btn--link.is-pressed{background:var(--surface-subtle)}
.btn:active:not(:disabled),.btn.is-pressed{transform:scale(.98)}
.btn.is-focus,.btn:focus-visible{box-shadow:var(--shadow-focus)}
.btn--on-brand:focus-visible,.btn--outline-on-brand:focus-visible,.screen--brand .btn:focus-visible{box-shadow:var(--focus-on-dark)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--action-disabled);color:var(--text-disabled);border-color:transparent;cursor:not-allowed}
.btn--link:disabled{background:none;color:var(--text-disabled)}
.btn.is-loading{pointer-events:none}
.spinner{width:var(--size-icon-20);height:var(--size-icon-20);border-radius:var(--radius-full);border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Icon button: 44px target ---- */
.icon-btn{
  width:var(--size-tap-min);height:var(--size-tap-min);display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);flex:none;color:var(--icon-primary);
  transition:background-color var(--motion-fast) var(--ease);
}
.icon-btn:active,.icon-btn.is-pressed{background:var(--surface-subtle)}
.icon-btn--destructive .icon{color:var(--icon-destructive)}
.screen--brand .icon-btn .icon,.on-brand .icon-btn .icon{color:var(--icon-on-primary)}
.screen--brand .icon-btn:active,.on-brand .icon-btn:active{background:var(--tint-on-dark)}
.screen--brand .icon-btn:focus-visible,.on-brand .icon-btn:focus-visible{box-shadow:var(--focus-on-dark)}

/* ---- Input ---- */
.field{display:flex;flex-direction:column;gap:var(--space-8)}
.field__label{font:var(--type-label);color:var(--text-secondary)}
.input{
  width:100%;min-height:var(--size-control);padding:var(--space-12) var(--space-16);
  border-radius:var(--radius-md);border:var(--border-w) solid var(--border-strong);
  background:var(--surface-default);font:var(--type-body);color:var(--text-primary);
  -webkit-appearance:none;appearance:none;
}
.input::placeholder{color:var(--text-tertiary)}
.input:focus,.input.is-focus{border-color:var(--border-brand);box-shadow:var(--shadow-focus)}
.field.is-error .input{border-color:var(--text-problem)}
.field__error{display:flex;gap:var(--space-8);align-items:flex-start;font:var(--type-body-small);color:var(--text-problem)}
.field__error .icon{color:var(--icon-problem);width:var(--size-icon-20);height:var(--size-icon-20)}
.input:disabled{background:var(--surface-canvas);color:var(--text-disabled);border-color:var(--border-subtle)}
.field.is-disabled .field__label{color:var(--text-disabled)}

/* ---- Search field ---- */
.search{display:flex;gap:var(--space-8);align-items:flex-start}
.search__box{position:relative;flex:1;min-width:0}
.search__field{
  display:flex;align-items:center;gap:var(--space-8);min-height:var(--size-control);
  padding:0 var(--space-4) 0 var(--space-16);border-radius:var(--radius-full);
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
}
.search__field:focus-within{border-color:var(--border-brand);box-shadow:var(--shadow-focus)}
.search__field .icon{color:var(--icon-reward)}
.search__input{flex:1;min-width:0;border:0;background:none;font:var(--type-body);padding:var(--space-12) 0;color:var(--text-primary)}
.search__input::placeholder{color:var(--text-tertiary)}
.search__input:focus-visible{box-shadow:none}
.search__input::-webkit-search-cancel-button{display:none}
.search__clear{width:var(--size-tap-min);height:var(--size-tap-min)}
.search__clear .icon{color:var(--icon-primary)}
.search__filter{
  width:var(--size-control);height:var(--size-control);border-radius:var(--radius-full);flex:none;
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
  display:inline-flex;align-items:center;justify-content:center;
}
.search__filter:active{background:var(--surface-selected)}
.suggest{
  margin-top:var(--space-8);background:var(--surface-default);border-radius:var(--radius-md);
  border:var(--border-w) solid var(--border-subtle);overflow:hidden;
}
.suggest__item{display:flex;align-items:center;gap:var(--space-12);width:100%;min-height:var(--size-control);padding:var(--space-12) var(--space-16);text-align:left;font:var(--type-body)}
.suggest__item + .suggest__item{border-top:1px solid var(--border-subtle)}
.suggest__item:active,.suggest__item[aria-selected="true"]{background:var(--surface-selected)}
.suggest__item .icon{color:var(--icon-secondary);width:var(--size-icon-20);height:var(--size-icon-20)}
.suggest__item mark{background:none;color:inherit;font-weight:500}
.suggest__meta{font:var(--type-body-small);color:var(--text-secondary);white-space:nowrap}

/* ---- Filter chip ---- */
.chips{display:flex;gap:var(--space-8);overflow-x:auto;scrollbar-width:none;padding:var(--space-4) 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:var(--space-8);flex:none;
  min-height:var(--size-tap-min);padding:0 var(--space-16);border-radius:var(--radius-full);
  font:var(--type-label);white-space:nowrap;
  background:var(--surface-default);color:var(--text-primary);border:var(--border-w) solid var(--border-strong);
}
.chip .icon{width:var(--size-icon-20);height:var(--size-icon-20);color:currentColor}
.chip[aria-pressed="true"]{background:var(--surface-toggle-on);color:var(--text-on-inverse);border-color:var(--surface-toggle-on)}  /* QA round 7: Ink like the Map / List switch */
.chip[aria-pressed="true"] .icon{color:var(--icon-on-toggle)}
.chip:active{transform:scale(.97)}

/* ---- Checkbox row ---- */
.check{display:flex;align-items:flex-start;gap:var(--space-12);min-height:var(--size-tap-min);padding:var(--space-8) 0;cursor:pointer;font:var(--type-body)}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check__box{
  width:var(--size-checkbox);height:var(--size-checkbox);border-radius:var(--radius-xs);flex:none;margin-top:0;
  border:var(--border-w) solid var(--border-strong);background:var(--surface-default);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color var(--motion-fast) var(--ease);
}
.check__box .icon{width:var(--size-icon-16);height:var(--size-icon-16);color:var(--icon-on-primary);opacity:0;stroke-width:2.5}
.check input:checked + .check__box{background:var(--action-primary);border-color:var(--action-primary)}
.check input:checked + .check__box .icon{opacity:1}
.check input:focus-visible + .check__box{box-shadow:var(--shadow-focus)}
.check input:disabled + .check__box{background:var(--action-disabled);border-color:var(--border-subtle)}
.check.is-disabled{color:var(--text-disabled);cursor:not-allowed}
.check-panel{background:var(--surface-selected);border-radius:var(--radius-lg);padding:var(--space-12) var(--space-16)}

/* ---- Quantity stepper: v0.5 round ---- */
.stepper{display:inline-flex;align-items:center;gap:var(--space-12)}
.stepper__btn{
  width:var(--size-tap-min);height:var(--size-tap-min);border-radius:var(--radius-full);
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
  display:inline-flex;align-items:center;justify-content:center;
}
.stepper__btn .icon{color:var(--icon-primary)}
.stepper__btn:active:not(:disabled){background:var(--surface-selected)}
.stepper__btn:disabled{border-color:var(--border-subtle);background:var(--surface-canvas);cursor:not-allowed}
.stepper__btn:disabled .icon{color:var(--icon-disabled)}
.stepper__value{font:var(--type-title);min-width:var(--space-24);text-align:center}

/* ---- Card ---- */
.card{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);border:var(--border-w) solid transparent}
.card--shadow{box-shadow:var(--shadow-card)}
.card--tap{display:block;width:100%;text-align:left;transition:transform var(--motion-fast) var(--ease)}
.card--tap:active,.card.is-pressed{transform:scale(.98);background:var(--surface-subtle)}
.card.is-selected{border-color:var(--border-brand)}
.card--selected-fill{background:var(--surface-selected)}
.card--subtle{background:var(--surface-subtle)}
.card--flush{padding:0;overflow:hidden}

/* ---- Icon tile ---- */
.tile{width:var(--size-tile);height:var(--size-tile);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface-selected)}
.tile--accent{background:var(--surface-accent-subtle)}
.tile--reward{background:var(--surface-reward-subtle)}
.tile--sand{background:var(--sand-200)}
.tile--paper{background:var(--surface-default)}
.tile--sm{width:var(--size-tile-sm);height:var(--size-tile-sm);border-radius:var(--radius-sm)}
.tile--canvas{background:var(--surface-canvas)}

/* ---- Action card (Home) ---- */
.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16)}
.action-card{
  display:flex;flex-direction:column;gap:var(--space-8);text-align:left;min-height:var(--size-tap-min);
  border-radius:var(--radius-lg);padding:var(--space-24) var(--space-20);
  transition:transform var(--motion-fast) var(--ease),background-color var(--motion-fast) var(--ease);
}
.action-card--leave{background:var(--action-leave)}
.action-card--find{background:var(--action-find)}
.action-card--leave:active,.action-card--leave.is-pressed{background:var(--action-leave-pressed)}
.action-card--find:active,.action-card--find.is-pressed{background:var(--action-find-pressed)}
.action-card:active,.action-card.is-pressed{transform:scale(.98)}
.action-card > .icon{width:var(--size-icon-tile);height:var(--size-icon-tile);margin-bottom:var(--space-8)}
.action-card--leave > .icon{color:var(--icon-on-leave)}
.action-card--find > .icon{color:var(--icon-on-find)}
.action-card__title{font:var(--type-action-title);color:var(--text-on-inverse)}
.action-card__desc{font:var(--type-body-small);color:var(--text-on-inverse-secondary)}
.action-card:focus-visible{box-shadow:var(--shadow-focus)}

/* ---- Feature card ---- */
.feature{background:var(--surface-accent-subtle);border-radius:var(--radius-lg);padding:var(--space-16);display:flex;gap:var(--space-12);align-items:flex-start}
.feature .t-overline{color:var(--text-accent)}

/* ---- Status label ---- */
.status{display:inline-flex;align-items:center;gap:var(--space-8);font:var(--type-label);color:var(--text-primary)}
.status .icon{width:var(--size-icon-20);height:var(--size-icon-20)}
.status--problem{color:var(--text-problem)}

/* ---- Banner / toast ---- */
.banner{display:flex;align-items:flex-start;gap:var(--space-12);border-radius:var(--radius-md);padding:var(--space-12) var(--space-16);font:var(--type-body)}
.banner > .icon{margin-top:0}
.banner__text{flex:1;min-width:0;align-self:center}
.banner__text strong{font-weight:500}
.banner__action{margin:calc(var(--space-12) * -1) calc(var(--space-8) * -1) calc(var(--space-12) * -1) 0;align-self:center}
.banner--success{background:var(--surface-selected);color:var(--text-primary)}
.banner--success > .icon{color:var(--icon-success)}
.banner--info{background:var(--surface-subtle);color:var(--text-primary)}
.banner--info > .icon{color:var(--icon-primary)}  /* QA 15 Nov: inline notice icons are Pantry Green */
.banner--problem{background:var(--surface-default);color:var(--text-problem);border:var(--border-w) solid var(--border-strong)}
.banner--problem > .icon{color:var(--icon-problem)}
.banner--reward{background:var(--surface-reward-subtle);color:var(--text-primary)}
.banner--reward > .icon{color:var(--icon-reward)}
.banner--plain{background:var(--surface-default)}
/* ---- Notification (QA round 3): drops in from the top (600 ms), X to dismiss, auto-hides after 5 s,
   newest on top, 8px between stacked ones. success = Leaf · info = Paper · warning = gold tint · error = terracotta tint. Ink text always. */
.toast-host{position:absolute;left:var(--space-16);right:var(--space-16);top:max(env(safe-area-inset-top),var(--space-12));z-index:60;display:flex;flex-direction:column;gap:var(--space-8);pointer-events:none}
.notify{pointer-events:auto;display:flex;align-items:flex-start;gap:var(--space-12);padding:var(--space-4) var(--space-4) var(--space-4) var(--space-16);border-radius:var(--radius-md);box-shadow:var(--shadow-card);font:var(--type-body);color:var(--text-primary);border:1px solid transparent;
  animation:notify-in var(--motion-notify) var(--ease) both}
.notify > .icon{margin-top:var(--space-12);flex:none}
.notify__text{flex:1;min-width:0;padding:var(--space-12) 0}
.notify__text strong{font-weight:500}
.notify .banner__action{margin:0;align-self:center}
.notify__close{flex:none;width:var(--size-tap-min);height:var(--size-tap-min);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full);color:var(--icon-primary)}
.notify__close:active{background:var(--tint-pressed)}
.notify__close .icon{width:var(--size-icon-20);height:var(--size-icon-20)}
.notify--success{background:var(--surface-notify-success);border-color:var(--border-notify-success)} .notify--success > .icon{color:var(--icon-notify-success)}
.notify--info{background:var(--surface-notify-info);border-color:var(--border-subtle)} .notify--info > .icon{color:var(--icon-notify-info)}
.notify--warning{background:var(--surface-notify-warning);border-color:var(--border-notify-warning)} .notify--warning > .icon{color:var(--icon-notify-warning)}
.notify--error{background:var(--surface-notify-error);border-color:var(--border-notify-error)} .notify--error > .icon{color:var(--icon-notify-error)}
.notify.is-leaving{animation:notify-out var(--motion-notify) var(--ease) both}
@keyframes notify-in{from{opacity:0;transform:translateY(calc(-100% - var(--space-24)))}to{opacity:1;transform:none}}
@keyframes notify-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(calc(-100% - var(--space-24)))}}
@media (prefers-reduced-motion:reduce){.notify,.notify.is-leaving{animation-name:fade-in;animation-duration:var(--motion-fast)}.notify.is-leaving{animation-direction:reverse}}
.static-notify{position:static;animation:none}

/* ---- Coupon ticket: QA 15 Nov ----
   Two Paper halves; each has its two notch corners cut out with a mask, so the canvas shows through for real.
   The shadow is a drop-shadow filter on the wrapper, so it follows the ticket outline (notches included). */
.coupon{position:relative;filter:var(--shadow-ticket)}
.coupon > .coupon__body,.coupon > .coupon__foot{background:var(--surface-default)}
.coupon > .coupon__body:only-child{border-radius:var(--radius-lg)}
.coupon > .coupon__body:not(:only-child){border-radius:var(--radius-lg) var(--radius-lg) 0 0;padding-bottom:var(--space-16);
  -webkit-mask:var(--notch-l-bottom),var(--notch-r-bottom);mask:var(--notch-l-bottom),var(--notch-r-bottom)}
.coupon > .coupon__foot{position:relative;border-radius:0 0 var(--radius-lg) var(--radius-lg);padding-top:var(--space-16);
  -webkit-mask:var(--notch-l-top),var(--notch-r-top);mask:var(--notch-l-top),var(--notch-r-top)}
.coupon > .coupon__foot::before{content:"";position:absolute;left:var(--space-20);right:var(--space-20);top:0;border-top:var(--border-w) dashed var(--border-subtle)}
.coupon__value{display:flex;align-items:center;justify-content:center;text-align:center;margin-top:var(--space-12);padding:var(--space-20) var(--space-24);
  border-radius:var(--radius-md);background:var(--surface-reward-subtle);font:var(--type-coupon-value);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.coupon__value + .coupon__meta{margin-top:var(--space-12)}
.qrsheet__value{align-self:stretch;margin-top:0}
.qrsheet.is-used .qrsheet__value{background:var(--surface-subtle);color:var(--text-secondary)}
.coupon.is-used .coupon__value,.coupon.is-expired .coupon__value{background:var(--surface-subtle);color:var(--text-secondary)}
.coupon__body{padding:var(--space-16) var(--space-16) var(--space-12)}
.coupon__head{display:flex;align-items:center;gap:var(--space-8);justify-content:space-between}
.coupon__kind{display:flex;align-items:center;gap:var(--space-8);color:var(--text-secondary)}
.coupon__meta{font:var(--type-body-small);color:var(--text-secondary);margin-top:var(--space-4)}
.kv{display:flex;justify-content:space-between;gap:var(--space-16);font:var(--type-body);padding:var(--space-4) 0}
.kv dt{color:var(--text-primary)}
.kv dd{margin:0;font-weight:500;text-align:right}
.coupon__terms{margin:var(--space-12) 0 0}
.coupon__foot{display:flex;align-items:center;justify-content:center;gap:var(--space-12);padding:0 var(--space-16) var(--space-16)}
.coupon__foot .btn{flex:none}
.pill{display:inline-flex;align-items:center;gap:var(--space-4);min-height:var(--size-icon-24);padding:var(--space-4) var(--space-12);border-radius:var(--radius-full);font:var(--type-label);white-space:nowrap;background:var(--surface-track);color:var(--text-primary)}
.pill .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5}
.pill--leaf{background:var(--surface-selected)}
.pill--oat{background:var(--surface-subtle)}
.pill--reward{background:var(--surface-reward-subtle)}

/* ---- Segmented control: v0.5 Oat ---- */
.segmented{display:inline-flex;padding:var(--space-4);gap:var(--space-4);border-radius:var(--radius-full);background:var(--surface-segment)}
.segmented--block{display:flex}
.segmented__seg{
  flex:1;min-height:var(--size-segment-min);padding:var(--space-8) var(--space-16);border-radius:var(--radius-full);
  font:var(--type-body);color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-8);white-space:nowrap;
}
.segmented__seg .icon{width:var(--size-icon-20);height:var(--size-icon-20)}
.segmented__seg[aria-selected="true"]{background:var(--surface-default);font-weight:500;box-shadow:0 1px 2px rgba(43,36,30,.08)}
/* QA round 7: Map / List switch = Paper track, selected segment Ink (like Leave food) with Paper text and a gold icon */
#mapswitch .segmented{background:var(--surface-default);border:1px solid var(--border-subtle)}
#mapswitch .segmented__seg{color:var(--text-primary)}
#mapswitch .segmented__seg .icon{color:var(--icon-primary)}
#mapswitch .segmented__seg[aria-selected="true"]{background:var(--surface-toggle-on);color:var(--text-on-inverse);box-shadow:none}
#mapswitch .segmented__seg[aria-selected="true"] .icon{color:var(--icon-on-toggle)}

/* ---- Rescue Bonus card ---- */
.bonus{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16)}
.bonus__head{display:flex;gap:var(--space-12);align-items:center}
.bonus__bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-4);margin-top:var(--space-16)}
.bonus__seg{height:var(--size-bonus-bar);border-radius:var(--radius-full);background:var(--surface-track);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.bonus__seg.is-on{background:var(--surface-reward);box-shadow:none}
.bonus.is-expired .bonus__seg.is-on{background:var(--surface-subtle)}
.bonus__status{margin-top:var(--space-8);font:var(--type-body-small);color:var(--text-primary)}

/* ---- Progress (generic) ---- */
.progress{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-8)}
.progress__seg{height:var(--size-step-bar);border-radius:var(--radius-full);background:var(--surface-progress-track)}
.progress__seg.is-on{background:var(--surface-progress)}
.screen--brand .progress__seg,.on-brand .progress__seg{background:var(--surface-brand-soft)}
.screen--brand .progress__seg.is-on,.on-brand .progress__seg.is-on{background:var(--surface-progress)}

/* ---- Step header (v0.5) ---- */
.stephead{display:flex;flex-direction:column;gap:var(--space-12);margin:calc(var(--space-8) * -1) 0 var(--space-24)}
.stephead__bar{display:flex;align-items:center;gap:var(--space-8);margin-left:calc(var(--space-12) * -1)}
.stephead__title{flex:1;min-width:0;font:var(--type-heading-2);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.stephead__step{color:var(--text-secondary);white-space:nowrap}
.screen--brand .stephead__title,.on-brand .stephead__title{color:var(--text-on-primary)}
.screen--brand .stephead__step,.on-brand .stephead__step{color:var(--text-on-inverse-secondary)}

/* ---- Top bar ---- */
.topbar{display:flex;align-items:center;gap:var(--space-8);min-height:var(--size-control);margin:calc(var(--space-8) * -1) calc(var(--space-12) * -1) var(--space-16)}
.topbar__title{flex:1;min-width:0;font:var(--type-title);color:var(--text-primary)}
.topbar__title--serif{font:var(--type-heading-1);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.on-brand .topbar__title,.screen--brand .topbar__title{color:var(--text-on-primary)}

/* ---- NFC tap card ---- */
.nfc{display:flex;flex-direction:column;gap:var(--space-16);color:var(--text-on-primary)}
.nfc__stage{
  position:relative;border-radius:var(--radius-lg);background:var(--tint-on-dark);
  min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-16);padding:var(--space-24);text-align:center;
}
.nfc__art{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center}
.nfc__core{position:relative;z-index:1;width:72px;height:72px;border-radius:var(--radius-full);background:var(--surface-default);display:flex;align-items:center;justify-content:center;transition:background-color var(--motion-fast) var(--ease)}
.nfc__core .icon{width:var(--size-icon-32);height:var(--size-icon-32);color:var(--icon-primary)}
.nfc__ring{position:absolute;inset:28px;border-radius:var(--radius-full);border:2px solid var(--text-on-primary);opacity:0}
.nfc[data-state="idle"] .nfc__ring{animation:pulse 2.4s var(--ease) infinite}
.nfc[data-state="idle"] .nfc__ring:nth-child(2){animation-delay:.8s}
.nfc[data-state="idle"] .nfc__ring:nth-child(3){animation-delay:1.6s}
.nfc[data-state="idle"] .nfc__phone{animation:approach 2.4s var(--ease) infinite}
.nfc[data-state="scanning"] .nfc__ring{animation:pulse 1.2s linear infinite}
.nfc[data-state="scanning"] .nfc__ring:nth-child(2){animation-delay:.4s}
.nfc[data-state="scanning"] .nfc__ring:nth-child(3){animation-delay:.8s}
.nfc[data-state="found"] .nfc__core{background:var(--surface-selected)}
.nfc[data-state="found"] .nfc__core .icon{color:var(--icon-success)}
.nfc[data-state="notfound"] .nfc__core{background:var(--surface-subtle)}
.nfc[data-state="notfound"] .nfc__core .icon{color:var(--icon-problem)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes approach{0%,100%{transform:translateY(-6px)}50%{transform:translateY(4px)}}
.nfc__status{font:var(--type-title);color:var(--text-on-primary)}
.nfc__hint{font:var(--type-body);color:var(--text-on-inverse-secondary)}
.nfc__actions{display:flex;flex-direction:column;gap:var(--space-12)}
.nfc__note{display:flex;gap:var(--space-12);align-items:flex-start;font:var(--type-body);color:var(--text-on-primary)}
.nfc__note .icon{color:var(--icon-on-primary)}
.nfc__qr{width:160px;height:160px;border-radius:var(--radius-md);border:2px dashed var(--text-on-primary);display:flex;align-items:center;justify-content:center}

.nfc__more{text-align:center}
.on-brand .btn--link,.screen--brand .btn--link{color:var(--text-on-primary)}
.on-brand .btn--link:active,.screen--brand .btn--link:active{background:var(--tint-on-dark)}
.capture__overlay.capture__overlay--dim{background:var(--scrim)}

/* ---- Food item row ---- */
.item{display:flex;gap:var(--space-12);align-items:flex-start;background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);min-height:var(--size-row-min);border:var(--border-w) solid transparent;transition:background-color var(--motion-base) var(--ease)}
.item__thumb{width:var(--size-control);height:var(--size-control);border-radius:var(--radius-sm);background:var(--surface-selected);display:flex;align-items:center;justify-content:center;flex:none}
.item__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-4)}
.item__name{font:var(--type-body-list);font-weight:500}  /* QA round 4: same as Home status names */
.item__meta{display:flex;flex-wrap:wrap;gap:var(--space-4) var(--space-8);font:var(--type-body-small);color:var(--text-tertiary)}
.item__meta span{display:inline-flex;align-items:center;gap:var(--space-4)}
.item__meta .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5;color:var(--icon-best-before)}
.item{position:relative}
.item__tools{position:absolute;top:var(--space-8);right:var(--space-4);bottom:var(--space-8);display:flex;flex-direction:column;justify-content:space-between}
.item:not(.item--check) .item__main{padding-right:var(--space-32)}
.item__qty{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8);margin-top:var(--space-8)}
.item__sealed{display:inline-flex;align-items:center;gap:var(--space-4);min-height:var(--size-chip);padding:0 var(--space-12) 0 var(--space-8);border-radius:var(--radius-full);background:var(--surface-sealed);font:var(--type-label);color:var(--text-primary)}
.item__sealed .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5;color:var(--icon-sealed)}
.item.is-edited{background:var(--surface-selected)}
.item--check{cursor:pointer;align-items:flex-start;gap:var(--space-12)}
.item--check.is-checked{border-color:var(--border-brand)}
.item--check .check{padding:0;min-height:auto}
.item__taking{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-8);font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Map marker ---- */
.marker{
  width:var(--size-marker);height:var(--size-marker);border-radius:var(--radius-full);flex:none;
  background:var(--map-marker);color:var(--text-on-inverse);font:var(--type-label);
  display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--surface-default);
  position:relative;
}
.marker--selected{background:var(--action-primary);box-shadow:0 0 0 var(--space-8) var(--surface-selected)}
.marker--full{background:var(--surface-unavailable);color:var(--text-on-unavailable)}
.marker--paused{background:var(--surface-default);color:var(--text-primary);border-color:var(--border-strong);border-style:dashed}
.marker--closed{background:var(--action-disabled);color:var(--text-secondary);border-color:var(--border-strong)}
.marker__badge{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:var(--radius-full);background:var(--surface-default);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(43,36,30,.2)}
.marker__badge .icon{width:14px;height:14px;stroke-width:1.5}
.marker-btn{width:var(--size-tap-min);height:var(--size-tap-min);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-12) var(--space-16);font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Map controls ---- */

/* ---- Shelf card + carousel ---- */
.carousel{display:flex;gap:var(--space-12);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:var(--space-20);margin:0 calc(var(--space-20) * -1);padding:var(--space-4) var(--space-20) var(--space-16);scrollbar-width:none}

.has-photo{position:relative;background:var(--surface-subtle)}
.has-photo::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;background:var(--shimmer);background-size:200% 100%;animation:shimmer var(--motion-shimmer) linear infinite}

/* ---- Settings list ---- */
.settings{background:var(--surface-default);border-radius:var(--radius-lg);padding:0 var(--space-16)}

button.settings__row:active{background:var(--surface-canvas)}

.toggle::after{content:"";position:absolute;top:50%;left:var(--space-4);width:22px;height:22px;border-radius:var(--radius-full);background:var(--surface-default);box-shadow:0 0 0 var(--border-w) var(--border-strong);transform:translateY(-50%);transition:transform var(--motion-fast) var(--ease)}

/* ---- Profile row / avatar ---- */

/* ---- Host-mode card ---- */

/* ---- Greeting header ---- */
.greet{display:flex;align-items:center;justify-content:space-between;gap:var(--space-16);margin-bottom:var(--space-16)}

/* ---- Bottom sheet ---- */
.sheet-host{position:absolute;inset:0;z-index:50;display:none}

.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade-in var(--motion-fast) var(--ease) both}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:var(--size-sheet-max);overflow-y:auto;
  background:var(--surface-default);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet);
  padding:var(--space-8) var(--space-20) calc(var(--space-24) + env(safe-area-inset-bottom));
  animation:sheet-in var(--motion-base) var(--ease) both;
}

.sheet__head{display:flex;align-items:center;gap:var(--space-8);margin-bottom:var(--space-16)}

/* ---- Counter QR sheet ---- */

/* ---- Photo capture frame ---- */
.capture{position:relative;border-radius:var(--radius-lg);background:var(--surface-subtle);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:var(--space-24);overflow:hidden}

/* ---- List result row ---- */
.result{display:flex;align-items:center;gap:var(--space-16);width:100%;text-align:left;background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);min-height:var(--size-row-min)}

.result__meta{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Verification status card / timeline ---- */

.verify__label{font:var(--type-title)}

/* ---- Benefit list ---- */
.benefits{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-16)}
.benefit{display:flex;gap:var(--space-16);align-items:flex-start}

/* ---- Steward check row ---- */
.checkrow{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);border:var(--border-w) solid transparent;display:flex;flex-direction:column;gap:var(--space-12)}
.checkrow__btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8)}
.checkrow__btns .btn{padding-left:var(--space-12);padding-right:var(--space-12)}
.checkrow .btn[aria-pressed="true"]{background:var(--action-primary);color:var(--text-on-primary);border-color:var(--action-primary)}

.checkrow.is-removed{background:var(--surface-subtle)}

/* ---- Activity log row ---- */
.log{background:var(--surface-default);border-radius:var(--radius-lg);padding:0 var(--space-16)}

}

/* =====================================================================
   4c. SHARED INTERACTION SYSTEM (hand-off §3) + screens added 15–16 Nov
   ===================================================================== */
:root{
  /* [NEW] tokens added for the 16 Nov build (docs/design-system.md §10b) */
  --motion-stagger:200ms;                 /* confirmation screens: headline, card, button */
  --motion-slow:600ms;                    /* count / bonus fill / bar animations */
  --shadow-card-pressed:0 1px 2px rgba(43,36,30,.12),0 10px 28px rgba(43,36,30,.14);
  --size-hero:240px;                      /* onboarding / venue photo placeholder */
  --size-illus:160px;                     /* confirmation illustrations (G07, R06, H05 live, H08b, H05 kit) */
  --size-illus-sm:120px;                  /* [NEW] illustration v2: empty-state illustrations */
  --motion-nfc-loop:4s;                   /* [NEW] illustration v2: idle teaching loop in tap-the-tag.svg */
  --motion-drop:450ms;                    /* [NEW] illustration v2: one item drops onto the shelf (shelf-fill.svg) */
  --size-result-icon:80px;                /* round result icon (H07b, H05b, R04c) */
  --size-radio:24px;
  --size-chart:160px;                     /* G11 bar chart height */
  --size-photo-sm:80px;                   /* venue photo in the map sheet details */
  --size-modfab:40px;                     /* movable moderator button (team request; below the 44px tap minimum) */
  --opacity-idle:.3;                      /* moderator button at rest */
}
/* pressed states (§3.2): buttons scale .98 (in .btn), cards .99 with a stronger shadow */
.card--tap:active,.shelf:active,.result:active,.rolecard:active,.action-card:active{transform:scale(.99);box-shadow:var(--shadow-card-pressed)}
.btn{transition:background-color var(--motion-fast) var(--ease),transform 100ms var(--ease)}

/* sheet: grab button, closing animation */
.sheet__grab{display:flex;width:100%;height:var(--space-24);align-items:center;justify-content:center;margin-bottom:var(--space-4)}
.sheet__grab .sheet__grabber{margin:0}
.sheet{transition:transform var(--motion-base) var(--ease)}
.sheet-host.is-closing .sheet{animation:sheet-out var(--motion-base) var(--ease) both}
.sheet-host.is-closing .sheet-scrim{animation:fade-out var(--motion-base) var(--ease) both}
@keyframes sheet-out{to{transform:translateY(100%)}}
@keyframes fade-out{to{opacity:0}}
.sheet__body .actions{padding-top:var(--space-16)}

@keyframes fade-up{from{opacity:0;transform:translateY(var(--space-8))}to{opacity:1;transform:none}}
/* sticky action bar for long task screens (G06, R05, H08): the closing action stays in reach */
.actions--sticky{position:sticky;bottom:calc(var(--space-32) * -1);margin:var(--space-16) calc(var(--space-20) * -1) calc(var(--space-32) * -1);padding:var(--space-12) var(--space-20) calc(var(--space-16) + env(safe-area-inset-bottom));background:var(--surface-canvas);box-shadow:var(--shadow-sheet);z-index:3}
.stagger{display:flex;flex-direction:column;gap:var(--space-16)}

/* overlay banner: slides down from the top */
.ov-host{position:absolute;left:0;right:0;top:0;z-index:45;pointer-events:none;padding:max(env(safe-area-inset-top),var(--space-12)) var(--space-12) 0}
.ov{pointer-events:auto;animation:ov-in var(--motion-base) var(--ease) both}
.ov.is-leaving{animation:ov-out var(--motion-base) var(--ease) both}
@keyframes ov-in{from{transform:translateY(-120%)}to{transform:none}}
@keyframes ov-out{to{transform:translateY(-120%);opacity:0}}
.notice{background:var(--surface-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12)}
.notice__head{display:flex;gap:var(--space-12);align-items:center}
.notice__actions{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8)}
.notice .btn{padding-left:var(--space-12);padding-right:var(--space-12)}
.ov .banner{box-shadow:var(--shadow-card)}

/* gated button: one-line hint under a disabled closing action; highlight what is missing */
.gate{display:flex;flex-direction:column;gap:var(--space-8)}
.gate__hint{font:var(--type-body-small);color:var(--text-secondary);text-align:center}
.gate__hint[hidden]{display:none}
.is-flash{animation:flash 1.2s var(--ease) both;border-radius:var(--radius-lg)}
@keyframes flash{0%,100%{box-shadow:none}20%,60%{box-shadow:var(--shadow-focus)}}

/* confirmation screens: content staggers in (headline, card, button) */
.stagger > *{animation:rise var(--motion-base) var(--ease) both}
.stagger > *:nth-child(2){animation-delay:var(--motion-stagger)}
.stagger > *:nth-child(3){animation-delay:calc(var(--motion-stagger) * 2)}
.stagger > *:nth-child(4){animation-delay:calc(var(--motion-stagger) * 3)}
.stagger > *:nth-child(n+5){animation-delay:calc(var(--motion-stagger) * 4)}
@keyframes rise{from{opacity:0;transform:translateY(var(--space-8))}to{opacity:1;transform:none}}

/* NFC: tag not found shake, tick draws in */
.is-shake{animation:shake 300ms var(--ease) both}

@keyframes draw{to{stroke-dashoffset:0}}

/* count change: number crossfades */
.num-fade{animation:fade-in var(--motion-fast) var(--ease) both}

/* step header, stacked variant (onboarding, R04c, H05b frames): back/close, centred overline, bar, then title */
.stephead--stack{gap:var(--space-8)}

@keyframes grow{from{transform:scaleX(.2)}to{transform:none}}

.wordmark{font:var(--type-heading-3);color:var(--text-brand);margin-bottom:var(--space-16);display:inline-block;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

.modfab{position:absolute;left:0;top:0;z-index:44;width:var(--size-modfab);height:var(--size-modfab);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;

.screen--brand .t-h1{color:var(--text-on-primary)}
.screen--brand .t-body-large{color:var(--text-on-primary)}
.pick{background:var(--surface-default);border-radius:var(--radius-lg);border:var(--border-w) solid transparent;padding:var(--space-8) var(--space-12) var(--space-4);transition:border-color var(--motion-fast) var(--ease),background-color var(--motion-fast) var(--ease)}
.pick.is-checked{border-color:var(--border-brand)}
.pick__main{display:flex;gap:var(--space-12);align-items:flex-start;min-height:var(--size-tap-min);padding:var(--space-8) 0;cursor:pointer}
.pick__main input{position:absolute;opacity:0;width:1px;height:1px}
.pick__main .check__box{margin-top:var(--space-4)}
.pick__main input:checked + .check__box{background:var(--action-primary);border-color:var(--action-primary)}
.pick__main input:checked + .check__box .icon{opacity:1}
.pick__main input:focus-visible + .check__box{box-shadow:var(--shadow-focus)}
.pick__foot{display:flex;justify-content:flex-end;margin-top:calc(var(--space-8) * -1)}
.pick__foot .btn--link{font:var(--type-label)}
.pick.is-missing{background:var(--surface-subtle);opacity:.7}
.pick.is-missing .pick__main{cursor:default}
.pick .item__taking{padding:0 0 var(--space-8) calc(var(--size-checkbox) + var(--space-12))}
/* v0.7 type: item names and list rows use body-list (15/22, 400) */
.pick .t-title,.shelfitem .t-body,.suggest__item,.radiorow{font:var(--type-body-list)}
.item:not(.item--check) .item__qty{flex-wrap:wrap;margin-right:var(--space-16)}
.chip[role="radio"][aria-checked="true"]{background:var(--action-primary);color:var(--text-on-primary);border-color:var(--action-primary)}
.countdown{display:inline-block;min-width:1ch}

/* Scenario C: host */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-12);align-items:end}
.timeline{display:flex;flex-direction:column;margin-top:var(--space-16)}
.tl{position:relative;display:flex;gap:var(--space-16);padding-bottom:var(--space-20)}
.tl:not(:last-child)::before{content:"";position:absolute;left:calc(var(--size-radio) / 2 - 1px);top:var(--size-radio);bottom:0;width:2px;background:var(--border-subtle)}
.tl--done:not(:last-child)::before{background:var(--action-primary)}
.tl__dot{width:var(--size-radio);height:var(--size-radio);border-radius:var(--radius-full);flex:none;border:2px solid var(--border-strong);background:var(--surface-default);display:flex;align-items:center;justify-content:center;margin-top:var(--space-4)}
.tl--done .tl__dot{background:var(--action-primary);border-color:var(--action-primary)}
.tl--done .tl__dot .icon{color:var(--icon-on-primary);stroke-width:2.5}
.tl--now .tl__dot{border-color:var(--border-brand)}
.tl--now .tl__dot::after{content:"";width:var(--space-12);height:var(--space-12);border-radius:var(--radius-full);background:var(--action-primary)}
.tl--next .t-title{color:var(--text-secondary)}
.card .timeline{margin-top:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-8)}
.stat{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-12)}
.stat__num{font:var(--type-heading-2);color:var(--text-brand)}
.stat__cap{font:var(--type-caption);color:var(--text-secondary);margin-top:var(--space-4)}
.scanbox{position:relative;height:var(--size-hero);border-radius:var(--radius-lg);background:var(--surface-subtle);display:flex;align-items:flex-end;justify-content:center;padding:var(--space-16)}
.scanbox__frame{position:absolute;left:50%;top:var(--space-24);width:var(--size-illus);height:var(--size-illus);transform:translateX(-50%);border:2px dashed var(--border-strong);border-radius:var(--radius-md)}
.scanbox .placeholder{position:relative;font:var(--type-body-small);text-align:center}
.checkrow__done{display:flex;align-items:center;justify-content:space-between;min-height:var(--size-tap-min);padding:0 var(--space-8);border-radius:var(--radius-full);background:var(--surface-default)}
.checkrow.is-removed .item__thumb{background:var(--surface-default)}
.x01__bar{margin:calc(var(--space-8) * -1) calc(var(--space-20) * -1) var(--space-16);padding:var(--space-8) var(--space-20);background:var(--surface-subtle)}
.x01__bar span{display:block;text-align:center;background:var(--surface-default);border-radius:var(--radius-full);padding:var(--space-8);font:var(--type-body-small);color:var(--text-secondary)}
.x01__row{display:block}
.shelf--wide{width:100%}

/* =====================================================================
   5. COMPONENT GALLERY (#/components only)
   ===================================================================== */
.gal h1{margin-bottom:var(--space-8)}
.gal__intro{color:var(--text-secondary);font:var(--type-body-small);margin-bottom:var(--space-24)}
.gal__toc{display:flex;flex-wrap:wrap;gap:var(--space-8);margin-bottom:var(--space-32)}
.gal__toc a{font:var(--type-label);color:var(--text-link);padding:var(--space-4) var(--space-8);border-radius:var(--radius-xs);background:var(--surface-default)}
.gal__sec{padding-top:var(--space-32);margin-top:var(--space-32);border-top:1px solid var(--border-subtle);scroll-margin-top:var(--space-16)}
.gal__sec > h2{margin-bottom:var(--space-4)}
.gal__sec > .gal__recipe{font:var(--type-caption);color:var(--text-secondary);margin-bottom:var(--space-16)}
.gal__state{display:block;font:var(--type-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--text-secondary);margin:var(--space-16) 0 var(--space-8)}
.gal__brand{background:var(--surface-brand);border-radius:var(--radius-lg);padding:var(--space-16)}
.gal__swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-8)}
.swatch{border-radius:var(--radius-md);overflow:hidden;background:var(--surface-default);border:1px solid var(--border-subtle);font:var(--type-caption)}
.swatch__chip{height:40px}
.swatch__name{padding:var(--space-4) var(--space-8);color:var(--text-primary);word-break:break-all}
.gal__icons{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-8)}
.gal__icon{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-8) var(--space-4);background:var(--surface-default);border-radius:var(--radius-sm);font:var(--type-caption);color:var(--text-secondary);text-align:center;word-break:break-word}
.gal__wrap{display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center}

/* Illustrations v2 (assets/illustrations/, inlined by tools/illus.js; UI.art) */
.art{display:flex;justify-content:center}
.art svg{display:block;width:100%;max-width:100%;height:auto}
.art--illus svg{width:auto;height:var(--size-illus)}
.art--sm svg{width:auto;height:var(--size-illus-sm)}

/* =====================================================================
   6. REDUCED MOTION
   ===================================================================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .nfc__ring{display:none}
}
</style>

/* =====================================================================
   ROUTER: hash routes, push / back / tab crossfade, finished flows replace history
   ===================================================================== */
const TAB_ROOTS = ['/home', '/map', '/coupons', '/me', '/host/dashboard', '/host/check', '/host/redeem'];
const defaultRoute = () => !Store.state.onboarded ? '#/welcome' : Store.state.mode === 'host' ? '#/host/dashboard' : '#/home';
const homeRoute = () => Store.state.mode === 'host' ? '#/host/dashboard' : '#/home';
const Router = {
  routes: [],
  stack: [],
  scroll: {},
  add(pattern, view, opts = {}) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:([a-z]+)/g, (_, k) => (keys.push(k), '([^/]+)')) + '$');
    this.routes.push({ pattern, re, keys, view, opts });
  },
  parse() {
    const raw = location.hash.replace(/^#/, '') || '';
    const [path, qs = ''] = raw.split('?');
    return { path: path || '', query: Object.fromEntries(new URLSearchParams(qs)), raw };
  },
  match(path) {
    for (const r of this.routes) { const m = path.match(r.re); if (m) return { r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) }; }
    return null;
  },
  go(hash) { if (location.hash === hash) this.render('none'); else location.hash = hash; },
  replace(hash) { if (location.hash === hash) { this.render(this._fade ? 'fade' : 'none'); this._fade = false; return; } this._replace = true; location.replace(hash); },
  back() { if (this.stack.length > 1) history.back(); else { this._fade = true; this.replace(homeRoute()); } },
  /* Flow done → Home: step history back to where the flow was entered, then replace it,
     so Back from Home doesn't return into the finished flow. */
  finish(hash = homeRoute()) {
    const s = this.stack; let idx = -1;
    for (let i = s.length - 2; i >= 0; i--) { const m = this.match(s[i].split('?')[0]); if (!m || !m.r.opts.flow) { idx = i; break; } }
    const steps = idx < 0 ? 0 : s.length - 1 - idx;
    if (steps <= 0) { this.stack = []; this._fade = true; this.replace(hash); return; }
    this._after = { hash, keep: idx + 1 }; history.go(-steps);
  },
  direction(raw) {
    const s = this.stack;
    if (this._replace) { this._replace = false; s[s.length - 1] = raw; if (!s.length) s.push(raw); if (this._fade) { this._fade = false; return 'fade'; } return 'fwd'; }
    if (s.length > 1 && s[s.length - 2] === raw) { s.pop(); return 'back'; }
    if (s[s.length - 1] === raw) return 'none';
    s.push(raw); return s.length === 1 ? 'none' : 'fwd';
  },
  render(dirOverride) {
    const { path, query, raw } = this.parse();
    if (this._after) {
      const a = this._after; this._after = null; this.stack.length = a.keep;
      if ('#' + raw !== a.hash) { this._fade = true; this._replace = true; location.replace(a.hash); return; }
      this.stack[this.stack.length - 1] = raw; dirOverride = 'fade';
    }
    const found = this.match(path);
    if (!found) { this._fade = true; this._replace = true; location.replace(defaultRoute()); return; }
    const { r, params } = found;
    if (r.opts.guard && !r.opts.guard({ params, query })) { this._fade = true; this.replace(r.opts.guardTo || homeRoute()); return; }
    const stage = $('#stage');
    const leaving = c => ['leave-fwd', 'leave-back', 'tab-out-l', 'tab-out-r'].some(k => c.classList.contains(k));
    const old = stage.firstElementChild && !leaving(stage.firstElementChild) ? stage.firstElementChild : null;
    let dir = dirOverride || this.direction(raw);
    const isRoot = TAB_ROOTS.includes(path) && !raw.includes('?');
    if (old && old._root && isRoot && old._path !== path && dir !== 'none') dir = 'tab';
    if (old && old._root) this.scroll[old._path] = old.scrollTop;
    $$('.screen', stage).forEach(s => { if (s !== old) s.remove(); });
    if (old && old._cleanup) { old._cleanup(); old._cleanup = null; }
    { const sh = $('#sheet'); sh._close && sh._close(true); } if (Overlay.current && !Overlay.current.keep) Overlay.hide(true);
    const el = document.createElement('section');
    el.className = 'screen' + (r.opts.cls ? ' ' + r.opts.cls : '');
    el.setAttribute('aria-label', r.opts.title || 'SecondShelf');
    el._path = path; el._root = isRoot;
    el.innerHTML = r.view.html({ params, query });
    stage.appendChild(el);
    // tab bar (host routes always show the host tabs)
    const tb = $('#tabbar');
    const prevInd = !tb.hidden && $('.tabbar__ind', tb), prevI = prevInd ? +prevInd.dataset.i : -1, prevMode = tb.dataset.mode;
    let tabMove = '';
    if (r.opts.tabs) {
      const mode = r.opts.tabMode || Store.state.mode;
      tb.hidden = false; tb.innerHTML = UI.tabBar(mode, r.opts.tabs); tb.dataset.mode = mode; $('#app').classList.add('has-tabs');
      // slide the Leaf pill from the old tab to the new one (same tab set only)
      const ind = $('.tabbar__ind', tb), i = +ind.dataset.i;
      if (prevI >= 0 && i >= 0 && prevI !== i && prevMode === mode) tabMove = i > prevI ? 'r' : 'l';
      if (prevI >= 0 && i >= 0 && prevI !== i && prevMode === mode && !reduceMotion()) {
        ind.style.transition = 'none'; ind.style.setProperty('--tab-i', prevI); void ind.offsetWidth;
        ind.style.transition = ''; ind.style.setProperty('--tab-i', i);
      }
    }
    else { tb.hidden = true; $('#app').classList.remove('has-tabs'); }
    $('#app').classList.toggle('has-actionbar', !!r.opts.actionbar);
    // transition: push / back slide 250 ms, tab crossfade 150 ms, reduced motion = instant swap
    const anim = !reduceMotion() && old && dir !== 'none';
    if (anim && tabMove && dir !== 'fade') {
      const inC = tabMove === 'r' ? 'tab-in-r' : 'tab-in-l', outC = tabMove === 'r' ? 'tab-out-l' : 'tab-out-r';
      el.classList.add(inC); old.classList.add(outC);
      setTimeout(() => { old.remove(); el.classList.remove(inC); }, 210);
    }
    else if (anim && (dir === 'tab' || dir === 'fade')) { el.classList.add('enter-fade'); old.remove(); setTimeout(() => el.classList.remove('enter-fade'), 160); }
    else if (anim) {
      el.classList.add(dir === 'back' ? 'enter-back' : 'enter-fwd');
      old.classList.add(dir === 'back' ? 'leave-back' : 'leave-fwd');
      setTimeout(() => { old.remove(); el.classList.remove('enter-back', 'enter-fwd'); }, 260);
    } else if (old) old.remove();
    if (isRoot && (dir === 'tab' || dir === 'back') && this.scroll[path]) el.scrollTop = this.scroll[path];
    document.title = (r.opts.title ? r.opts.title + ' · ' : '') + 'SecondShelf';
    Store.log('view', { route: raw || path, code: r.opts.code || '' });
    r.view.mount && r.view.mount(el, { params, query });
    const h = $('h1', el); if (h && dir !== 'none') { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    document.dispatchEvent(new CustomEvent('routed', { detail: { path, query, code: r.opts.code } }));
  }
};

document.addEventListener('click', e => {
  const t = e.target;
  // steppers
  const sb = t.closest('[data-step]');
  if (sb && !sb.disabled) {
    const wrap = sb.closest('[data-stepper]');
    const min = +wrap.dataset.min, max = +wrap.dataset.max;
    const v = $('.stepper__value', wrap);
    const n = Math.min(max, Math.max(min, +v.textContent + +sb.dataset.step));
    v.textContent = n; v.classList.remove('num-fade'); void v.offsetWidth; v.classList.add('num-fade');
    $('[data-step="-1"]', wrap).disabled = n <= min;
    $('[data-step="1"]', wrap).disabled = n >= max;
    wrap.dispatchEvent(new CustomEvent('stepper', { bubbles: true, detail: { id: wrap.dataset.stepper, value: n } }));
    return;
  }
  // filter chips toggle
  const ch = t.closest('.chip[aria-pressed]');
  if (ch && !ch.hasAttribute('data-nochip')) {
    const on = ch.getAttribute('aria-pressed') !== 'true';
    ch.setAttribute('aria-pressed', on);
    const lead = $('svg', ch); const label = $('span', ch).textContent;
    if (on && !lead) ch.insertAdjacentHTML('afterbegin', icon('done'));
    if (!on && lead && !ch.dataset.icon) lead.remove();
    ch.dispatchEvent(new CustomEvent('chip', { bubbles: true, detail: { label, on } }));
    return;
  }
  // segmented control
  const seg = t.closest('.segmented__seg');
  if (seg) {
    const grp = seg.closest('[data-seg]');
    $$('.segmented__seg', grp).forEach(s => s.setAttribute('aria-selected', s === seg));
    grp.dispatchEvent(new CustomEvent('seg', { bubbles: true, detail: { id: grp.dataset.seg, index: +seg.dataset.segI } }));
    return;

  if (tg && !tg.disabled) {
    const on = tg.getAttribute('aria-checked') !== 'true';
    tg.setAttribute('aria-checked', on);
    tg.dispatchEvent(new CustomEvent('toggle', { bubbles: true, detail: { on } }));
    return;
  }
  // search clear
  const cl = t.closest('[data-clear]');
  if (cl) { const inp = document.getElementById(cl.dataset.clear); inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.focus(); return; }

  // rows that navigate

});

/* ---------- G02 Map (R01 with ?find=1): Leaflet on a mock, token-styled neighbourhood ---------- */
let MAP_SVG_CACHE = '';
function mapSvg() {
  if (MAP_SVG_CACHE) return MAP_SVG_CACHE;
  const r = rng(7), S = MAP_SIZE, P = [];
  const line = (pts) => 'M' + pts.map(p => p.join(' ')).join(' L');
  // parks
  const parks = [];
  for (let i = 0; i < 16; i++) { const w = 120 + r() * 220, hh = 100 + r() * 180, x = r() * (S - w), y = r() * (S - hh); parks.push(`<rect x="${x | 0}" y="${y | 0}" width="${w | 0}" height="${hh | 0}" rx="18"/>`); }
  // river and a lake
  const river = `M-40 ${S * .78} C ${S * .2} ${S * .7} ${S * .35} ${S * .9} ${S * .55} ${S * .84} S ${S * .85} ${S * .72} ${S + 40} ${S * .8}`;
  // minor street grid with jitter
  const minor = [];
  for (let y = 30; y < S; y += 70 + r() * 50) minor.push(line([[-20, y + (r() - .5) * 30], [S / 2, y + (r() - .5) * 50], [S + 20, y + (r() - .5) * 40]]));
  for (let x = 30; x < S; x += 70 + r() * 50) minor.push(line([[x + (r() - .5) * 30, -20], [x + (r() - .5) * 50, S / 2], [x + (r() - .5) * 40, S + 20]]));
  for (let i = 0; i < 40; i++) { const x = r() * S, y = r() * S; minor.push(line([[x, y], [x + 60 + r() * 120, y + (r() - .5) * 120]])); }
  // main roads
  const main = [
    line([[S * .45, -20], [S * .5, S * .35], [S * .47, S * .7], [S * .52, S + 20]]),
    line([[-20, S * .48], [S * .3, S * .5], [S * .7, S * .44], [S + 20, S * .46]]),
    line([[-20, S * .12], [S * .4, S * .25], [S + 20, S * .2]]),
    line([[S * .82, -20], [S * .78, S * .5], [S * .86, S + 20]]),
    line([[S * .15, -20], [S * .2, S * .6], [S * .1, S + 20]])
  ];
  MAP_SVG_CACHE = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${S} ${S}" preserveAspectRatio="none" aria-hidden="true">
    <rect width="${S}" height="${S}" style="fill:var(--map-land)"/>
    <g style="fill:var(--map-park)">${parks.join('')}</g>
    <path d="${river}" style="fill:none;stroke:var(--map-water);stroke-width:70;stroke-linecap:round"/>
    <ellipse cx="${S * .3}" cy="${S * .3}" rx="150" ry="90" style="fill:var(--map-water)"/>
    <path d="${minor.join(' ')}" vector-effect="non-scaling-stroke" style="fill:none;stroke:var(--map-road);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/>
    <path d="${main.join(' ')}" vector-effect="non-scaling-stroke" style="fill:none;stroke:var(--map-road-main);stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>
  </svg>`;
  return MAP_SVG_CACHE;
}

    el.addEventListener('click', e => {

      if (t.closest('[data-there]')) { const v = venue(sel); Store.log('im_there', { venue: v.id, mode: MapUI.mode }); Router.go(find() ? `#/take/tap?shelf=${v.id}` : `#/give/tap?shelf=${v.id}`); return; }
      if (t.closest('[data-notify]')) { Store.state.alert = { food: MapUI.food, km: 1 }; Store.save(); Store.log('food_alert', { on: true, food: MapUI.food, from: 'R01b' }); toast('success', `Food alert saved: ${esc(MapUI.food)} within 1 km`, { ms: 3500, ic: 'notification' }); return; }

/* shared NFC wiring for G04, R04 and H05 (one component, same states and fallbacks) */
NFC.bind = (el, { onFound, opts, fail = false, log = '' }) => {
  let failOnce = fail;
  el.addEventListener('click', e => {
    const sec = $('[data-nfc]', el); if (!sec) return;
    if (e.target.closest('[data-nfc-tap]')) {
      const f = Store.state.sim.tagFail || failOnce; failOnce = false;

      Store.log('nfc_tap', { screen: log, result: f ? 'not_found' : 'found' });
      NFC.tap(sec, { fail: f, onFound, opts });
    }
    if (e.target.closest('[data-nfc-qr]')) { Store.log('nfc_qr', { screen: log }); NFC.qr(sec, opts); }
    if (e.target.closest('[data-nfc-sampleqr]')) NFC.found(sec, { onFound, opts });
  });
  const onCode = () => { const sec = $('[data-nfc]', el); if (sec) { Store.log('shelf_code', { screen: log }); NFC.found(sec, { onFound, opts }); } };
  document.addEventListener('shelfcode', onCode);
  const prev = el._cleanup; el._cleanup = () => { document.removeEventListener('shelfcode', onCode); prev && prev(); };
};

        toast('success', editing ? 'Item updated' : 'Item added', { ms: 2000 });
      });
    };
    draw();
    el.addEventListener('click', e => {
      const rm = e.target.closest('[data-remove]');
      if (rm) {
        const idx = d.items.findIndex(i => i.id === rm.dataset.remove); const [gone] = d.items.splice(idx, 1);
        draw(); Store.log('item_remove', { id: gone.id });
        toast('info', `${esc(gone.name)} removed`, { action: 'Undo', ic: 'remove', onAction: () => { d.items.splice(idx, 0, gone); draw(); Store.log('item_undo', { id: gone.id }); } });
      }
      const ed = e.target.closest('[data-edit]');
      if (ed) openForm(d.items.find(i => i.id === ed.dataset.edit));
      if (e.target.closest('[data-add]')) openForm(null);
      const c = e.target.closest('#confirm'); if (c) Views.giveItems.confirm(c);
    });
    el.addEventListener('stepper', e => { const it2 = d.items.find(i => 'q-' + i.id === e.detail.id); if (it2) { it2.qty = e.detail.value; sync(); } });
    el.addEventListener('change', e => { if (e.target.id === 'sealed') { d.sealed = e.target.checked; sync(); } });
    if (query.add) setTimeout(() => openForm(null), reduceMotion() ? 0 : 300);
  },
  async confirm(btn) {
    await simulate(btn, 700);
    const s = Store.state, d = s.draft; if (!d) return;
    const res = Ops.dropOff(d.shelf, d.items);
    Store.log('dropoff', { items: res.count, capped: res.capped });

};

const monthName = () => new Date().toLocaleString('en-GB', { month: 'long' });
const pl = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`;
/* QA 15 Nov (overrides "To be agreed" on coupons, see Q89): demo values. Bigger drop-off = bigger coupon;
   expiry = about a month after the drop-off, plus a few random days. */
const couponValueFor = n => n >= 4 ? 4 : 2;
const couponExpiryFrom = t => { const d = new Date(t); d.setDate(d.getDate() + 28 + Math.floor(Math.random() * 6)); return d.toISOString().slice(0, 10); };
const couponValue = c => `€${(c && c.value) || 2}`;
const couponExpiry = c => { const d = new Date(((c && c.expires) || couponExpiryFrom(Date.now())) + 'T12:00:00'); return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); };
/* radio groups (role="radio" buttons with data-radio="group") */
document.addEventListener('click', e => {
  const r = e.target.closest('[role="radio"][data-radio]');
  if (!r) return;
  const grp = r.dataset.radio, scope = r.closest('[role="radiogroup"]') || document;
  $$(`[data-radio="${grp}"]`, scope).forEach(b => { const on = b === r; b.setAttribute('aria-checked', on); b.classList.toggle('is-on', on); });
  r.dispatchEvent(new CustomEvent('radio', { bubbles: true, detail: { name: grp, value: r.dataset.value } }));
});

/* =====================================================================
   OPS: every action updates every place that shows it (hand-off §4)
   ===================================================================== */
const Ops = {
  /* giver drop-off (G06 Confirm) */
  dropOff(venueId, items) {
    const s = Store.state, sh = shelfOf(venueId), n = items.reduce((a, i) => a + i.qty, 0), stamp = Date.now();
    const bid = 'b' + stamp, rows = [];
    items.forEach((i, k) => {
      const rowId = 'r' + stamp + k;
      sh.items.push({ id: 'x' + stamp + k, name: i.name, cat: i.cat || 'Pasta', bb: i.bb, qty: i.qty, days: 0, owner: s.persona, drop: bid, mine: rowId, missing: false });
      rows.push({ id: rowId, name: i.short || shortName(i.name), qty: i.qty, picked: 0, venue: venueId, days: 0, drop: bid });
    });
    s.shelfItems.unshift(...rows);
    s.bonuses.unshift({ id: bid, venue: venueId, picked: 0, total: n, rows: rows.map(r => r.id), at: Date.now() });
    const capped = !!s.sim.cap;
    let cid = null;
    if (!capped) { cid = 'c' + stamp; s.coupons.unshift({ id: cid, venue: venueId, state: 'active', code: 'SS-4821', value: couponValueFor(n), expires: couponExpiryFrom(Date.now()) }); s.couponsThisMonth++; }
    s.sim.cap = false;
    s.impact.passed += n;
    s.lastDrop = { venue: venueId, count: n, coupon: cid, bonus: bid, capped };
    hostLog('dropoff', `Drop-off · ${pl(n, 'item')}`);
    Store.save();
    return s.lastDrop;
  },
  /* receiver pickup (R05 Confirm, X01, Simulate). picks = [{ id, qty }]. app=false: no-app pickup, no Rescue Bonus move (X01). */
  pickup(venueId, picks, { app = true, source = 'app' } = {}) {
    const s = Store.state, sh = shelfOf(venueId); let n = 0, mine = 0;
    picks.forEach(p => {
      const item = sh.items.find(i => i.id === p.id); if (!item) return;
      const q = Math.min(p.qty, item.qty); if (q <= 0) return;
      item.qty -= q; n += q;
      if (item.owner) {
        const row = s.shelfItems.find(r => r.id === item.mine);
        if (row) row.picked = Math.min(row.qty, row.picked + q);
        if (app && item.drop) { const b = s.bonuses.find(x => x.id === item.drop); if (b) b.picked = Math.min(b.total, b.picked + q); }
        if (item.owner === s.persona) mine += q;
      }
    });
    sh.items = sh.items.filter(i => i.qty > 0);
    s.host.stats.pickups++;
    if (mine) s.impact.saved += mine;
    hostLog('pickup', `Pickup · ${pl(n, 'item')}${source === 'web' ? ' · no app' : ''}`);
    if (mine && s.persona === 'brenda') s.rescueBanner = { count: mine, venue: venueId };
    Store.save();
    return n;
  },
  /* report / "Not here?" (R05, R07): the item greys out; the bonus is not changed (open question Q46) */
  report(venueId, itemId, reason, note = '') {
    const s = Store.state, sh = shelfOf(venueId), item = sh.items.find(i => i.id === itemId);
    if (item && (reason === 'Missing' || reason === 'Not here')) item.missing = true;
    if (item) item.flag = reason;
    s.reports.push({ venue: venueId, item: itemId, reason, note, t: Date.now() });
    hostLog('report', `Report · ${item ? shortName(item.name) : 'shelf'} · ${reason}`);
    Store.save();
  },
  pause(venueId, reason, until) { shelfOf(venueId).paused = { reason, until }; hostLog('pause', `Shelf paused · ${reason}`); Store.save(); },
  resume(venueId) { shelfOf(venueId).paused = null; hostLog('pause', 'Shelf open again'); Store.save(); },
  redeem(code) {
    const s = Store.state, c = s.coupons.find(x => x.code === code && x.state === 'active') || s.coupons.find(x => x.code === code);
    if (c) { c.state = 'used'; c.usedAt = 'today at ' + nowHM(); }
    s.host.stats.redeemed++;
    s.redeemed = s.redeemed || {}; s.redeemed[code] = 'today at ' + nowHM();
    hostLog('redeem', `Coupon redeemed · ${code}`);
    Store.save();
  }
};

/* Jump: prepare the state a screen needs, then go there (moderator menu, #/screens) */
const Jump = {
  go(route) {
    const s = Store.state;
    const [path, qs = ''] = route.replace(/^#/, '').split('?');
    const q = Object.fromEntries(new URLSearchParams(qs));
    if (!/^\/(welcome|how|role|rules)$/.test(path)) s.onboarded = true;
    if (q.as === 'jonas') { Mod.scenario('B', false); }
    if (/^\/give\/(photo|reading|items)/.test(path) && !s.draft) Flow.start(1);
    if (path === '/give/items' && !s.draft.items) s.draft.items = AI_ITEMS();
    if (path === '/give/done' && (!s.lastDrop || (q.cap && !s.lastDrop.capped))) { if (q.cap) s.sim.cap = true; Ops.dropOff(1, AI_ITEMS()); }
    if (path === '/bonus' && !s.bonuses.length) Ops.dropOff(1, AI_ITEMS());
    if (/^\/take\/(items|done)/.test(path) && !s.pickup) Pick.start(1, true);
    if (path === '/take/done' && !s.lastPickup) { const sh = shelfOf(1); Pick.commit([{ id: sh.items[0].id, qty: 1 }]); }
    if (path.startsWith('/host/')) {
      const order = ['none', 'applied', 'verified', 'live'];
      const need = /dashboard|pause|redeem|check/.test(path) ? 'live' : /verify|kit|activate|live/.test(path) ? 'verified' : /review/.test(path) ? 'applied' : 'none';
      if (order.indexOf(s.host.status) < order.indexOf(need)) s.host.status = need;
      if (need === 'live') s.mode = 'host';
    }
    if (path === '/host/check/done' && !s.host.lastCheck) Check.fake();
    if (q.sim === 'expired') { const c = s.coupons.find(x => x.code === q.code); if (c) c.state = 'expired'; }
    if (q.sim === 'missed') { s.host.missed = true; s.host.checkDue = true; }
    Store.save();
    const clean = '#' + path + (qs ? '?' + qs.split('&').filter(x => !/^(as|sim)=/.test(x) || /^sim=(travel|rescue)/.test(x)).join('&') : '');
    Router.go(clean.replace(/\?$/, ''));
  }
};

      <p class="t-small c-secondary">For the test team only. Participants never see this menu.</p>
      <div class="mod__sec" style="border:0;margin-top:0"><p class="field__label">Choose scenario</p>
        <div class="stack-8">${UI.button({ label: 'A · giver (Brenda) → Home', variant: 'secondary', attrs: 'data-mod-scn="A"' })}${UI.button({ label: 'B · receiver (Jonas) → Home', variant: 'secondary', attrs: 'data-mod-scn="B"' })}${UI.button({ label: 'C · host → Become a host', variant: 'secondary', attrs: 'data-mod-scn="C"' })}</div></div>
      <div class="mod__sec"><label class="field__label" for="mod-jump">Jump to screen</label><select id="mod-jump" class="select">${opts}</select>${UI.button({ label: 'Go', attrs: 'data-mod-go' })}</div>

        <div class="mod__grid">${UI.button({ label: 'Export log (JSON)', variant: 'secondary', icon: 'share', attrs: 'data-mod-export' })}${UI.button({ label: 'Screen index', variant: 'secondary', icon: 'list', attrs: 'data-mod-screens' })}</div></div>
      <div class="mod__sec"><p class="field__label">Test city (map)</p>${UI.segmented(CITY_ORDER.map(c => CITIES[c].name), CITY_ORDER.indexOf(curCity()), { id: 'mod-city', block: true })}<p class="t-small c-secondary">Moves you and every shelf to the city; Reset demo goes back to Tallinn.</p></div>

    </div>`);
    const sheet = $('#sheet');
    sheet.onclick = e => {
      const t = e.target;
      const city = t.closest('[data-seg="mod-city"] [data-seg-i]'); if (city) { this.city(CITY_ORDER[+city.dataset.segI]); return; }
      const scn = t.closest('[data-mod-scn]'); if (scn) { this.scenario(scn.dataset.modScn); return; }
      if (t.closest('[data-mod-go]')) { const r = $('#mod-jump').value; closeSheet(); Jump.go(r); return; }
      const sim = t.closest('[data-mod-sim]'); if (sim) { closeSheet(); this.sim(sim.dataset.modSim); return; }
      if (t.closest('[data-mod-export]')) { this.export(); return; }
      if (t.closest('[data-mod-screens]')) { closeSheet(); Router.go('#/screens'); return; }
      if (t.closest('[data-mod-reset]')) { Store.reset(); MapUI.filters.clear(); MapUI.food = ''; MapUI.center = null; MapUI.sheet = 'half'; closeSheet(); Router.stack = []; Router.replace('#/welcome'); toast('success', 'Demo reset', { ms: 2000 }); }
    };
  },
  sim(k) {
    const s = Store.state; Store.log('simulate', { what: k });
    const note = t => toast('info', t, { ms: 3500, ic: 'info' });
    if (k === 'tagFail') { s.sim.tagFail = true; Store.save(); note('Next tag tap will not find the tag.'); }
    if (k === 'photoFail') { s.sim.photoFail = true; Store.save(); note('Next photo will be unreadable.'); }
    if (k === 'cap') { s.sim.cap = true; Store.save(); note('Next drop-off reaches the monthly coupon limit.'); }
    if (k === 'pickup2') {
      const mine = []; VENUES.forEach(v => shelfOf(v.id).items.forEach(i => { if (i.owner === s.persona && !i.missing) mine.push([v.id, i]); }));
      mine.sort((a, b) => (b[1].drop ? 1 : 0) - (a[1].drop ? 1 : 0));
      if (!mine.length) { note('No items of yours are on a shelf. Leave food first.'); return; }
      const vId = mine[0][0], picks = []; let left = 2;
      mine.filter(m => m[0] === vId).forEach(([, i]) => { if (left > 0) { const q = Math.min(left, i.qty); picks.push({ id: i.id, qty: q }); left -= q; } });
      Ops.pickup(vId, picks);
      if (location.hash.startsWith('#/home')) Router.render('none'); else Router.go('#/home');
    }
    if (k === 'travel') { s.seenTravel = false; Store.save(); if (location.hash === '#/home') Banners.travel(); else Router.go('#/home?sim=travel'); }
    if (k === 'alert') { if (!s.alert) s.alert = { food: 'Pasta', km: 1 }; Store.save(); Banners.alert(); }
    if (k === 'used') { Store.state.mode = 'host'; if (Store.state.host.status !== 'live') Store.state.host.status = 'live'; Store.save(); Router.go('#/host/redeem/result?code=SS-4790'); }
    if (k === 'expired') { const c = s.coupons.find(x => x.state === 'active'); if (!c) { note('No active coupon to expire.'); return; } c.state = 'expired'; Store.save(); note(`${c.code} is now expired (Coupons › Used; H07c if checked).`); if (location.hash.startsWith('#/coupons')) Router.render('none'); }
    if (k === 'withdrawn') { const c = s.coupons.find(x => x.state === 'active'); if (!c) { note('No active coupon to withdraw.'); return; } c.state = 'withdrawn'; Store.save(); couponTab = 1; Router.go('#/coupons'); if (location.hash === '#/coupons') Router.render('none'); }
    if (k === 'missed') { s.host.missed = true; s.host.checkDue = true; s.host.lastCheck = null; s.host.status = 'live'; s.mode = 'host'; Store.save(); Router.go('#/host/dashboard'); if (location.hash === '#/host/dashboard') Router.render('none'); }
    if (k === 'paused') { Ops.pause(1, 'Café closed', 'Tomorrow at opening'); note('Café Daisy is paused.'); Router.render('none'); }
    if (k === 'full') { const sh = shelfOf(1), free = sh.capacity - shelfCount(sh); if (free > 0) sh.items.push(it('fill' + Date.now(), 'Biscuits, 300 g', 'Biscuits', '04/2027', free, 0)); Store.save(); note('Café Daisy is now a full shelf.'); Router.render('none'); }
  },
  export() {
    const data = JSON.stringify({ exported: new Date().toISOString(), persona: Store.state.persona, timings: Store.state.timings, events: Store.state.events }, null, 2);
    try {
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = `secondshelf-log-${Date.now()}.json`; document.body.appendChild(a); a.click(); a.remove();
      toast('success', 'Log exported', { ms: 2000 });
    } catch (e) { toast('error', 'Couldn’t export the log'); }
  }
};

const REASONS = ['Missing', 'Opened or damaged', 'Past its date', 'Other'];
/* R07 Report a problem (sheet over R03–R06) → R07b Report sent */
function openReport(venueId, { itemId = '', onSent } = {}) {
  const v = venue(venueId), items = shelfOf(venueId).items.filter(i => i.qty > 0 || i.missing);
  const st = { reason: '', item: itemId };
  const chips = () => REASONS.map(r => `<button type="button" role="radio" class="chip" aria-checked="${st.reason === r}" data-radio="reason" data-value="${esc(r)}">${st.reason === r ? icon('done') : ''}<span>${esc(r)}</span></button>`).join('');
  openSheet('Report a problem', `<form id="r07" class="stack" novalidate>
      <div><p class="field__label" id="r07-why">What’s wrong?</p><div class="chips" style="flex-wrap:wrap;margin-top:var(--space-8)" role="radiogroup" aria-labelledby="r07-why" id="r07-reasons">${chips()}</div></div>
      <div class="field" id="r07-item-f"><label class="field__label" for="r07-item">Which item?</label>
        <select class="select" id="r07-item"><option value="">Choose an item</option>${items.map(i => `<option value="${esc(i.id)}" ${i.id === itemId ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}<option value="shelf">The whole shelf</option></select></div>
      <div class="field"><label class="field__label" for="r07-note">Note (optional)</label><textarea class="input" id="r07-note" placeholder="e.g. only one can left"></textarea></div>
      <div class="center">${UI.button({ label: 'Add a photo (optional)', variant: 'link', icon: 'camera', attrs: 'data-r07-photo' })}</div>
      ${UI.gated({ label: 'Send report', id: 'r07-send', hint: 'Choose what’s wrong and which item', missing: '#r07-reasons, #r07-item-f', attrs: 'type="submit"' }).replace('type="button" ', '')}
    </form>`);
  const form = $('#r07'), btn = $('#r07-send'), sel = $('#r07-item');
  const sync = () => gate(btn, !!(st.reason && st.item));
  form.addEventListener('radio', e => { st.reason = e.detail.value; $('#r07-reasons').innerHTML = chips(); $(`#r07-reasons [data-value="${CSS.escape(st.reason)}"]`).focus(); sync(); });
  sel.addEventListener('change', () => { st.item = sel.value; sync(); });
  form.addEventListener('click', e => { if (e.target.closest('[data-r07-photo]')) { e.preventDefault(); const b = e.target.closest('[data-r07-photo]'); b.querySelector('span').textContent = 'Photo added (placeholder)'; } });
  form.addEventListener('submit', async e => {
    e.preventDefault(); if (btn.getAttribute('aria-disabled') === 'true') return;
    await simulate(btn, 700);
    Ops.report(venueId, st.item === 'shelf' ? '' : st.item, st.reason, $('#r07-note').value);
    Store.log('report', { venue: venueId, reason: st.reason }); buzz();
    const missing = st.reason === 'Missing';
    $('#sheet .sheet__body').innerHTML = `<div class="stack center stagger" role="status">${UI.tick()}<h2 class="t-h2">Thanks for telling us</h2>
      <p class="t-body c-secondary">The café’s shelf steward will check the shelf.${missing ? ' The listing now shows the item as missing.' : ''}</p>
      ${UI.button({ label: 'Done', block: true, attrs: 'data-sheet-close' })}</div>`;
    $('#sheet .sheet__head h2').textContent = 'Report sent';
    $('#sheet [data-sheet-close].btn').focus();
    onSent && onSent();
  });
  sync();
}

const PICK_OPTS = { idleText: '', note: 'Look for the arrow on the SecondShelf sign.' };
Views.takeTap = {

  },
  tap() {
    return `${UI.stepHeader({ title: 'Pick up', step: 1, of: 2, first: true })}
      <h2 class="t-display tap-title">Tap the tag</h2>
      <p class="tap-sub">Hold your phone to the tag on the shelf</p>
      <div id="nfc-slot">${UI.nfc({ state: 'idle', id: 'r04', ...PICK_OPTS })}</div>`;
  },
  notFound() {
    return `${UI.stepHeader({ step: 1, of: 2, first: true, layout: 'stack', h1: 'Tag not found' })}
      <p class="t-body" style="color:var(--text-on-inverse-secondary)">Nothing was taken or logged yet.</p>
      <div class="r04c__icon">${UI.tick('brand', 'needs-attention')}</div>
      <p class="t-body-large">Hold the top of your phone flat against the tag on the shelf for a second.</p>
      <p class="t-body" style="color:var(--text-on-inverse-secondary);margin-top:var(--space-12)">The tag sits next to the arrow on the SecondShelf sign.</p>
      <div class="spacer"></div>
      <div class="actions">
        ${UI.button({ label: 'Try again', variant: 'on-brand', icon: 'retry', block: true, attrs: 'data-r04-retry' })}
        ${UI.button({ label: 'Scan the QR code instead', variant: 'outline-on-brand', icon: 'qr-code', block: true, attrs: 'data-r04-qr' })}
        ${UI.button({ label: 'Type shelf code', variant: 'outline-on-brand', icon: 'shelf-code', block: true, attrs: 'data-action="shelf-code"' })}
      </div>`;
  },
  mount(el, { query }) {
    const shelf = +query.shelf || (Pick.d && Pick.d.shelf) || 1;
    if (!Pick.d || Pick.d.shelf !== shelf) Pick.start(shelf);
    if (!Store.state.tasks.pickup) Task.start('pickup');
    const root = $('#r04', el);
    const next = () => Router.go('#/take/items');
    let failNext = query.fail === '1';
    const showTap = (state = 'idle') => {
      root.innerHTML = Views.takeTap.tap();
      if (state === 'qr') NFC.qr($('[data-nfc]', root), PICK_OPTS);
      $('h1', root).setAttribute('tabindex', '-1'); $('h1', root).focus({ preventScroll: true });
    };
    const opts = { ...PICK_OPTS, onFail: () => setTimeout(() => { root.innerHTML = Views.takeTap.notFound(); el.classList.add('is-r04c'); const t = $('h1', root); t.setAttribute('tabindex', '-1'); t.focus({ preventScroll: true }); Store.log('view', { code: 'R04c' }); }, 700) };
    el.addEventListener('click', e => {
      if (e.target.closest('[data-r04-continue]')) { Store.log('r04_checked'); showTap(); }
      if (e.target.closest('[data-r04-retry]')) { el.classList.remove('is-r04c'); showTap(); }
      if (e.target.closest('[data-r04-qr]')) { el.classList.remove('is-r04c'); showTap('qr'); }
      const sec = $('[data-nfc]', el); if (!sec) return;
      if (e.target.closest('[data-nfc-tap]')) {
        const f = Store.state.sim.tagFail || failNext; failNext = false;
        if (Store.state.sim.tagFail) { Store.state.sim.tagFail = false; Store.save(); }
        Store.log('nfc_tap', { screen: 'R04', result: f ? 'not_found' : 'found' });
        NFC.tap(sec, { fail: f, onFound: next, opts });
      }
      if (e.target.closest('[data-nfc-qr]')) NFC.qr(sec, PICK_OPTS);
      if (e.target.closest('[data-nfc-sampleqr]')) NFC.found(sec, { onFound: next, opts: PICK_OPTS });
    });
    const onCode = () => { const sec = $('[data-nfc]', el); if (sec) NFC.found(sec, { onFound: next, opts: PICK_OPTS }); else next(); };
    document.addEventListener('shelfcode', onCode);
    el._cleanup = () => document.removeEventListener('shelfcode', onCode);
  }
};

      const id = e.target.dataset.pickBox; if (!id) return;
      if (e.target.checked) sel[id] = sel[id] || 1; else delete sel[id];
      const r = $(`[data-pick="${id}"]`, el); r.outerHTML = row(items().find(i => i.id === id)); $(`#pk-${CSS.escape(id)}`, el).focus();
      sync();
    });
    el.addEventListener('stepper', e => { const id = e.detail.id.replace(/^take-/, ''); if (sel[id]) { sel[id] = e.detail.value; sync(); } });
    el.addEventListener('click', e => {
      const nh = e.target.closest('[data-nothere]');
      if (nh) { const id = nh.dataset.nothere; delete sel[id]; Ops.report(d.shelf, id, 'Not here'); Store.log('not_here', { item: id }); draw(); toast('info', 'The shelf steward will be told', { ms: 3500, ic: 'needs-attention' }); return; }
      if (e.target.closest('[data-report]')) { openReport(d.shelf, { onSent: draw }); return; }
      const c = e.target.closest('#pick-confirm'); if (c) Views.takeItems.confirm(c);
    });
  },
  async confirm(btn) {
    await simulate(btn, 700);
    const d = Pick.d; if (!d) return;
    const picks = Object.entries(d.sel).map(([id, qty]) => ({ id, qty }));
    const n = Pick.commit(picks);
    Store.log('pickup', { items: n }); buzz();
    Router.replace('#/take/done');
  }
};

/* ---------- H08 Daily shelf check · H08b check done ---------- */
const flagReason = i => i.flag ? `Reported: ${i.flag.toLowerCase()}` : bbPast(i.bb) ? `Past its date (${i.bb})` : `On the shelf ${i.days} days · still in date`;
const isFlagged = i => i.days >= 7 || bbPast(i.bb) || !!i.flag;
const Check = {
  fresh() { const h = Store.state.host, sh = shelfOf(h.venue); h.check = { started: Date.now(), list: { tidy: false, tag: false, sign: false }, decide: {}, missing: [], by: h.staff[0], items: sh.items.filter(isFlagged).map(i => i.id) }; Store.save(); },
  submit() {
    const s = Store.state, h = s.host, c = h.check, sh = shelfOf(h.venue), dur = Date.now() - c.started;
    const name = id => { const i = sh.items.find(x => x.id === id); return i ? shortName(i.name) : ''; };
    const kept = c.items.filter(id => c.decide[id] === 'keep').map(name), removed = c.items.filter(id => c.decide[id] === 'remove').map(name);
    sh.items.forEach(i => { if (c.decide[i.id] === 'remove' || c.missing.includes(i.id)) i.qty = 0; if (c.decide[i.id] === 'keep') { i.flag = null; i.missing = false; } });
    sh.items = sh.items.filter(i => i.qty > 0);
    const t = Math.round(dur / 1000);
    h.lastCheck = { by: c.by, time: nowHM(), dur: `${Math.floor(t / 60)} min ${t % 60} s`, kept, removed, missing: c.missing.map(name) };
    h.checkDue = false; h.missed = false; h.check = null;
    hostLog('check', `Shelf check done · ${h.lastCheck.by} · ${h.lastCheck.dur}`);
    Store.save();
  },
  fake() { this.fresh(); const c = Store.state.host.check, sh = shelfOf(Store.state.host.venue); c.items.forEach((id, k) => { const i = sh.items.find(x => x.id === id); c.decide[id] = k && !(i && bbPast(i.bb)) ? 'remove' : (i && bbPast(i.bb) ? 'remove' : 'keep'); }); this.submit(); }
};

/* =====================================================================
   MODERATOR BUTTON: tap = moderator menu; drag = move it anywhere inside the app.
   It stays put on screen while the content scrolls or the screen changes. Only when the
   user drops it does it snap to the 8 px grid and move to the nearest spot that covers no button. Rests at 30% opacity; full opacity while touched.
   Its position is a per-device convenience (localStorage, try/catch).
   ===================================================================== */
const ModFab = {
  el: null, pos: null, KEY: 'secondshelf-modfab',
  GRID: 8, GAP: 4,
  TARGETS: 'button, a[href], input, select, textarea, label, [role="button"], [role="radio"], [role="switch"], [role="tab"], [role="option"], [tabindex]:not([tabindex="-1"]), .leaflet-marker-icon',
  init() {
    const app = $('#app');
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'modfab'; b.setAttribute('aria-label', 'Moderator menu (drag to move)'); b.setAttribute('aria-haspopup', 'dialog');
    b.innerHTML = icon('more');
    app.appendChild(b); this.el = b;
    try { this.pos = JSON.parse(localStorage.getItem(this.KEY)); } catch (e) { this.pos = null; }
    if (!this.pos) this.pos = { x: 4, y: Math.round(app.clientHeight / 2) };
    this.place(this.pos, false);
    this.bind();
    // it only moves when someone drags it; a resize just keeps it inside the app
    window.addEventListener('resize', () => this.place(this.pos, false));
  },
  size() { return this.el.offsetWidth; },
  bounds() { const a = $('#app'); return { w: a.clientWidth, h: a.clientHeight }; },
  clamp(p) { const { w, h } = this.bounds(), s = this.size(); return { x: Math.min(Math.max(0, p.x), w - s), y: Math.min(Math.max(0, p.y), h - s) }; },
  snap(p) { const g = this.GRID; return this.clamp({ x: Math.round(p.x / g) * g, y: Math.round(p.y / g) * g }); },
  place(p, save = true) {
    this.pos = this.clamp(p);
    this.el.style.left = this.pos.x + 'px'; this.el.style.top = this.pos.y + 'px';
    if (save) { try { localStorage.setItem(this.KEY, JSON.stringify(this.pos)); } catch (e) {} }
  },
  /* rectangles of everything tappable that is visible inside the app (relative to the app) */
  obstacles() {
    const app = $('#app'), ar = app.getBoundingClientRect(), out = [];
    $$(this.TARGETS, app).forEach(n => {
      if (n === this.el || this.el.contains(n) || n.closest('.sheet-host:not(.is-open)') || n.closest('[hidden]') || n.matches('.leaflet-container')) return;
      const r = n.getBoundingClientRect();
      if (r.width * r.height > ar.width * ar.height * 0.5) return;   // screen-sized containers (the map surface) aren't buttons
      if (!r.width || !r.height || r.bottom <= ar.top || r.top >= ar.bottom || r.right <= ar.left || r.left >= ar.right) return;
      const cs = getComputedStyle(n); if (cs.visibility === 'hidden' || cs.pointerEvents === 'none' && !n.matches('button, a')) return;
      out.push({ x: r.left - ar.left, y: r.top - ar.top, w: r.width, h: r.height });
    });
    return out;
  },
  free(p, obs) {
    const s = this.size(), m = this.GAP;
    return !obs.some(o => p.x < o.x + o.w + m && p.x + s + m > o.x && p.y < o.y + o.h + m && p.y + s + m > o.y);
  },
  /* nearest grid position (by distance) that covers nothing tappable */
  avoid(save = true) {
    if (!this.el || this.dragging || $('#sheet').classList.contains('is-open')) return;
    const obs = this.obstacles(), start = this.snap(this.pos);
    if (this.free(start, obs)) { if (start.x !== this.pos.x || start.y !== this.pos.y) this.place(start, save); return; }
    const { w, h } = this.bounds(), s = this.size(), g = this.GRID, c = [];
    for (let x = 0; x <= w - s; x += g) for (let y = 0; y <= h - s; y += g) c.push({ x, y, d: (x - start.x) ** 2 + (y - start.y) ** 2 });
    c.sort((a, b) => a.d - b.d);
    const hit = c.find(p => this.free(p, obs));
    if (hit) this.place(hit, save);
  },
  later(ms) { clearTimeout(this._t); this._t = setTimeout(() => this.avoid(), ms); },
  wake() { clearTimeout(this._idle); this.el.classList.add('is-active'); },
  rest(ms = 1200) { clearTimeout(this._idle); this._idle = setTimeout(() => this.el.classList.remove('is-active'), ms); },
  bind() {
    const b = this.el; let d = null;
    b.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      this.wake();
      d = { id: e.pointerId, x0: e.clientX, y0: e.clientY, p0: { ...this.pos }, moved: false };
      b.setPointerCapture(e.pointerId);
    });
    b.addEventListener('pointermove', e => {
      if (!d || e.pointerId !== d.id) return;
      const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
      if (!d.moved && Math.hypot(dx, dy) < 6) return;
      if (!d.moved) { d.moved = true; this.dragging = true; b.classList.add('is-dragging'); }
      this.place({ x: d.p0.x + dx, y: d.p0.y + dy }, false);
    });
    const end = e => {
      if (!d || e.pointerId !== d.id) return;
      const moved = d.moved; d = null; this.dragging = false; b.classList.remove('is-dragging');
      if (moved) { this.place(this.snap(this.pos)); this.avoid(); b._justDragged = performance.now(); Store.log('modfab_move', this.pos); }
      this.rest();
    };
    b.addEventListener('pointerup', end); b.addEventListener('pointercancel', end);
    b.addEventListener('click', e => { if (b._justDragged && performance.now() - b._justDragged < 300) return; Mod.open(); });
    // keyboard: arrows move it one grid step, Enter / Space open the menu (native button)
    b.addEventListener('keydown', e => {
      const k = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key]; if (!k) return;
      e.preventDefault(); this.place({ x: this.pos.x + k[0] * this.GRID, y: this.pos.y + k[1] * this.GRID }); this.later(800);
    });
  }
};

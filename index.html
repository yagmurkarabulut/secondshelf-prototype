<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F1E7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SecondShelf">
<meta name="description" content="SecondShelf hi-fi prototype for moderated usability tests.">
<title>SecondShelf</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Rubik:wght@400;500&display=swap">
<style>
/* =====================================================================
   1. TOKENS: docs/design-system.md §10, copied verbatim
   ===================================================================== */
:root{
  /* primitives */
  --green-950:#172E20; --green-900:#1F3D2B; --green-700:#3F5B3A; --green-100:#CFE3C8;
  --terracotta-800:#89432D; --terracotta-700:#A14C33; --terracotta-500:#C2593A; --terracotta-100:#F0DFD2;
  --ochre-800:#876326; --ochre-500:#BF8B2E; --ochre-100:#EFE5D1; --clay-500:#8A6F4A;
  --ink-900:#2B241E; --stone-700:#5C554C; --stone-600:#6E665C; --stone-500:#8C8477; --stone-300:#CFC6B6;
  --oat-200:#E9DFCC; --cream-100:#F6F1E7; --paper-0:#FFFFFF;
  --sand-200:#E8D7B9; --stone-200:#E6DED0;
  --map-land:#FFFFFF; --map-road:#D9DED8; --map-road-main:#798C75; --map-water:#85D5EB;
  --success-700:#2C6E46; --warning-600:#A86A12; --slate-600:#51666D; --info-600:#2F6E8C;
  /* text */
  --text-primary:var(--ink-900); --text-secondary:var(--stone-700); --text-tertiary:var(--stone-600); --text-disabled:var(--stone-500);
  --text-brand:var(--green-900); --text-accent:var(--terracotta-700); --text-reward:var(--ochre-800); --text-link:var(--green-900);
  --text-on-primary:var(--paper-0); --text-on-accent:var(--paper-0); --text-on-reward:var(--ink-900);
  --text-problem:var(--slate-600); --text-success:var(--success-700);
  --text-on-inverse:var(--paper-0); --text-on-inverse-secondary:var(--stone-200); --text-on-unavailable:var(--paper-0);
  /* icons */
  --icon-primary:var(--green-900); --icon-secondary:var(--stone-700); --icon-tertiary:var(--clay-500); --icon-disabled:var(--stone-500);
  --icon-accent:var(--terracotta-500); --icon-reward:var(--ochre-800); --icon-on-primary:var(--paper-0);
  --icon-neutral:var(--ink-900); --icon-on-inverse:var(--ochre-500); --icon-on-brand-soft:var(--green-100);
  --icon-success:var(--success-700); --icon-warning:var(--warning-600); --icon-problem:var(--slate-600); --icon-info:var(--info-600);
  /* surfaces, borders, actions */
  --surface-canvas:var(--cream-100); --surface-default:var(--paper-0); --surface-subtle:var(--oat-200); --surface-selected:var(--green-100);
  --surface-brand:var(--green-900); --surface-accent:var(--terracotta-500); --surface-accent-subtle:var(--terracotta-100);
  --surface-reward:var(--ochre-500); --surface-reward-subtle:var(--ochre-100);
  --surface-inverse:var(--ink-900); --surface-brand-soft:var(--green-700);
  --surface-indicator:var(--green-100); --surface-track:var(--cream-100); --surface-segment:var(--oat-200); --surface-unavailable:var(--terracotta-700);
  --surface-progress:var(--terracotta-500); --surface-progress-track:var(--oat-200);
  --border-subtle:var(--stone-300); --border-strong:var(--stone-500); --border-brand:var(--green-900); --border-focus:var(--info-600);
  --action-primary:var(--green-900); --action-primary-hover:var(--green-700); --action-primary-pressed:var(--green-950);
  --action-accent:var(--terracotta-700); --action-accent-pressed:var(--terracotta-800); --action-disabled:var(--oat-200);
  --map-park:var(--green-100); --map-marker:var(--ink-900);
  /* type */
  --font-serif:Fraunces,Georgia,serif; --font-sans:Rubik,system-ui,-apple-system,sans-serif;
  /* spacing (multiples of 4) */
  --space-4:4px; --space-8:8px; --space-12:12px; --space-16:16px; --space-20:20px; --space-24:24px;
  --space-28:28px; --space-32:32px; --space-40:40px; --space-48:48px; --space-56:56px; --space-64:64px;
  /* radius */
  --radius-none:0; --radius-xs:4px; --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:24px; --radius-full:999px;
  /* elevation and focus */
  --shadow-card:0 1px 2px rgba(43,36,30,.08),0 8px 24px rgba(43,36,30,.08);
  --shadow-sheet:0 -4px 24px rgba(43,36,30,.12);
  --shadow-focus:0 0 0 2px #FFFFFF,0 0 0 5px #2F6E8C;
  /* size and motion */
  --size-tap-min:44px; --size-control:48px; --frame-max:430px; --size-avatar:48px; --size-tab-indicator:64px;
  --motion-fast:150ms; --motion-base:250ms; --ease:cubic-bezier(.2,0,0,1);
}

/* =====================================================================
   1b. Values written in design-system.md §3, §6 and §8 recipes,
       expressed as custom properties so components stay token-only.
   ===================================================================== */
:root{
  /* §3 type scale: weight size/line family */
  --type-display:700 32px/40px var(--font-serif);
  --type-heading-1:700 28px/36px var(--font-serif);
  --type-heading-2:700 24px/32px var(--font-serif);
  --type-heading-3:700 20px/28px var(--font-serif);
  --type-section:500 20px/28px var(--font-sans);
  --type-title:500 18px/24px var(--font-sans);
  --type-body-large:400 18px/28px var(--font-sans);
  --type-body:400 16px/24px var(--font-sans);
  --type-button:500 16px/24px var(--font-sans);
  --type-body-small:400 14px/20px var(--font-sans);
  --type-label:500 14px/20px var(--font-sans);
  --type-caption:400 12px/16px var(--font-sans);
  --type-overline:500 12px/16px var(--font-sans);
  --tracking-display:-0.02em; --tracking-heading:-0.01em; --tracking-overline:0.06em;
  /* §6 sizes */
  --size-icon-16:16px; --size-icon-20:20px; --size-icon-24:24px; --size-icon-32:32px;
  --frame-w:390px; --frame-h:844px;
  --size-tab-indicator-h:32px; --size-toggle-w:52px; --size-toggle-h:32px;
  /* §8 recipe values */
  --border-w:1.5px;                 /* outline controls, secondary button */
  --size-checkbox:24px;             /* checkbox row */
  --size-marker:32px;               /* map marker */
  --size-chip:32px;                 /* availability chip */
  --size-tile:44px;                 /* icon tile */
  --size-tile-sm:32px;              /* item status tile */
  --size-icon-tile:28px;            /* icon inside action-card tile */
  --size-band:6px;                  /* coupon band */
  --size-step-bar:6px;              /* step header progress */
  --size-bonus-bar:8px;             /* Rescue Bonus bar */
  --size-row-min:72px;              /* food item row */
  --size-settings-row:64px;         /* settings list */
  --size-status-row:48px;           /* item status list */
  --size-grabber-w:36px; --size-grabber-h:4px;
  --size-segment-min:40px;
  --size-sheet-max:85dvh;
  --focus-on-dark:0 0 0 3px var(--paper-0);
  --tint-on-dark:rgba(255,255,255,.12);  /* subtle fill on surface-brand (G04 illustration panel) */
  --scrim:rgba(43,36,30,.4);             /* behind bottom sheets */
  --tint-me:rgba(47,110,140,.2);          /* halo around the "you are here" dot (info-600 at 20%) */
}

/* =====================================================================
   2. BASE
   ===================================================================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font:var(--type-body);color:var(--text-primary);background:var(--surface-canvas);
  min-height:100dvh;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;margin:0}
a{color:var(--text-link)}
a.action-card,a.shelf,a.result,a.avatar,a.tab,a.card{text-decoration:none;color:inherit}
img,svg{display:block}
h1,h2,h3,h4,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus{outline:none}
:focus-visible{box-shadow:var(--shadow-focus);outline:none}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* type classes (§3) */
.t-display{font:var(--type-display);letter-spacing:var(--tracking-display);color:var(--text-brand)}
.t-h1{font:var(--type-heading-1);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.t-h2{font:var(--type-heading-2);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.t-h3{font:var(--type-heading-3);color:var(--text-brand)}
.t-section{font:var(--type-section);color:var(--text-primary)}
.t-title{font:var(--type-title)}
.t-body-large{font:var(--type-body-large)}
.t-body{font:var(--type-body)}
.t-small{font:var(--type-body-small)}
.t-label{font:var(--type-label)}
.t-caption{font:var(--type-caption)}
.t-overline{font:var(--type-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase}
.c-secondary{color:var(--text-secondary)}
.c-tertiary{color:var(--text-tertiary)}
.c-brand{color:var(--text-brand)}
.c-accent{color:var(--text-accent)}
.c-reward{color:var(--text-reward)}
.c-problem{color:var(--text-problem)}

/* icons (§7) */
.icon{width:var(--size-icon-24);height:var(--size-icon-24);color:var(--icon-primary);flex:none}
.icon--sm{width:var(--size-icon-20);height:var(--size-icon-20)}
.icon--xs{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5}
.icon--lg{width:var(--size-icon-32);height:var(--size-icon-32)}
.icon--tile{width:var(--size-icon-tile);height:var(--size-icon-tile)}
.icon--secondary{color:var(--icon-secondary)} .icon--tertiary{color:var(--icon-tertiary)}
.icon--accent{color:var(--icon-accent)} .icon--reward{color:var(--icon-reward)}
.icon--on-primary{color:var(--icon-on-primary)} .icon--disabled{color:var(--icon-disabled)}
.icon--neutral{color:var(--icon-neutral)} .icon--on-inverse{color:var(--icon-on-inverse)}
.icon--success{color:var(--icon-success)} .icon--warning{color:var(--icon-warning)}
.icon--problem{color:var(--icon-problem)} .icon--info{color:var(--icon-info)}

/* =====================================================================
   3. APP SHELL: phone-width column, centred in a frame on desktop
   ===================================================================== */
.app{
  position:relative;margin:0 auto;width:100%;max-width:var(--frame-max);
  height:100dvh;overflow:hidden;background:var(--surface-canvas);
  display:flex;flex-direction:column;
}
@media (min-width:600px) and (min-height:700px){
  body{background:var(--surface-subtle);display:flex;align-items:center;justify-content:center;padding:var(--space-24)}
  .app{width:var(--frame-w);height:min(var(--frame-h),calc(100dvh - var(--space-48)));border-radius:var(--radius-xl);box-shadow:var(--shadow-card)}
}
.stage{position:relative;flex:1;min-height:0;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background:var(--surface-canvas);
  padding:max(env(safe-area-inset-top),var(--space-24)) var(--space-20) var(--space-32);
}
.screen--brand{background:var(--surface-brand);color:var(--text-on-primary)}
.screen--flush{padding-left:0;padding-right:0}
.screen.with-actions{display:flex;flex-direction:column}
.screen .spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:var(--space-16)}
.stack-8{display:flex;flex-direction:column;gap:var(--space-8)}
.stack-24{display:flex;flex-direction:column;gap:var(--space-24)}
.row{display:flex;align-items:center;gap:var(--space-12)}
.grow{flex:1;min-width:0}

/* screen transitions (§6): push 250ms, fade 150ms for overlays */
.screen.enter-fwd{animation:in-fwd var(--motion-base) var(--ease) both}
.screen.leave-fwd{animation:out-fwd var(--motion-base) var(--ease) both}
.screen.enter-back{animation:in-back var(--motion-base) var(--ease) both}
.screen.leave-back{animation:out-back var(--motion-base) var(--ease) both}
.screen.enter-fade{animation:fade-in var(--motion-fast) var(--ease) both}
@keyframes in-fwd{from{transform:translateX(100%)}to{transform:none}}
@keyframes out-fwd{from{transform:none}to{transform:translateX(-30%)}}
@keyframes in-back{from{transform:translateX(-30%)}to{transform:none}}
@keyframes out-back{from{transform:none}to{transform:translateX(100%)}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.screen.leave-back{z-index:2}

/* =====================================================================
   4. COMPONENTS (§8)
   ===================================================================== */

/* ---- Button: v0.5 pill ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:var(--space-8);
  min-height:var(--size-control);padding:var(--space-12) var(--space-24);
  border-radius:var(--radius-full);border:var(--border-w) solid transparent;
  font:var(--type-button);text-align:center;text-decoration:none;
  transition:background-color var(--motion-fast) var(--ease),transform var(--motion-fast) var(--ease);
  user-select:none;
}
.btn .icon{width:var(--size-icon-20);height:var(--size-icon-20);color:currentColor}
.btn--block{display:flex;width:100%}
.btn--primary{background:var(--action-primary);color:var(--text-on-primary)}
.btn--accent{background:var(--action-accent);color:var(--text-on-accent)}
.btn--secondary{background:var(--surface-default);color:var(--text-brand);border-color:var(--border-brand)}
.btn--link{min-height:var(--size-tap-min);padding:var(--space-8) var(--space-4);color:var(--text-link);text-decoration:underline;text-underline-offset:3px;border-radius:var(--radius-sm)}
.btn--on-brand{background:var(--surface-default);color:var(--text-brand)}
.btn--outline-on-brand{background:transparent;color:var(--text-on-primary);border-color:var(--text-on-primary)}
@media (hover:hover){
  .btn--primary:hover:not(:disabled){background:var(--action-primary-hover)}
  .btn--secondary:hover:not(:disabled){background:var(--surface-canvas)}
}
.btn--primary.is-hover{background:var(--action-primary-hover)}
.btn--secondary.is-hover{background:var(--surface-canvas)}
.btn--primary:active:not(:disabled),.btn--primary.is-pressed{background:var(--action-primary-pressed)}
.btn--accent:active:not(:disabled),.btn--accent.is-pressed{background:var(--action-accent-pressed)}
.btn--secondary:active:not(:disabled),.btn--secondary.is-pressed{background:var(--surface-selected)}
.btn--on-brand:active:not(:disabled),.btn--on-brand.is-pressed{background:var(--surface-selected)}
.btn--outline-on-brand:active:not(:disabled),.btn--outline-on-brand.is-pressed{background:var(--tint-on-dark)}
.btn--link:active,.btn--link.is-pressed{background:var(--surface-subtle)}
.btn:active:not(:disabled),.btn.is-pressed{transform:scale(.98)}
.btn.is-focus,.btn:focus-visible{box-shadow:var(--shadow-focus)}
.btn--on-brand:focus-visible,.btn--outline-on-brand:focus-visible,.screen--brand .btn:focus-visible{box-shadow:var(--focus-on-dark)}
.btn:disabled,.btn[aria-disabled="true"]{background:var(--action-disabled);color:var(--text-disabled);border-color:transparent;cursor:not-allowed}
.btn--link:disabled{background:none;color:var(--text-disabled)}
.btn.is-loading{pointer-events:none}
.spinner{width:var(--size-icon-20);height:var(--size-icon-20);border-radius:var(--radius-full);border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---- Icon button: 44px target ---- */
.icon-btn{
  width:var(--size-tap-min);height:var(--size-tap-min);display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--radius-full);flex:none;color:var(--icon-primary);
  transition:background-color var(--motion-fast) var(--ease);
}
.icon-btn:active,.icon-btn.is-pressed{background:var(--surface-subtle)}
.screen--brand .icon-btn .icon,.on-brand .icon-btn .icon{color:var(--icon-on-primary)}
.screen--brand .icon-btn:active,.on-brand .icon-btn:active{background:var(--tint-on-dark)}
.screen--brand .icon-btn:focus-visible,.on-brand .icon-btn:focus-visible{box-shadow:var(--focus-on-dark)}

/* ---- Input ---- */
.field{display:flex;flex-direction:column;gap:var(--space-8)}
.field__label{font:var(--type-label);color:var(--text-secondary)}
.input{
  width:100%;min-height:var(--size-control);padding:var(--space-12) var(--space-16);
  border-radius:var(--radius-md);border:var(--border-w) solid var(--border-strong);
  background:var(--surface-default);font:var(--type-body);color:var(--text-primary);
  -webkit-appearance:none;appearance:none;
}
.input::placeholder{color:var(--text-tertiary)}
.input:focus,.input.is-focus{border-color:var(--border-brand);box-shadow:var(--shadow-focus)}
.field.is-error .input{border-color:var(--text-problem)}
.field__error{display:flex;gap:var(--space-8);align-items:flex-start;font:var(--type-body-small);color:var(--text-problem)}
.field__error .icon{color:var(--icon-problem);width:var(--size-icon-20);height:var(--size-icon-20)}
.input:disabled{background:var(--surface-canvas);color:var(--text-disabled);border-color:var(--border-subtle)}
.field.is-disabled .field__label{color:var(--text-disabled)}

/* ---- Search field ---- */
.search{display:flex;gap:var(--space-8);align-items:flex-start}
.search__box{position:relative;flex:1;min-width:0}
.search__field{
  display:flex;align-items:center;gap:var(--space-8);min-height:var(--size-control);
  padding:0 var(--space-4) 0 var(--space-16);border-radius:var(--radius-full);
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
}
.search__field:focus-within{border-color:var(--border-brand);box-shadow:var(--shadow-focus)}
.search__field .icon{color:var(--icon-reward)}
.search__input{flex:1;min-width:0;border:0;background:none;font:var(--type-body);padding:var(--space-12) 0;color:var(--text-primary)}
.search__input::placeholder{color:var(--text-tertiary)}
.search__input::-webkit-search-cancel-button{display:none}
.search__clear{width:var(--size-tap-min);height:var(--size-tap-min)}
.search__clear .icon{color:var(--icon-primary)}
.search__filter{
  width:var(--size-control);height:var(--size-control);border-radius:var(--radius-full);flex:none;
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
  display:inline-flex;align-items:center;justify-content:center;
}
.search__filter:active{background:var(--surface-selected)}
.suggest{
  margin-top:var(--space-8);background:var(--surface-default);border-radius:var(--radius-md);
  border:var(--border-w) solid var(--border-subtle);overflow:hidden;
}
.suggest__item{display:flex;align-items:center;gap:var(--space-12);width:100%;min-height:var(--size-control);padding:var(--space-12) var(--space-16);text-align:left;font:var(--type-body)}
.suggest__item + .suggest__item{border-top:1px solid var(--border-subtle)}
.suggest__item:active,.suggest__item[aria-selected="true"]{background:var(--surface-selected)}
.suggest__item .icon{color:var(--icon-secondary);width:var(--size-icon-20);height:var(--size-icon-20)}
.suggest__item mark{background:none;color:inherit;font-weight:500}

/* ---- Filter chip ---- */
.chips{display:flex;gap:var(--space-8);overflow-x:auto;scrollbar-width:none;padding:var(--space-4) 0}
.chips::-webkit-scrollbar{display:none}
.chip{
  display:inline-flex;align-items:center;gap:var(--space-8);flex:none;
  min-height:var(--size-tap-min);padding:0 var(--space-16);border-radius:var(--radius-full);
  font:var(--type-label);white-space:nowrap;
  background:var(--surface-default);color:var(--text-primary);border:var(--border-w) solid var(--border-strong);
}
.chip .icon{width:var(--size-icon-20);height:var(--size-icon-20);color:currentColor}
.chip[aria-pressed="true"]{background:var(--action-primary);color:var(--text-on-primary);border-color:var(--action-primary)}
.chip:active{transform:scale(.97)}

/* ---- Checkbox row ---- */
.check{display:flex;align-items:flex-start;gap:var(--space-12);min-height:var(--size-tap-min);padding:var(--space-8) 0;cursor:pointer;font:var(--type-body)}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.check__box{
  width:var(--size-checkbox);height:var(--size-checkbox);border-radius:var(--radius-xs);flex:none;margin-top:0;
  border:var(--border-w) solid var(--border-strong);background:var(--surface-default);
  display:inline-flex;align-items:center;justify-content:center;
  transition:background-color var(--motion-fast) var(--ease);
}
.check__box .icon{width:var(--size-icon-16);height:var(--size-icon-16);color:var(--icon-on-primary);opacity:0;stroke-width:2.5}
.check input:checked + .check__box{background:var(--action-primary);border-color:var(--action-primary)}
.check input:checked + .check__box .icon{opacity:1}
.check input:focus-visible + .check__box{box-shadow:var(--shadow-focus)}
.check input:disabled + .check__box{background:var(--action-disabled);border-color:var(--border-subtle)}
.check.is-disabled{color:var(--text-disabled);cursor:not-allowed}
.check-panel{background:var(--surface-selected);border-radius:var(--radius-lg);padding:var(--space-12) var(--space-16)}

/* ---- Quantity stepper: v0.5 round ---- */
.stepper{display:inline-flex;align-items:center;gap:var(--space-12)}
.stepper__btn{
  width:var(--size-tap-min);height:var(--size-tap-min);border-radius:var(--radius-full);
  background:var(--surface-default);border:var(--border-w) solid var(--border-strong);
  display:inline-flex;align-items:center;justify-content:center;
}
.stepper__btn .icon{color:var(--icon-primary)}
.stepper__btn:active:not(:disabled){background:var(--surface-selected)}
.stepper__btn:disabled{border-color:var(--border-subtle);background:var(--surface-canvas);cursor:not-allowed}
.stepper__btn:disabled .icon{color:var(--icon-disabled)}
.stepper__value{font:var(--type-title);min-width:var(--space-24);text-align:center}

/* ---- Card ---- */
.card{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);border:var(--border-w) solid transparent}
.card--shadow{box-shadow:var(--shadow-card)}
.card--tap{display:block;width:100%;text-align:left;transition:transform var(--motion-fast) var(--ease)}
.card--tap:active,.card.is-pressed{transform:scale(.98);background:var(--surface-subtle)}
.card.is-selected{border-color:var(--border-brand)}
.card--selected-fill{background:var(--surface-selected)}
.card--subtle{background:var(--surface-subtle)}
.card--flush{padding:0;overflow:hidden}

/* ---- Icon tile ---- */
.tile{width:var(--size-tile);height:var(--size-tile);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface-selected)}
.tile--accent{background:var(--surface-accent-subtle)}
.tile--reward{background:var(--surface-reward-subtle)}
.tile--sand{background:var(--sand-200)}
.tile--paper{background:var(--surface-default)}
.tile--sm{width:var(--size-tile-sm);height:var(--size-tile-sm);border-radius:var(--radius-sm)}
.tile--canvas{background:var(--surface-canvas)}

/* ---- Action card (Home) ---- */
.action-cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16)}
.action-card{
  display:flex;flex-direction:column;gap:var(--space-12);text-align:left;
  background:var(--surface-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);padding:var(--space-16);
  transition:transform var(--motion-fast) var(--ease);
}
.action-card:active,.action-card.is-pressed{transform:scale(.98);background:var(--surface-canvas)}
.action-card__title{font:var(--type-section);color:var(--text-primary)}
.action-card__desc{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Feature card ---- */
.feature{background:var(--surface-accent-subtle);border-radius:var(--radius-lg);padding:var(--space-16);display:flex;gap:var(--space-12);align-items:flex-start}
.feature .t-overline{color:var(--text-accent)}

/* ---- Status label ---- */
.status{display:inline-flex;align-items:center;gap:var(--space-8);font:var(--type-label);color:var(--text-primary)}
.status .icon{width:var(--size-icon-20);height:var(--size-icon-20)}
.status--problem{color:var(--text-problem)}

/* ---- Banner / toast ---- */
.banner{display:flex;align-items:flex-start;gap:var(--space-12);border-radius:var(--radius-md);padding:var(--space-12) var(--space-16);font:var(--type-body)}
.banner > .icon{margin-top:0}
.banner__text{flex:1;min-width:0;align-self:center}
.banner__text strong{font-weight:500}
.banner__action{margin:calc(var(--space-12) * -1) calc(var(--space-8) * -1) calc(var(--space-12) * -1) 0;align-self:center}
.banner--success{background:var(--surface-selected);color:var(--text-primary)}
.banner--success > .icon{color:var(--icon-success)}
.banner--info{background:var(--surface-subtle);color:var(--text-primary)}
.banner--info > .icon{color:var(--icon-info)}
.banner--problem{background:var(--surface-default);color:var(--text-problem);border:var(--border-w) solid var(--border-strong)}
.banner--problem > .icon{color:var(--icon-problem)}
.banner--reward{background:var(--surface-reward-subtle);color:var(--text-primary)}
.banner--reward > .icon{color:var(--icon-reward)}
.banner--plain{background:var(--surface-default)}
.toast-host{position:absolute;left:var(--space-16);right:var(--space-16);bottom:calc(var(--space-16) + env(safe-area-inset-bottom));z-index:40;display:flex;flex-direction:column;gap:var(--space-8);pointer-events:none}
.app.has-tabs .toast-host{bottom:calc(88px + env(safe-area-inset-bottom))}
.toast{pointer-events:auto;box-shadow:var(--shadow-card);animation:fade-in var(--motion-fast) var(--ease) both}
.toast.is-leaving{opacity:0;transition:opacity var(--motion-fast) var(--ease)}

/* ---- Coupon ticket: v0.5 light ---- */
.coupon{position:relative;background:var(--surface-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden}
.coupon__band{height:var(--size-band);background:var(--surface-reward)}
.coupon__body{padding:var(--space-16) var(--space-16) var(--space-12)}
.coupon__head{display:flex;align-items:center;gap:var(--space-8);justify-content:space-between}
.coupon__kind{display:flex;align-items:center;gap:var(--space-8);color:var(--text-secondary)}
.coupon__title{margin-top:var(--space-8)}
.coupon__meta{font:var(--type-body-small);color:var(--text-secondary);margin-top:var(--space-4)}
.kv{display:flex;justify-content:space-between;gap:var(--space-16);font:var(--type-body);padding:var(--space-4) 0}
.kv dt{color:var(--text-primary)}
.kv dd{margin:0;font-weight:500;text-align:right}
.coupon__terms{margin:var(--space-12) 0 0}
.coupon__tear{position:relative;height:var(--space-24)}
.coupon__tear::before{content:"";position:absolute;left:var(--space-16);right:var(--space-16);top:50%;border-top:var(--border-w) dashed var(--border-subtle)}
.coupon__notch{position:absolute;top:50%;width:var(--space-20);height:var(--space-20);border-radius:var(--radius-full);background:var(--surface-canvas);transform:translateY(-50%)}
.coupon__notch--l{left:calc(var(--space-12) * -1)} .coupon__notch--r{right:calc(var(--space-12) * -1)}
.coupon__foot{display:flex;align-items:center;gap:var(--space-12);padding:0 var(--space-16) var(--space-16)}
.coupon__foot p{flex:1;font:var(--type-body-small);color:var(--text-secondary)}
.coupon__foot .btn{flex:none}
.coupon.is-used .coupon__band,.coupon.is-expired .coupon__band{background:var(--surface-subtle)}
.coupon.is-pending .coupon__band{background:var(--surface-reward-subtle)}
.pill{display:inline-flex;align-items:center;gap:var(--space-4);min-height:var(--size-icon-24);padding:var(--space-4) var(--space-12);border-radius:var(--radius-full);font:var(--type-label);white-space:nowrap;background:var(--surface-track);color:var(--text-primary)}
.pill .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5}
.pill--leaf{background:var(--surface-selected)}
.pill--oat{background:var(--surface-subtle)}
.pill--reward{background:var(--surface-reward-subtle)}

/* ---- Segmented control: v0.5 Oat ---- */
.segmented{display:inline-flex;padding:var(--space-4);gap:var(--space-4);border-radius:var(--radius-full);background:var(--surface-segment)}
.segmented--block{display:flex}
.segmented__seg{
  flex:1;min-height:var(--size-segment-min);padding:var(--space-8) var(--space-16);border-radius:var(--radius-full);
  font:var(--type-body);color:var(--text-primary);display:inline-flex;align-items:center;justify-content:center;gap:var(--space-8);white-space:nowrap;
}
.segmented__seg .icon{width:var(--size-icon-20);height:var(--size-icon-20)}
.segmented__seg[aria-selected="true"]{background:var(--surface-default);font-weight:500;box-shadow:0 1px 2px rgba(43,36,30,.08)}

/* ---- Rescue Bonus card ---- */
.bonus{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16)}
.bonus__head{display:flex;gap:var(--space-12);align-items:center}
.bonus__bar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-4);margin-top:var(--space-16)}
.bonus__seg{height:var(--size-bonus-bar);border-radius:var(--radius-full);background:var(--surface-track);box-shadow:inset 0 0 0 1px var(--border-subtle)}
.bonus__seg.is-on{background:var(--surface-reward);box-shadow:none}
.bonus.is-expired .bonus__seg.is-on{background:var(--surface-subtle)}
.bonus__status{margin-top:var(--space-8);font:var(--type-body-small);color:var(--text-primary)}

/* ---- Progress (generic) ---- */
.progress{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:var(--space-8)}
.progress__seg{height:var(--size-step-bar);border-radius:var(--radius-full);background:var(--surface-progress-track)}
.progress__seg.is-on{background:var(--surface-progress)}
.screen--brand .progress__seg,.on-brand .progress__seg{background:var(--surface-brand-soft)}
.screen--brand .progress__seg.is-on,.on-brand .progress__seg.is-on{background:var(--surface-progress)}

/* ---- Step header (v0.5) ---- */
.stephead{display:flex;flex-direction:column;gap:var(--space-12);margin:calc(var(--space-8) * -1) 0 var(--space-24)}
.stephead__bar{display:flex;align-items:center;gap:var(--space-8);margin-left:calc(var(--space-12) * -1)}
.stephead__title{flex:1;min-width:0;font:var(--type-heading-2);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.stephead__step{color:var(--text-secondary);white-space:nowrap}
.screen--brand .stephead__title,.on-brand .stephead__title{color:var(--text-on-primary)}
.screen--brand .stephead__step,.on-brand .stephead__step{color:var(--text-on-inverse-secondary)}

/* ---- Top bar ---- */
.topbar{display:flex;align-items:center;gap:var(--space-8);min-height:var(--size-control);margin:calc(var(--space-8) * -1) calc(var(--space-12) * -1) var(--space-16)}
.topbar__title{flex:1;min-width:0;font:var(--type-title);color:var(--text-primary)}
.topbar__title--serif{font:var(--type-heading-1);letter-spacing:var(--tracking-heading);color:var(--text-brand)}
.on-brand .topbar__title,.screen--brand .topbar__title{color:var(--text-on-primary)}

/* ---- NFC tap card ---- */
.nfc{display:flex;flex-direction:column;gap:var(--space-16);color:var(--text-on-primary)}
.nfc__stage{
  position:relative;border-radius:var(--radius-lg);background:var(--tint-on-dark);
  min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-16);padding:var(--space-24);text-align:center;
}
.nfc__art{position:relative;width:128px;height:128px;display:flex;align-items:center;justify-content:center}
.nfc__core{position:relative;z-index:1;width:72px;height:72px;border-radius:var(--radius-full);background:var(--surface-default);display:flex;align-items:center;justify-content:center;transition:background-color var(--motion-fast) var(--ease)}
.nfc__core .icon{width:var(--size-icon-32);height:var(--size-icon-32);color:var(--icon-primary)}
.nfc__ring{position:absolute;inset:28px;border-radius:var(--radius-full);border:2px solid var(--text-on-primary);opacity:0}
.nfc[data-state="idle"] .nfc__ring{animation:pulse 2.4s var(--ease) infinite}
.nfc[data-state="idle"] .nfc__ring:nth-child(2){animation-delay:.8s}
.nfc[data-state="idle"] .nfc__ring:nth-child(3){animation-delay:1.6s}
.nfc[data-state="idle"] .nfc__phone{animation:approach 2.4s var(--ease) infinite}
.nfc[data-state="scanning"] .nfc__ring{animation:pulse 1.2s linear infinite}
.nfc[data-state="scanning"] .nfc__ring:nth-child(2){animation-delay:.4s}
.nfc[data-state="scanning"] .nfc__ring:nth-child(3){animation-delay:.8s}
.nfc[data-state="found"] .nfc__core{background:var(--surface-selected)}
.nfc[data-state="found"] .nfc__core .icon{color:var(--icon-success)}
.nfc[data-state="notfound"] .nfc__core{background:var(--surface-subtle)}
.nfc[data-state="notfound"] .nfc__core .icon{color:var(--icon-problem)}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
@keyframes approach{0%,100%{transform:translateY(-6px)}50%{transform:translateY(4px)}}
.nfc__status{font:var(--type-title);color:var(--text-on-primary)}
.nfc__hint{font:var(--type-body);color:var(--text-on-inverse-secondary)}
.nfc__actions{display:flex;flex-direction:column;gap:var(--space-12)}
.nfc__note{display:flex;gap:var(--space-12);align-items:flex-start;font:var(--type-body);color:var(--text-on-primary)}
.nfc__note .icon{color:var(--icon-on-primary)}
.nfc__qr{width:160px;height:160px;border-radius:var(--radius-md);border:2px dashed var(--text-on-primary);display:flex;align-items:center;justify-content:center}

.nfc__more{text-align:center}
.on-brand .btn--link,.screen--brand .btn--link{color:var(--text-on-primary)}
.on-brand .btn--link:active,.screen--brand .btn--link:active{background:var(--tint-on-dark)}
.capture__overlay--dim{background:var(--scrim)}

/* ---- Food item row ---- */
.item{display:flex;gap:var(--space-12);align-items:flex-start;background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);min-height:var(--size-row-min);border:var(--border-w) solid transparent;transition:background-color var(--motion-base) var(--ease)}
.item__thumb{width:var(--size-control);height:var(--size-control);border-radius:var(--radius-sm);background:var(--surface-selected);display:flex;align-items:center;justify-content:center;flex:none}
.item__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-4)}
.item__name{font:var(--type-title)}
.item__meta{display:flex;flex-wrap:wrap;gap:var(--space-4) var(--space-12);font:var(--type-body-small);color:var(--text-secondary)}
.item__meta span{display:inline-flex;align-items:center;gap:var(--space-4)}
.item__meta .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5;color:var(--icon-secondary)}
.item__tools{display:flex;flex-direction:column;justify-content:space-between;align-self:stretch;margin:calc(var(--space-8) * -1) calc(var(--space-12) * -1) calc(var(--space-8) * -1) calc(var(--space-8) * -1)}
.item .stepper{margin-top:var(--space-8)}
.item.is-edited{background:var(--surface-selected)}
.item--check{cursor:pointer;align-items:flex-start;gap:var(--space-12)}
.item--check.is-checked{border-color:var(--border-brand)}
.item--check .check{padding:0;min-height:auto}
.item__taking{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-8);font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Map marker ---- */
.marker{
  width:var(--size-marker);height:var(--size-marker);border-radius:var(--radius-full);flex:none;
  background:var(--map-marker);color:var(--text-on-inverse);font:var(--type-label);
  display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--surface-default);
  position:relative;
}
.marker--selected{background:var(--action-primary);box-shadow:0 0 0 var(--space-8) var(--surface-selected)}
.marker--full{background:var(--surface-unavailable);color:var(--text-on-unavailable)}
.marker--paused{background:var(--surface-default);color:var(--text-primary);border-color:var(--border-strong);border-style:dashed}
.marker--closed{background:var(--action-disabled);color:var(--text-secondary);border-color:var(--border-strong)}
.marker__badge{position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:var(--radius-full);background:var(--surface-default);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(43,36,30,.2)}
.marker__badge .icon{width:14px;height:14px;stroke-width:1.5}
.marker-btn{width:var(--size-tap-min);height:var(--size-tap-min);display:inline-flex;align-items:center;justify-content:center;border-radius:var(--radius-full)}
.legend{display:flex;flex-wrap:wrap;gap:var(--space-12) var(--space-16);font:var(--type-body-small);color:var(--text-secondary)}
.legend li{display:inline-flex;align-items:center;gap:var(--space-8)}
.legend .marker{width:var(--space-24);height:var(--space-24);font:var(--type-caption);border-width:1.5px}

/* ---- Map controls ---- */
.countpill{display:inline-flex;align-items:center;justify-content:center;min-height:var(--size-control);padding:var(--space-12) var(--space-24);border-radius:var(--radius-full);background:var(--surface-inverse);color:var(--text-on-inverse);font:var(--type-body)}
.mapview{position:relative;border-radius:var(--radius-lg);overflow:hidden;background:var(--map-land)}
.mapview svg.map-bg{width:100%;height:100%;position:absolute;inset:0}

/* ---- Item status list ---- */
.statuslist{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16)}
.statuslist__head{display:flex;align-items:center;gap:var(--space-8);min-height:var(--size-tap-min)}
.statuslist__head h2{flex:1}
.statuslist__row{display:flex;align-items:center;gap:var(--space-12);min-height:var(--size-status-row)}
.statuslist__name{flex:1;min-width:0;font:var(--type-body)}
.statuslist__name small{font:var(--type-body-small);color:var(--text-secondary)}
.statuslist__venue{font:var(--type-body-small);color:var(--text-secondary);white-space:nowrap}

/* ---- Availability chip ---- */
.avail{display:inline-flex;align-items:center;gap:var(--space-4);min-height:var(--size-chip);padding:0 var(--space-12);border-radius:var(--radius-full);font:var(--type-label);white-space:nowrap;background:var(--surface-track);color:var(--text-primary)}
.avail .icon{width:var(--size-icon-16);height:var(--size-icon-16);stroke-width:1.5;color:currentColor}
.avail--full{background:var(--surface-unavailable);color:var(--text-on-unavailable)}
.avail--closed{background:var(--surface-subtle);color:var(--text-primary)}
.on-paper .avail--space{background:var(--surface-canvas)}

/* ---- Shelf card + carousel ---- */
.carousel{display:flex;gap:var(--space-12);overflow-x:auto;scroll-snap-type:x mandatory;margin:0 calc(var(--space-20) * -1);padding:var(--space-4) var(--space-20) var(--space-16);scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.shelf{flex:none;width:160px;scroll-snap-align:start;background:var(--surface-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.shelf:active{transform:scale(.98)}
.shelf__photo{position:relative;height:72px;background:var(--surface-subtle);display:flex;align-items:center;justify-content:center}
.shelf__photo .marker{position:absolute;left:var(--space-8);bottom:calc(var(--space-16) * -1)}
.shelf__body{padding:var(--space-24) var(--space-12) var(--space-12);display:flex;flex-direction:column;gap:var(--space-4);align-items:flex-start}
.shelf__dist{font:var(--type-label);color:var(--text-brand)}
.shelf__venue{font:var(--type-title)}
.shelf__hours{font:var(--type-body-small);color:var(--text-secondary);margin-bottom:var(--space-4)}
.shelf.is-closed .shelf__photo{opacity:.6}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-4);color:var(--text-secondary);font:var(--type-caption)}
.placeholder .icon{color:var(--icon-tertiary)}

/* ---- Settings list ---- */
.settings{background:var(--surface-default);border-radius:var(--radius-lg);padding:0 var(--space-16)}
.settings__row{display:flex;align-items:center;gap:var(--space-16);min-height:var(--size-settings-row);padding:var(--space-12) 0;width:100%;text-align:left}
.settings__row + .settings__row{border-top:1px solid var(--border-subtle)}
button.settings__row:active{background:var(--surface-canvas)}
.settings__text{flex:1;min-width:0}
.settings__title{font:var(--type-title)}
.settings__sub{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Toggle ---- */
.toggle{position:relative;width:var(--size-toggle-w);height:var(--size-toggle-h);border-radius:var(--radius-full);flex:none;background:var(--surface-default);border:var(--border-w) solid var(--border-strong);transition:background-color var(--motion-fast) var(--ease)}
.toggle::after{content:"";position:absolute;top:50%;left:var(--space-4);width:22px;height:22px;border-radius:var(--radius-full);background:var(--surface-default);box-shadow:0 0 0 var(--border-w) var(--border-strong);transform:translateY(-50%);transition:transform var(--motion-fast) var(--ease)}
.toggle[aria-checked="true"]{background:var(--surface-brand-soft);border-color:var(--surface-brand-soft)}
.toggle[aria-checked="true"]::after{transform:translate(19px,-50%);background:var(--surface-canvas);box-shadow:none}
.toggle:disabled{background:var(--action-disabled);border-color:var(--border-subtle);cursor:not-allowed}
.toggle:disabled::after{box-shadow:0 0 0 var(--border-w) var(--border-subtle)}
.toggle-wrap{display:inline-flex;align-items:center;justify-content:center;min-width:var(--size-tap-min);min-height:var(--size-tap-min)}

/* ---- Profile row / avatar ---- */
.avatar{width:var(--size-avatar);height:var(--size-avatar);border-radius:var(--radius-full);background:var(--surface-subtle);color:var(--text-primary);font:var(--type-title);display:inline-flex;align-items:center;justify-content:center;flex:none}
.profile{display:flex;align-items:center;gap:var(--space-16);width:100%;text-align:left}

/* ---- Impact card ---- */
.impact{background:var(--surface-selected);border-radius:var(--radius-lg);padding:var(--space-16)}
.impact__head{display:flex;justify-content:space-between;align-items:center;color:var(--text-secondary)}
.impact__nums{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-16);margin-top:var(--space-8)}
.impact__num{font:var(--type-display);letter-spacing:var(--tracking-display);color:var(--text-brand)}
.impact__cap{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Host-mode card ---- */
.hostcard{display:flex;align-items:center;gap:var(--space-16);width:100%;text-align:left;background:var(--surface-inverse);color:var(--text-on-inverse);border-radius:var(--radius-lg);padding:var(--space-16)}
.hostcard:active{transform:scale(.98)}
.hostcard:focus-visible{box-shadow:var(--shadow-focus)}
.hostcard .settings__sub{color:var(--text-on-inverse-secondary)}
.hostcard .chev{color:var(--text-on-inverse)}

/* ---- Greeting header ---- */
.greet{display:flex;align-items:center;justify-content:space-between;gap:var(--space-16);margin-bottom:var(--space-16)}

/* ---- Bottom sheet ---- */
.sheet-host{position:absolute;inset:0;z-index:50;display:none}
.sheet-host.is-open{display:block}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade-in var(--motion-fast) var(--ease) both}
.sheet{
  position:absolute;left:0;right:0;bottom:0;max-height:var(--size-sheet-max);overflow-y:auto;
  background:var(--surface-default);border-radius:var(--radius-xl) var(--radius-xl) 0 0;box-shadow:var(--shadow-sheet);
  padding:var(--space-8) var(--space-20) calc(var(--space-24) + env(safe-area-inset-bottom));
  animation:sheet-in var(--motion-base) var(--ease) both;
}
@keyframes sheet-in{from{transform:translateY(100%)}to{transform:none}}
.sheet__grabber{width:var(--size-grabber-w);height:var(--size-grabber-h);border-radius:var(--radius-full);background:var(--border-strong);margin:0 auto var(--space-8)}
.sheet__head{display:flex;align-items:center;gap:var(--space-8);margin-bottom:var(--space-16)}
.sheet__head h2{flex:1}
.sheet--static{position:relative;animation:none;box-shadow:var(--shadow-sheet);max-height:none}

/* ---- Counter QR sheet ---- */
.qrsheet{text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-8)}
.qr{width:200px;height:200px;padding:var(--space-12);background:var(--surface-default);border:var(--border-w) solid var(--border-strong);border-radius:var(--radius-sm);color:var(--text-primary);margin:var(--space-8) 0}
.qr svg{width:100%;height:100%}
.qrsheet.is-used .qr{color:var(--text-disabled)}
.qrsheet .kv{width:100%;text-align:left}
.qrcode-text{font:var(--type-heading-2);letter-spacing:var(--tracking-heading);color:var(--text-brand)}

/* ---- Photo capture frame ---- */
.capture{position:relative;border-radius:var(--radius-lg);background:var(--surface-subtle);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;padding:var(--space-24);overflow:hidden}
.capture__guide{position:absolute;inset:var(--space-24);border:2px dashed var(--border-strong);border-radius:var(--radius-md)}
.capture__msg{position:relative;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--space-8)}
.capture__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.capture__overlay{position:absolute;inset:0;background:var(--surface-brand);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-12);color:var(--text-on-primary);font:var(--type-title)}
.capture__overlay .spinner{width:var(--size-icon-32);height:var(--size-icon-32);border-width:3px}
.capture__scan{position:absolute;left:0;right:0;height:3px;background:var(--surface-default);opacity:.8;animation:scan 1.5s var(--ease) infinite}
@keyframes scan{from{top:10%}to{top:90%}}

/* ---- List result row ---- */
.result{display:flex;align-items:center;gap:var(--space-16);width:100%;text-align:left;background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);min-height:var(--size-row-min)}
.result:active{background:var(--surface-canvas)}
.result.is-selected{background:var(--surface-selected)}
.result__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:var(--space-4);align-items:flex-start}
.result__meta{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Verification status card / timeline ---- */
.verify{display:flex;gap:var(--space-12);align-items:flex-start;background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16)}
.verify__label{font:var(--type-title)}
.verify__line{font:var(--type-body-small);color:var(--text-secondary)}

/* ---- Benefit list ---- */
.benefits{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-16)}
.benefit{display:flex;gap:var(--space-16);align-items:flex-start}

/* ---- Steward check row ---- */
.checkrow{background:var(--surface-default);border-radius:var(--radius-lg);padding:var(--space-16);border:var(--border-w) solid transparent;display:flex;flex-direction:column;gap:var(--space-12)}
.checkrow__btns{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-8)}
.checkrow__btns .btn{padding-left:var(--space-12);padding-right:var(--space-12)}
.checkrow .btn[aria-pressed="true"]{background:var(--action-primary);color:var(--text-on-primary);border-color:var(--action-primary)}
.checkrow.is-kept{background:var(--surface-selected)}
.checkrow.is-removed{background:var(--surface-subtle)}
.checkrow.is-flagged{border-color:var(--text-problem)}

/* ---- Activity log row ---- */
.log{background:var(--surface-default);border-radius:var(--radius-lg);padding:0 var(--space-16)}
.log__row{display:flex;gap:var(--space-12);align-items:center;min-height:var(--size-settings-row);padding:var(--space-12) 0}
.log__row + .log__row{border-top:1px solid var(--border-subtle)}
.log__time{font:var(--type-body-small);color:var(--text-tertiary);white-space:nowrap}

/* ---- Tab bar ---- */
.tabbar{
  flex:none;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-default);
  border-top:1px solid var(--border-subtle);padding:var(--space-8) var(--space-8) calc(var(--space-8) + env(safe-area-inset-bottom));
}
.tabbar[hidden]{display:none}
.tab{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);min-height:var(--size-control);padding:var(--space-4) 0;font:var(--type-label);color:var(--text-primary);text-decoration:none;font-weight:400;border-radius:var(--radius-md)}
.tab__pill{width:var(--size-tab-indicator);height:var(--size-tab-indicator-h);border-radius:var(--radius-full);display:flex;align-items:center;justify-content:center;transition:background-color var(--motion-fast) var(--ease)}
.tab .icon{color:var(--icon-neutral)}
.tab[aria-current="page"]{font-weight:500}
.tab[aria-current="page"] .tab__pill{background:var(--surface-indicator)}
.tab[aria-current="page"] .icon{color:var(--icon-primary)}
.tab:active .tab__pill{background:var(--surface-subtle)}
.tabbar--static{border-radius:0 0 var(--radius-lg) var(--radius-lg)}

/* ---- Empty state ---- */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-8);padding:var(--space-48) var(--space-16)}
.empty .btn{margin-top:var(--space-8)}

/* ---- Section header (Home) ---- */
.sechead{display:flex;align-items:center;justify-content:space-between;gap:var(--space-12);min-height:var(--size-tap-min)}

/* =====================================================================
   4b. SCREENS (Scenario A)
   ===================================================================== */
.screen--brand .t-display,.screen--brand .t-h1{color:var(--text-on-primary)}
.screen-title{margin-bottom:var(--space-16)}
.lead{font:var(--type-body);color:var(--text-primary)}
.center{text-align:center}
.actions{display:flex;flex-direction:column;gap:var(--space-12);padding-top:var(--space-24)}
.kv-lines .kv{padding:var(--space-12) 0}
.kv-lines .kv + .kv{border-top:1px solid var(--border-subtle)}
.howto{font:var(--type-body-small);color:var(--text-secondary);margin-top:var(--space-12)}
.howto strong{color:var(--text-primary);font-weight:500}
.banner--plain > .icon{color:var(--icon-info)}
.illus{border-radius:var(--radius-lg);background:var(--surface-subtle);min-height:152px;position:relative;margin-bottom:var(--space-24)}
.illus::before{content:"";position:absolute;inset:var(--space-12);border:var(--border-w) dashed var(--border-strong);border-radius:var(--radius-md)}
.illus .placeholder{position:absolute;inset:0;font:var(--type-body-small)}
.closebar{display:flex;justify-content:flex-end;margin:calc(var(--space-12) * -1) calc(var(--space-12) * -1) var(--space-8)}

/* Home */
.statuslist .statuslist__head h2{font:var(--type-section)}

/* Tap the tag */
.tap-title{text-align:center;margin-bottom:var(--space-8)}
.tap-sub{text-align:center;font:var(--type-body-large);color:var(--text-on-primary);margin-bottom:var(--space-24)}
.screen--brand .nfc__stage{min-height:240px}
#nfc-slot{flex:1;display:flex;flex-direction:column}
#nfc-slot .nfc{flex:1}
#nfc-slot .nfc__actions{margin-top:auto;padding-top:var(--space-24)}
.nfc__status:empty{display:none}

/* Map (G02 / R01) */
.screen--map{padding:0;overflow:hidden}
.map{position:absolute;inset:0;background:var(--map-land);overflow:hidden}
.map__bg{position:absolute;inset:0;width:100%;height:100%}
.map__pin{position:absolute;transform:translate(-50%,-50%);z-index:1}
.map__me{position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:var(--radius-full);background:var(--icon-info);border:3px solid var(--surface-default);transform:translate(-50%,-50%);box-shadow:0 0 0 var(--space-8) var(--tint-me)}
.maptop{position:absolute;left:0;right:0;top:0;z-index:3;padding:max(env(safe-area-inset-top),var(--space-16)) var(--space-20) var(--space-4)}
.maptop,.maptop .chips{pointer-events:none}
.maptop .search,.maptop .chip{pointer-events:auto}
.screen--map.is-list .maptop{pointer-events:auto}
.maptop .chips{margin:var(--space-8) calc(var(--space-20) * -1) 0;padding:var(--space-4) var(--space-20)}
.screen--map.is-list .maptop{background:var(--surface-canvas)}
.maplist{position:absolute;inset:0;overflow-y:auto;background:var(--surface-canvas);padding:0 var(--space-20) 112px;z-index:2}
.maplist[hidden]{display:none}
.maplist h2{margin:var(--space-8) 0 var(--space-12)}
.mapbottom{position:absolute;left:var(--space-16);right:var(--space-16);bottom:var(--space-16);z-index:4;display:flex;flex-direction:column;align-items:center;gap:var(--space-12);pointer-events:none}
.mapbottom > *{pointer-events:auto}
.mapbottom .segmented{box-shadow:var(--shadow-card)}
.pointcard{width:100%;background:var(--surface-default);border-radius:var(--radius-lg);box-shadow:var(--shadow-sheet);padding:var(--space-16);display:flex;flex-direction:column;gap:var(--space-12);animation:fade-in var(--motion-fast) var(--ease) both}
.facts{display:flex;flex-direction:column;gap:var(--space-8);font:var(--type-body-small);color:var(--text-primary)}
.facts li{display:flex;align-items:center;gap:var(--space-8)}
.facts .icon{width:var(--size-icon-20);height:var(--size-icon-20);color:var(--icon-secondary)}
.point-photo{height:160px;border-radius:var(--radius-lg);background:var(--surface-subtle);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-16)}

/* Coupons */
.coupons-panel{margin-top:var(--space-16)}

/* =====================================================================
   5. COMPONENT GALLERY (#/components only)
   ===================================================================== */
.gal h1{margin-bottom:var(--space-8)}
.gal__intro{color:var(--text-secondary);font:var(--type-body-small);margin-bottom:var(--space-24)}
.gal__toc{display:flex;flex-wrap:wrap;gap:var(--space-8);margin-bottom:var(--space-32)}
.gal__toc a{font:var(--type-label);color:var(--text-link);padding:var(--space-4) var(--space-8);border-radius:var(--radius-xs);background:var(--surface-default)}
.gal__sec{padding-top:var(--space-32);margin-top:var(--space-32);border-top:1px solid var(--border-subtle);scroll-margin-top:var(--space-16)}
.gal__sec > h2{margin-bottom:var(--space-4)}
.gal__sec > .gal__recipe{font:var(--type-caption);color:var(--text-secondary);margin-bottom:var(--space-16)}
.gal__state{display:block;font:var(--type-overline);letter-spacing:var(--tracking-overline);text-transform:uppercase;color:var(--text-secondary);margin:var(--space-16) 0 var(--space-8)}
.gal__brand{background:var(--surface-brand);border-radius:var(--radius-lg);padding:var(--space-16)}
.gal__swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-8)}
.swatch{border-radius:var(--radius-md);overflow:hidden;background:var(--surface-default);border:1px solid var(--border-subtle);font:var(--type-caption)}
.swatch__chip{height:40px}
.swatch__name{padding:var(--space-4) var(--space-8);color:var(--text-primary);word-break:break-all}
.gal__icons{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-8)}
.gal__icon{display:flex;flex-direction:column;align-items:center;gap:var(--space-4);padding:var(--space-8) var(--space-4);background:var(--surface-default);border-radius:var(--radius-sm);font:var(--type-caption);color:var(--text-secondary);text-align:center;word-break:break-word}
.gal__wrap{display:flex;flex-wrap:wrap;gap:var(--space-12);align-items:center}

/* =====================================================================
   6. REDUCED MOTION
   ===================================================================== */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important;scroll-behavior:auto!important}
  .nfc__ring{display:none}
}

<script>
'use strict';
/* =====================================================================
   HELPERS
   ===================================================================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = (name, cls = '', label = '') =>
  `<svg class="icon ${cls}" ${label ? `role="img" aria-label="${esc(label)}"` : 'aria-hidden="true"'} focusable="false"><use href="#ss-${name}"/></svg>`;
const reduceMotion = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz = () => { try { navigator.vibrate && navigator.vibrate(30); } catch (e) {} };
const announce = msg => { const a = $('#announcer'); a.textContent = ''; setTimeout(() => a.textContent = msg, 30); };
const wait = ms => new Promise(r => setTimeout(r, ms));

/* =====================================================================
   STATE: memory + localStorage (try/catch), Reset demo restores START
   ===================================================================== */
const STORE_KEY = 'secondshelf-demo-v2';

/* Sample venues (CLAUDE.md §7, frames M01/G02/G08d). Map positions are % of the map area. */
const VENUES = [
  { id: 1, name: 'Café Daisy', dist: '200 m', metres: 200, hours: 'Open until 20:00', spots: 4, full: false, open: true, shelf: 'shelf 2', addr: 'Aia 8', x: 58, y: 44 },
  { id: 2, name: 'Café Lumi', dist: '1.2 km', metres: 1200, hours: 'Open until 18:00', spots: 0, full: true, open: true, shelf: '', addr: '', x: 22, y: 36 },
  { id: 3, name: 'Pizza Nonna', dist: '2.1 km', metres: 2100, hours: '', spots: 3, full: false, open: true, shelf: '', addr: '', x: 76, y: 70 }
];
const venue = id => VENUES.find(v => v.id === +id) || VENUES[0];

/* Scripted "AI" result for the one photo (CLAUDE.md §6) */
const AI_ITEMS = () => [
  { id: 'fusilli', name: 'Fusilli pasta, 500 g', short: 'Fusilli pasta', bb: '03/2027', qty: 1 },
  { id: 'soup', name: 'Tomato soup, 400 g can', short: 'Tomato soup', bb: '08/2027', qty: 2 },
  { id: 'crackers', name: 'Crackers, 200 g', short: 'Crackers', bb: '01/2027', qty: 1 }
];

/* Start state. Brenda is a returning giver: the M01-v2 frame shows 4 items already on shelves,
   and the G08 frame shows Active (2) / Used (1) after today's drop-off. */
const START = () => ({
  user: { name: 'Brenda Kowalska', first: 'Brenda', email: 'brenda@example.com', initials: 'BK' },
  mode: 'consumer',
  shelfItems: [
    { name: 'Tomato soup', venue: 1, status: 'done' },
    { name: 'Fusilli pasta', venue: 1, status: 'waiting' },
    { name: 'All-purpose flour', venue: 3, status: 'done' },
    { name: 'Canned tuna', venue: 2, status: 'waiting' }
  ],
  coupons: [
    { id: 'c1', venue: 1, state: 'active', code: 'SS-4817' },
    { id: 'c0', venue: 3, state: 'used', code: 'SS-4790' }
  ],
  bonuses: [],
  draft: null,          // drop-off in progress: { shelf, photo, items, started }
  sim: { tagFail: false, photoFail: false },   // set from the moderator menu (phase 3)
  events: []
});
const Store = {
  state: null,
  load() {
    try { const raw = localStorage.getItem(STORE_KEY); this.state = raw ? Object.assign(START(), JSON.parse(raw)) : START(); }
    catch (e) { this.state = START(); }
  },
  save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(this.state)); } catch (e) {} },
  reset() { this.state = START(); this.save(); },
  log(type, data = {}) { this.state.events.push({ t: new Date().toISOString(), type, ...data }); this.save(); }
};

/* =====================================================================
   UI LIBRARY: one function per component (§8), reused by every screen
   ===================================================================== */
const UI = {
  button({ label, variant = 'primary', icon: ic, block = false, attrs = '', disabled = false, loading = false, state = '' } = {}) {
    const cls = `btn btn--${variant}${block ? ' btn--block' : ''}${loading ? ' is-loading' : ''}${state ? ' ' + state : ''}`;
    const lead = loading ? '<span class="spinner" aria-hidden="true"></span>' : (ic ? icon(ic) : '');
    return `<button type="button" class="${cls}" ${disabled ? 'disabled' : ''} ${loading ? 'aria-busy="true"' : ''} ${attrs}>${lead}<span>${esc(label)}</span></button>`;
  },
  iconButton(name, label, attrs = '', cls = '') {
    return `<button type="button" class="icon-btn ${cls}" aria-label="${esc(label)}" ${attrs}>${icon(name)}</button>`;
  },
  input({ id, label, value = '', placeholder = '', type = 'text', error = '', disabled = false, state = '', attrs = '' }) {
    return `<div class="field${error ? ' is-error' : ''}${disabled ? ' is-disabled' : ''}">
      <label class="field__label" for="${id}">${esc(label)}</label>
      <input class="input ${state}" id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}" ${disabled ? 'disabled' : ''} ${error ? `aria-invalid="true" aria-describedby="${id}-err"` : ''} ${attrs}>
      ${error ? `<p class="field__error" id="${id}-err">${icon('needs-attention')}<span>${esc(error)}</span></p>` : ''}
    </div>`;
  },
  search({ id = 'search', value = '', placeholder = 'Search food', suggestions = null, filter = true }) {
    const sugg = suggestions && suggestions.length ? `<ul class="suggest" id="${id}-list" role="listbox" aria-label="Suggestions">${suggestions.map(s =>
      `<li role="none"><button type="button" class="suggest__item" role="option" data-suggest="${esc(s)}">${icon('search')}<span>${highlight(s, value)}</span></button></li>`).join('')}</ul>` : '';
    return `<div class="search">
      <div class="search__box">
        <label class="search__field">
          ${icon('search')}
          <span class="vh">Search food</span>
          <input class="search__input" id="${id}" type="search" value="${esc(value)}" placeholder="${esc(placeholder)}" autocomplete="off" ${sugg ? `aria-controls="${id}-list" aria-expanded="true"` : ''} role="combobox">
          ${value ? `<button type="button" class="icon-btn search__clear" aria-label="Clear search" data-clear="${id}">${icon('close')}</button>` : ''}
        </label>
        ${sugg}
      </div>
      ${filter ? `<button type="button" class="search__filter" aria-label="Filters">${icon('filter')}</button>` : ''}
    </div>`;
  },
  chip(label, { pressed = false, ic = '', attrs = '' } = {}) {
    const lead = pressed ? icon('done') : (ic ? icon(ic) : '');
    return `<button type="button" class="chip" aria-pressed="${pressed}" ${attrs}>${lead}<span>${esc(label)}</span></button>`;
  },
  checkbox({ id, label, checked = false, disabled = false, attrs = '' }) {
    return `<label class="check${disabled ? ' is-disabled' : ''}" for="${id}">

function highlight(text, q) {
  if (!q) return esc(text);
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return esc(text);
  return esc(text.slice(0, i)) + '<mark>' + esc(text.slice(i, i + q.length)) + '</mark>' + esc(text.slice(i + q.length));
}

/* =====================================================================
   ROUTER: hash routes, push/back direction, tab bar visibility
   ===================================================================== */
const Router = {
  routes: [],
  stack: [],
  add(pattern, view, opts = {}) {
    const keys = [];
    const re = new RegExp('^' + pattern.replace(/:([a-z]+)/g, (_, k) => (keys.push(k), '([^/]+)')) + '$');
    this.routes.push({ pattern, re, keys, view, opts });
  },
  parse() {
    const raw = location.hash.replace(/^#/, '') || '';
    const [path, qs = ''] = raw.split('?');
    return { path: path || '', query: Object.fromEntries(new URLSearchParams(qs)), raw };
  },
  match(path) {
    for (const r of this.routes) { const m = path.match(r.re); if (m) return { r, params: Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])])) }; }
    return null;
  },
  go(hash) { if (location.hash === hash) this.render('none'); else location.hash = hash; },
  replace(hash) { this._replace = true; location.replace(hash); },
  back() { if (this.stack.length > 1) history.back(); else this.go(DEFAULT_ROUTE); },
  direction(raw) {
    const s = this.stack;
    if (this._replace) { this._replace = false; s[s.length - 1] = raw; return 'fwd'; }
    if (s.length > 1 && s[s.length - 2] === raw) { s.pop(); return 'back'; }
    if (s[s.length - 1] === raw) return 'none';
    s.push(raw); return s.length === 1 ? 'none' : 'fwd';
  },
  render(dirOverride) {
    const { path, query, raw } = this.parse();
    const found = this.match(path);
    if (!found) { location.replace('#' + DEFAULT_ROUTE.replace(/^#/, '')); return; }
    const dir = dirOverride || this.direction(raw);
    const { r, params } = found;
    if (r.opts.guard && !r.opts.guard({ params, query })) { this.replace(r.opts.guardTo || DEFAULT_ROUTE); return; }
    const stage = $('#stage');
    const old = stage.firstElementChild && !stage.firstElementChild.classList.contains('leave-fwd') && !stage.firstElementChild.classList.contains('leave-back') ? stage.firstElementChild : null;
    $$('.screen', stage).forEach(s => { if (s !== old) s.remove(); });
    if (old && old._cleanup) { old._cleanup(); old._cleanup = null; }
    const el = document.createElement('section');
    el.className = 'screen' + (r.opts.cls ? ' ' + r.opts.cls : '');
    el.setAttribute('aria-label', r.opts.title || 'SecondShelf');
    el.innerHTML = r.view.html({ params, query });
    stage.appendChild(el);
    // tab bar
    const tb = $('#tabbar');
    if (r.opts.tabs) { tb.hidden = false; tb.innerHTML = UI.tabBar(Store.state.mode, r.opts.tabs); $('#app').classList.add('has-tabs'); }
    else { tb.hidden = true; $('#app').classList.remove('has-tabs'); }
    // transition
    const anim = !reduceMotion() && old && dir !== 'none';
    if (anim) {
      el.classList.add(dir === 'back' ? 'enter-back' : 'enter-fwd');
      old.classList.add(dir === 'back' ? 'leave-back' : 'leave-fwd');
      setTimeout(() => { old.remove(); el.classList.remove('enter-back', 'enter-fwd'); }, 260);
    } else if (old) old.remove();
    document.title = (r.opts.title ? r.opts.title + ' · ' : '') + 'SecondShelf';
    Store.log('view', { route: raw || path });
    r.view.mount && r.view.mount(el, { params, query });
    const h = $('h1', el); if (h && dir !== 'none') { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
};

document.addEventListener('click', e => {
  const t = e.target;
  // steppers
  const sb = t.closest('[data-step]');
  if (sb && !sb.disabled) {
    const wrap = sb.closest('[data-stepper]');
    const min = +wrap.dataset.min, max = +wrap.dataset.max;
    const v = $('.stepper__value', wrap);
    const n = Math.min(max, Math.max(min, +v.textContent + +sb.dataset.step));
    v.textContent = n;
    $('[data-step="-1"]', wrap).disabled = n <= min;
    $('[data-step="1"]', wrap).disabled = n >= max;
    wrap.dispatchEvent(new CustomEvent('stepper', { bubbles: true, detail: { id: wrap.dataset.stepper, value: n } }));
    return;
  }
  // filter chips toggle
  const ch = t.closest('.chip[aria-pressed]');
  if (ch && !ch.hasAttribute('data-nochip')) {
    const on = ch.getAttribute('aria-pressed') !== 'true';
    ch.setAttribute('aria-pressed', on);
    const lead = $('svg', ch); const label = $('span', ch).textContent;
    if (on && !lead) ch.insertAdjacentHTML('afterbegin', icon('done'));
    if (!on && lead && !ch.dataset.icon) lead.remove();
    ch.dispatchEvent(new CustomEvent('chip', { bubbles: true, detail: { label, on } }));
    return;
  }
  // segmented control
  const seg = t.closest('.segmented__seg');
  if (seg) {
    const grp = seg.closest('[data-seg]');
    $$('.segmented__seg', grp).forEach(s => s.setAttribute('aria-selected', s === seg));
    grp.dispatchEvent(new CustomEvent('seg', { bubbles: true, detail: { id: grp.dataset.seg, index: +seg.dataset.segI } }));
    return;
  }
  // toggles
  const tg = t.closest('.toggle[role="switch"]');
  if (tg && !tg.disabled) {
    const on = tg.getAttribute('aria-checked') !== 'true';
    tg.setAttribute('aria-checked', on);
    tg.dispatchEvent(new CustomEvent('toggle', { bubbles: true, detail: { on } }));
    return;
  }
  // search clear
  const cl = t.closest('[data-clear]');
  if (cl) { const inp = document.getElementById(cl.dataset.clear); inp.value = ''; inp.dispatchEvent(new Event('input', { bubbles: true })); inp.focus(); return; }
  // named actions
  const a = t.closest('[data-action]');
  if (a && Actions[a.dataset.action]) { e.preventDefault(); Actions[a.dataset.action](a, e); return; }
  // rows that navigate
  const hr = t.closest('[data-href]');
  if (hr) { Router.go(hr.dataset.href); }
});

  },
  qr(section, opts = {}) { return this.render(section, 'qr', opts); }
};

      inp.addEventListener('input', () => {

        const list = v.length >= 2 ? SUG.filter(s => s.toLowerCase().startsWith(v.toLowerCase())) : null;
        box.innerHTML = UI.search({ id: 'gs', value: v, suggestions: list });
        bindSearch();
        const n = $('#gs', box); n.focus(); n.setSelectionRange(v.length, v.length);
      });
    };
    bindSearch();
    box.addEventListener('click', e => { const s = e.target.closest('[data-suggest]'); if (s) { box.innerHTML = UI.search({ id: 'gs', value: s.dataset.suggest }); bindSearch(); } });

      }

      // remove with Undo on item rows
      const rm = e.target.closest('[data-remove]');
      if (rm) {
        const row = rm.closest('[data-item]'); const name = $('.item__name', row).textContent;
        const ph = document.createComment('removed'); row.replaceWith(ph);
        toast('info', `${esc(name)} removed`, { action: 'Undo', ic: 'remove', onAction: () => ph.replaceWith(row) });
      }
      const ed = e.target.closest('[data-edit]');
      if (ed) { const row = ed.closest('[data-item]'); row.classList.add('is-edited'); setTimeout(() => row.classList.remove('is-edited'), 1200); }
      const pb = e.target.closest('.item--check');
      const dec = e.target.closest('[data-decide]');
      if (dec) {
        const row = dec.closest('[data-check]');
        const keep = dec.dataset.decide === 'keep';
        row.classList.remove('is-kept', 'is-removed', 'is-flagged');
        row.classList.add(keep ? 'is-kept' : 'is-removed');
        $$('[data-decide]', row).forEach(b => b.setAttribute('aria-pressed', b === dec));
        const flag = $('.status--problem', row); flag && flag.remove();
      }
      const jump = e.target.closest('[data-jump]');
      if (jump) { e.preventDefault(); document.getElementById(jump.dataset.jump).scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth' }); }
    });
    // receiver checkbox variant: toggle selected style
    el.addEventListener('change', e => {
      const b = e.target.closest('[data-pick-box]');
      if (b) b.closest('.item--check').classList.toggle('is-checked', b.checked);
    });
  }
};

    const visible = () => VENUES.filter(v => (!st.filters.has('Has space') || !v.full) && (!st.filters.has('Nearby') || v.metres <= 1000) && (!st.filters.has('Open now') || v.open));
    const countText = n => `${n} location${n === 1 ? '' : 's'} in this area`;

      const vs = visible();
      if (st.sel && !vs.some(v => v.id === st.sel)) st.sel = null;
      $('#pins', el).innerHTML = vs.map(v => `<button type="button" class="marker-btn map__pin" style="left:${v.x}%;top:${v.y}%" data-pin="${v.id}" aria-label="Shelf ${v.id}, ${esc(v.name)}${v.full ? ', full shelf' : ''}">${UI.marker(v.id, st.sel === v.id ? 'selected' : v.full ? 'full' : 'default').replace('role="img"', 'aria-hidden="true"')}</button>`).join('');

      $('#mapbottom', el).innerHTML = st.sel && st.mode === 'map'
        ? UI.pointCard(venue(st.sel))
        : (st.mode === 'map' ? `<span class="countpill" role="status">${countText(vs.length)}</span>` : '') + toggle;
    };
    draw();
    el.addEventListener('click', e => {
      if (!e.target.closest('#map-search') && $('.suggest', el)) { const v = $('#mapsearch', el).value; box.innerHTML = UI.search({ id: 'mapsearch', value: v }); bind(); }

    el.addEventListener('seg', e => { if (e.detail.id === 'mapmode') { st.mode = e.detail.index ? 'list' : 'map'; st.sel = null; draw(); } });
    // search with suggestions under the field
    const SUG = ['Pasta', 'Pasta sauce'];
    const box = $('#map-search', el);

      const inp = $('#mapsearch', box);

/* ---------- G04 Tap the tag ---------- */
const TAP_OPTS = { idleText: '', note: 'Look for the arrow on the sign. The tag is right below it.' };
Views.giveTap = {
  html({ query }) {
    return `${UI.stepHeader({ title: 'Leave food', step: 1, first: true })}
      <h2 class="t-display tap-title">Tap the tag</h2>
      <p class="tap-sub">Hold your phone to the tag on the shelf</p>
      <div id="nfc-slot">${UI.nfc({ state: 'idle', id: 'g04', ...TAP_OPTS })}</div>`;
  },
  mount(el, { query }) {
    if (!hasDraft() || (query.shelf && +query.shelf !== Flow.d.shelf)) { Flow.start(query.shelf || 1); }
    const next = () => Router.go('#/give/photo');
    el.addEventListener('click', e => {
      const sec = $('[data-nfc]', el);
      if (e.target.closest('[data-nfc-tap]')) {
        const fail = Store.state.sim.tagFail || query.fail === '1';
        if (Store.state.sim.tagFail) { Store.state.sim.tagFail = false; Store.save(); }
        Store.log('nfc_tap', { result: fail ? 'not_found' : 'found' });
        NFC.tap(sec, { fail, onFound: next, opts: TAP_OPTS });
      }
      if (e.target.closest('[data-nfc-qr]')) NFC.qr(sec, TAP_OPTS);
      if (e.target.closest('[data-nfc-sampleqr]')) NFC.found(sec, { onFound: next, opts: TAP_OPTS });
    });
    const onCode = () => NFC.found($('[data-nfc]', el), { onFound: next, opts: TAP_OPTS });
    document.addEventListener('shelfcode', onCode);
    el._cleanup = () => document.removeEventListener('shelfcode', onCode);
  }
};

Views.givePhoto = {
  html({ query }) {
    const v = venue(Flow.d.shelf), err = query.error === '1';
    return `${UI.stepHeader({ title: 'Leave food', step: 2 })}
      <div class="stack">
        ${UI.banner('success', `<strong>Tag found</strong> · ${esc(v.name)}${v.shelf ? ', ' + esc(v.shelf) : ''}`)}
        <h2 class="t-h1">Photograph your items</h2>
        <p class="lead">Photograph only your own items, before placing them. The photo suggests a list; it is not proof of delivery.</p>
        <div>${err ? UI.capture('unreadable', photoURL) : UI.capture('empty')}</div>
        <div class="stack-8">
          ${UI.button({ label: 'Take photo', icon: 'camera', block: true, attrs: 'data-take' })}
          <input type="file" accept="image/*" capture="environment" class="vh" id="photo-in" tabindex="-1" aria-hidden="true">
          ${UI.button({ label: 'Use sample photo', variant: 'secondary', icon: 'photo', block: true, attrs: 'data-sample' })}
          <div class="center">${UI.button({ label: 'Add items manually', variant: 'link', attrs: 'data-manual' })}</div>
        </div>
      </div>`;
  },
  mount(el) {
    const inp = $('#photo-in', el);
    el.addEventListener('click', e => {
      if (e.target.closest('[data-take]')) inp.click();
      if (e.target.closest('[data-sample]')) { photoURL = ''; Store.log('photo', { source: 'sample' }); Router.go('#/give/reading'); }

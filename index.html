    });
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0]; if (!f) return;
      try { if (photoURL) URL.revokeObjectURL(photoURL); photoURL = URL.createObjectURL(f); } catch (e) { photoURL = ''; }
      Store.log('photo', { source: 'camera' }); Router.go('#/give/reading');
    });
  }
};

/* ---------- G06a Reading your photo ---------- */
Views.giveReading = {
  html() {
    return `${UI.stepHeader({ title: 'Leave food', step: 2 })}
      <div class="stack"><h2 class="t-h1">Photograph your items</h2>${UI.capture('reading', photoURL)}</div>`;
  },
  mount() {
    setTimeout(() => {
      if (!location.hash.startsWith('#/give/reading')) return;
      if (Store.state.sim.photoFail) { Store.state.sim.photoFail = false; Store.save(); Store.log('photo_read', { result: 'unreadable' }); Router.replace('#/give/photo?error=1'); return; }
      Flow.d.items = AI_ITEMS(); Store.save(); Store.log('photo_read', { result: 'ok' });
      Router.replace('#/give/items');
    }, 1500);
  }
};

/* ---------- G06 Check your items (+ G06c edit / add sheet) ---------- */
const shortName = n => String(n).split(',')[0].trim();
function itemForm({ name = '', bb = '', qty = 1, submit }) {
  return `<form id="item-form" class="stack" novalidate>
    ${UI.input({ id: 'f-name', label: 'Item name', value: name, placeholder: 'e.g. Canned soup' })}
    ${UI.input({ id: 'f-bb', label: 'Best before', value: bb, placeholder: 'MM/YYYY', attrs: 'inputmode="numeric" autocomplete="off"' })}
    <div><span class="field__label">Quantity</span><div style="margin-top:var(--space-8)">${UI.stepper({ id: 'f-qty', value: qty, min: 1, max: 9 })}</div></div>
    ${UI.button({ label: submit, icon: submit === 'Add item' ? 'plus' : 'done', block: true, attrs: 'type="submit" data-submit' }).replace('type="button" ', '')}
  </form>`;
}
Views.giveItems = {
  html() {
    return `${UI.stepHeader({ title: 'Leave food', step: 3 })}
      <h2 class="t-h1">Check your items</h2>
      <p class="lead c-secondary" id="items-sub" style="margin:var(--space-4) 0 var(--space-16)"></p>
      <div class="stack-8" id="items-list"></div>
      <div class="center" style="margin:var(--space-8) 0 var(--space-16)">${UI.button({ label: 'Add item manually', variant: 'link', icon: 'plus', attrs: 'data-add' })}</div>
      <div class="check-panel"><p class="t-body" style="padding-top:var(--space-4)">Place packs with labels and dates facing out.</p>
        ${UI.checkbox({ id: 'sealed', label: 'All items are sealed and within their date', checked: !!Flow.d.sealed })}</div>
      <div class="actions">${UI.button({ label: 'Confirm drop-off', variant: 'accent', icon: 'done', block: true, attrs: 'id="confirm"', disabled: true })}</div>`;
  },
  mount(el, { query }) {
    const d = Flow.d; if (!d.items) d.items = AI_ITEMS();
    const draw = () => {
      $('#items-list', el).innerHTML = d.items.map(i => UI.foodItem(i)).join('');
      sync();
    };
    const sync = () => {
      const n = Flow.count(d.items);
      $('#items-sub', el).textContent = `${n} item${n === 1 ? '' : 's'} · cans counted individually. Edit anything the photo got wrong.`;
      $('#confirm', el).disabled = !(d.sealed && d.items.length);
      Store.save();
    };
    const openForm = (item) => {
      const editing = !!item;
      openSheet(editing ? 'Edit item' : 'Add item', itemForm({ ...(item || {}), submit: editing ? 'Save' : 'Add item' }));
      const form = $('#item-form'), btn = $('[data-submit]', form), name = $('#f-name', form);
      const valid = () => { btn.disabled = !name.value.trim(); };
      name.addEventListener('input', valid); valid();
      form.addEventListener('submit', e => {
        e.preventDefault(); if (!name.value.trim()) return;
        const data = { name: name.value.trim(), short: shortName(name.value), bb: $('#f-bb', form).value.trim() || 'To be checked', qty: +$('.stepper__value', form).textContent };
        if (editing) { Object.assign(item, data); Store.log('item_edit', { id: item.id }); }
        else { d.items.push({ id: 'm' + Date.now(), ...data }); Store.log('item_add', {}); }
        closeSheet(); draw();
        if (editing) { const row = $(`[data-item="${item.id}"]`, el); row && row.classList.add('is-edited'); setTimeout(() => row && row.classList.remove('is-edited'), 1200); }
      });
    };
    draw();
    el.addEventListener('click', e => {
      const rm = e.target.closest('[data-remove]');
      if (rm) {
        const idx = d.items.findIndex(i => i.id === rm.dataset.remove); const [gone] = d.items.splice(idx, 1);
        draw(); Store.log('item_remove', { id: gone.id });
        toast('info', `${esc(gone.name)} removed`, { action: 'Undo', ic: 'remove', onAction: () => { d.items.splice(idx, 0, gone); draw(); } });
      }
      const ed = e.target.closest('[data-edit]');
      if (ed) openForm(d.items.find(i => i.id === ed.dataset.edit));
      if (e.target.closest('[data-add]')) openForm(null);
      if (e.target.closest('#confirm') && !$('#confirm', el).disabled) Views.giveItems.confirm();
    });
    el.addEventListener('stepper', e => { const it = d.items.find(i => 'q-' + i.id === e.detail.id); if (it) { it.qty = e.detail.value; sync(); } });
    el.addEventListener('change', e => { if (e.target.id === 'sealed') { d.sealed = e.target.checked; sync(); } });
    if (query.add) setTimeout(() => openForm(null), reduceMotion() ? 0 : 300);
  },
  confirm() {
    const s = Store.state, d = s.draft, n = Flow.count(d.items), id = 'c' + Date.now(), bid = 'b' + Date.now();
    s.shelfItems.unshift(...d.items.map(i => ({ name: (i.short || shortName(i.name)) + (i.qty > 1 ? ` ×${i.qty}` : ''), venue: d.shelf, status: 'waiting' })));
    s.coupons.unshift({ id, venue: d.shelf, state: 'active', code: 'SS-4821' });
    s.bonuses.unshift({ id: bid, venue: d.shelf, picked: 0, total: n });
    s.lastDrop = { venue: d.shelf, count: n, coupon: id, bonus: bid };
    Store.log('task_end', { task: 'dropoff', ms: Date.now() - d.started, items: n });
    s.draft = null; Store.save(); buzz();
    Router.replace('#/give/done');
  }
};

/* ---------- G07 Thanks for sharing ---------- */
Views.giveDone = {
  html() {
    const s = Store.state, L = s.lastDrop, v = venue(L.venue), b = s.bonuses.find(x => x.id === L.bonus) || { picked: 0, total: L.count };
    return `<div class="closebar">${UI.iconButton('close', 'Close', 'data-href="#/home"')}</div>
      <div class="illus"><span class="placeholder">${icon('photo')}<span>Illustration placeholder: packs land on the shelf</span></span></div>
      <h1 class="t-display">Thanks for sharing.</h1>
      <p class="t-body-large" style="margin:var(--space-8) 0 var(--space-24)">${L.count} item${L.count === 1 ? ' is' : 's are'} on the shelf at ${esc(v.name)}. People nearby can see them now.</p>
      <div class="stack">
        <article class="coupon" aria-label="Thank-you coupon"><div class="coupon__band"></div><div class="coupon__body">
          <div class="coupon__head"><span class="coupon__kind">${icon('coupon', 'icon--reward')}<span class="t-overline">Thank-you coupon · Ready</span></span></div>
          <dl class="kv-lines" style="margin-top:var(--space-4)"><div class="kv"><dt>Offer value</dt><dd>To be agreed</dd></div><div class="kv"><dt>Participating venue</dt><dd>${esc(v.name)}</dd></div><div class="kv"><dt>Expiry</dt><dd>To be agreed</dd></div></dl>
          <p class="howto"><strong>How to use your coupon:</strong> Show the counter code. It is not the shelf QR.</p>
        </div></article>
        ${UI.rescueBonus({ picked: b.picked, total: b.total, venue: v.name, note: 'Grows as people pick up your items.' })}
      </div>
      <div class="actions">
        ${UI.button({ label: 'Back to Home', icon: 'home', block: true, attrs: 'data-href="#/home"' })}
        ${UI.button({ label: 'View coupon', variant: 'secondary', icon: 'coupon', block: true, attrs: 'data-href="#/coupons"' })}
      </div>`;
  }
};

/* ---------- G08 Coupons ---------- */
let couponTab = 0;
Views.coupons = {
  html() {
    const c = Store.state.coupons, a = c.filter(x => x.state === 'active').length, u = c.filter(x => x.state !== 'active').length;
    return `<h1 class="t-h1 screen-title">Coupons</h1>
      ${UI.segmented([`Active (${a})`, `Used (${u})`], couponTab, { id: 'coupons' })}
      <div class="coupons-panel stack" id="coupons-panel" role="tabpanel"></div>`;
  },
  mount(el) {
    const draw = () => {
      const s = Store.state, p = $('#coupons-panel', el);
      if (couponTab === 0) {
        const act = s.coupons.filter(x => x.state === 'active');
        p.innerHTML = (act.length ? act.map(x => UI.coupon({ id: x.id, state: 'active', venue: venue(x.venue).name })).join('')
          : `<div class="card">${UI.empty({ ic: 'coupon', title: 'No coupons yet', line: 'Leave food at a shelf to get a thank-you coupon.', action: `<a class="btn btn--primary" href="#/map">${icon('sealed-food')}<span>Leave food</span></a>` })}</div>`)
          + s.bonuses.map(b => UI.rescueBonus({ picked: b.picked, total: b.total, venue: venue(b.venue).name, note: 'App-free pickups may be unlogged, so counts can be incomplete.' })).join('')
          + UI.banner('info', 'Coupon value, expiry and monthly cap are still being agreed.');
      } else {
        const used = s.coupons.filter(x => x.state !== 'active');
        p.innerHTML = used.map(x => UI.coupon({ id: x.id, state: x.state, venue: venue(x.venue).name })).join('');
      }
    };
    draw();
    el.addEventListener('seg', e => { if (e.detail.id === 'coupons') { couponTab = e.detail.index; draw(); } });
  }
};

/* ---------- G08d Show at the counter ---------- */
Views.couponCode = {
  html({ params }) {
    const c = Store.state.coupons.find(x => x.id === params.id) || Store.state.coupons[0];
    const v = venue(c.venue);
    return `${UI.topBar({ title: 'Your coupon', serif: true })}
      <div class="stack">
        <div class="card">${UI.qrSheet({ state: c.state === 'active' ? 'active' : 'used', code: c.code, venue: v.name + (v.addr ? ' · ' + v.addr : '') })}</div>
        ${UI.banner('plain', 'Not the shelf QR. This code is for the counter.', { ic: 'location' })}
      </div>
      <div class="spacer"></div>
      <div class="actions">${UI.button({ label: 'Done', icon: 'done', block: true, attrs: 'data-action="back"' })}</div>`;
  }
};

window.addEventListener('hashchange', () => Router.render());

Router.render();
</script>

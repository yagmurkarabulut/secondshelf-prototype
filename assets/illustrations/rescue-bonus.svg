<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-bonus" viewBox="0 0 320 200" role="img" aria-label="Your four packs on the shelf; each one picked up leaves a heart and fills the gold bar" data-picked="2">
<title>Your four packs on the shelf; each one picked up leaves a heart and fills the gold bar</title>
<defs>
<filter id="ssi-bonus-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>

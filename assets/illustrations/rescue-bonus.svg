.ssi-bonus .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-bonus .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-bonus .fp{fill:var(--paper-0,#FFFFFF)} .ssi-bonus .fo{fill:var(--oat-200,#E9DFCC)} .ssi-bonus .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-bonus .fl{fill:var(--green-100,#CFE3C8)} .ssi-bonus .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-bonus .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-bonus .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-bonus .fg{fill:var(--green-900,#1F3D2B)} .ssi-bonus .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-bonus .ff{fill:var(--green-700,#3F5B3A)} .ssi-bonus .fr{fill:var(--stone-300,#CFC6B6)} .ssi-bonus .fyt{fill:var(--ochre-100,#EFE5D1)}
.ssi-bonus .tb{transform-box:fill-box;transform-origin:center}
.ssi-bonus .tbb{transform-box:fill-box;transform-origin:50% 100%}
.ssi-bonus .it{transition:transform .6s cubic-bezier(.3,0,.2,1),opacity .6s ease} .ssi-bonus .hh{transform:scale(0);transition:transform .45s cubic-bezier(.2,0,0,1) .35s} .ssi-bonus .fill{transform-box:fill-box;transform-origin:0 50%;transform:scaleX(0);transition:transform .8s cubic-bezier(.2,0,0,1) .2s} .ssi-bonus .sps{opacity:0;transition:opacity .4s ease .8s} .ssi-bonus[data-picked="4"] .sps{opacity:1}
.ssi-bonus[data-picked="1"] .i0{transform:translateY(-36px);opacity:0}
.ssi-bonus[data-picked="1"] .h0{transform:scale(1)}
.ssi-bonus[data-picked="1"] .fill{transform:scaleX(0.25)}
.ssi-bonus[data-picked="2"] .i0,.ssi-bonus[data-picked="2"] .i1{transform:translateY(-36px);opacity:0}
.ssi-bonus[data-picked="2"] .h0,.ssi-bonus[data-picked="2"] .h1{transform:scale(1)}
.ssi-bonus[data-picked="2"] .fill{transform:scaleX(0.5)}
.ssi-bonus[data-picked="3"] .i0,.ssi-bonus[data-picked="3"] .i1,.ssi-bonus[data-picked="3"] .i2{transform:translateY(-36px);opacity:0}
.ssi-bonus[data-picked="3"] .h0,.ssi-bonus[data-picked="3"] .h1,.ssi-bonus[data-picked="3"] .h2{transform:scale(1)}
.ssi-bonus[data-picked="3"] .fill{transform:scaleX(0.75)}
.ssi-bonus[data-picked="4"] .i0,.ssi-bonus[data-picked="4"] .i1,.ssi-bonus[data-picked="4"] .i2,.ssi-bonus[data-picked="4"] .i3{transform:translateY(-36px);opacity:0}
.ssi-bonus[data-picked="4"] .h0,.ssi-bonus[data-picked="4"] .h1,.ssi-bonus[data-picked="4"] .h2,.ssi-bonus[data-picked="4"] .h3{transform:scale(1)}
.ssi-bonus[data-picked="4"] .fill{transform:scaleX(1.0)}
.ssi-bonus .i0{transition-delay:0.00s}
.ssi-bonus .i1{transition-delay:0.12s}
.ssi-bonus .i2{transition-delay:0.24s}
.ssi-bonus .i3{transition-delay:0.36s}
@media (prefers-reduced-motion: reduce){.ssi-bonus *{animation:none !important;transition:none !important}}
</style>

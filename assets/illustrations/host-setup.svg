.ssi-host .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-host .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-host .fp{fill:var(--paper-0,#FFFFFF)} .ssi-host .fo{fill:var(--oat-200,#E9DFCC)} .ssi-host .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-host .fl{fill:var(--green-100,#CFE3C8)} .ssi-host .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-host .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-host .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-host .fg{fill:var(--green-900,#1F3D2B)} .ssi-host .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-host .fi{fill:var(--ink-900,#2B241E)} .ssi-host .fsl{fill:var(--slate-600,#51666D)} .ssi-host .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-host .tb{transform-box:fill-box;transform-origin:center}
.ssi-host .tbb{transform-box:fill-box;transform-origin:50% 100%}

@media (prefers-reduced-motion: reduce){.ssi-host *{animation:none !important}}

<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-host" viewBox="0 0 320 210" role="img" aria-label="A café window sticker, an A5 sign, a shelf with dates facing out, the NFC plate and a QR sticker">
<title>A café window sticker, an A5 sign, a shelf with dates facing out, the NFC plate and a QR sticker</title>
<defs>

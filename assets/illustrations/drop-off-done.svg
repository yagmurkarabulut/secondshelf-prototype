<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-dropdone" viewBox="0 0 320 200" role="img" aria-label="Your four items land on the shelf, then gold sparkles">
<title>Your four items land on the shelf, then gold sparkles</title>
<defs>
<filter id="ssi-dropdone-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<clipPath id="ssi-dropdone-clip"><rect x="0" y="0" width="320" height="200" rx="16"></rect></clipPath>
</defs>
<style>
.ssi-dropdone .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-dropdone .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-dropdone .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-dropdone .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-dropdone .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-dropdone .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-dropdone .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-dropdone .fp{fill:var(--paper-0,#FFFFFF)} .ssi-dropdone .fo{fill:var(--oat-200,#E9DFCC)} .ssi-dropdone .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-dropdone .fl{fill:var(--green-100,#CFE3C8)} .ssi-dropdone .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-dropdone .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-dropdone .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-dropdone .fg{fill:var(--green-900,#1F3D2B)} .ssi-dropdone .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-dropdone .fi{fill:var(--ink-900,#2B241E)} .ssi-dropdone .fsl{fill:var(--slate-600,#51666D)} .ssi-dropdone .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-dropdone .tb{transform-box:fill-box;transform-origin:center}
.ssi-dropdone .tbb{transform-box:fill-box;transform-origin:50% 100%}
@keyframes ssi-dropdone-drop{0%{transform:translateY(-70px);opacity:0}55%{transform:translateY(3px) scaleY(.94);opacity:1}78%{transform:translateY(-2px)}100%{transform:none;opacity:1}}
@keyframes ssi-dropdone-pop{0%{transform:scale(0);opacity:0}55%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}
.ssi-dropdone .drop{animation:ssi-dropdone-drop .45s cubic-bezier(.2,0,0,1) both}
.ssi-dropdone .sp{animation:ssi-dropdone-pop .5s cubic-bezier(.2,0,0,1) 1s both} .ssi-dropdone .s2{animation-delay:1.12s} .ssi-dropdone .s3{animation-delay:1.24s}
@media (prefers-reduced-motion: reduce){.ssi-dropdone *{animation:none !important}}
</style>

<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-tap" viewBox="0 0 320 260" role="img" aria-label="A hand holds a phone to the NFC plate under the SecondShelf sign" data-state="idle">
<title>A hand holds a phone to the NFC plate under the SecondShelf sign</title>
<defs>
<filter id="ssi-tap-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<clipPath id="ssi-tap-clip"><rect x="0" y="0" width="320" height="260" rx="16"></rect></clipPath>
</defs>
<style>
.ssi-tap .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-tap .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-tap .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-tap .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-tap .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-tap .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-tap .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-tap .fp{fill:var(--paper-0,#FFFFFF)} .ssi-tap .fo{fill:var(--oat-200,#E9DFCC)} .ssi-tap .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-tap .fl{fill:var(--green-100,#CFE3C8)} .ssi-tap .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-tap .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-tap .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-tap .fg{fill:var(--green-900,#1F3D2B)} .ssi-tap .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-tap .fi{fill:var(--ink-900,#2B241E)} .ssi-tap .fsl{fill:var(--slate-600,#51666D)} .ssi-tap .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-tap .tb{transform-box:fill-box;transform-origin:center}
.ssi-tap .tbb{transform-box:fill-box;transform-origin:50% 100%}

.ssi-tap .s-wave,.ssi-tap .s-chk,.ssi-tap .s-err,.ssi-tap .s-qr{opacity:0}
.ssi-tap .rp,.ssi-tap .aim{opacity:0}
.ssi-tap .ring{transform-box:fill-box;transform-origin:center}
@keyframes ssi-tap-ph{0%{transform:translate(96px,150px)}26%{transform:translate(0,0)}74%{transform:translate(0,0)}96%,100%{transform:translate(96px,150px)}}
@keyframes ssi-tap-rp{0%,30%{transform:scale(.6);opacity:0}34%{opacity:.9}62%,100%{transform:scale(2.2);opacity:0}}
@keyframes ssi-tap-rpf{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes ssi-tap-arrow{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@keyframes ssi-tap-spin{to{transform:rotate(360deg)}}
@keyframes ssi-tap-pop{0%{opacity:0;transform:scale(.4)}60%{opacity:1;transform:scale(1.15)}100%{opacity:1;transform:scale(1)}}
@keyframes ssi-tap-shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-2px)}40%,80%{transform:translateX(2px)}}
@keyframes ssi-tap-blink{0%,100%{opacity:.25}50%{opacity:1}}
/* idle: the teaching loop (4 s). Still frame = phone on the plate, ripples drawn. */
.ssi-tap[data-state="idle"] .ph{animation:ssi-tap-ph 4s cubic-bezier(.2,0,0,1) infinite}
.ssi-tap[data-state="idle"] .rp{animation:ssi-tap-rp 4s cubic-bezier(.2,0,0,1) infinite}
.ssi-tap[data-state="idle"] .rp2{animation-delay:.25s} .ssi-tap[data-state="idle"] .rp3{animation-delay:.5s}
.ssi-tap[data-state="idle"] .arrow{animation:ssi-tap-arrow 1.2s ease-in-out infinite}
.ssi-tap[data-state="idle"] .ring{animation:ssi-tap-spin 10s linear infinite}
.ssi-tap[data-state="idle"] .s-wave{opacity:1}
/* scanning: phone held on the plate, ripples every 1.2 s */
.ssi-tap[data-state="scanning"] .rp{animation:ssi-tap-rpf 1.2s cubic-bezier(.2,0,0,1) infinite}
.ssi-tap[data-state="scanning"] .rp2{animation-delay:.4s} .ssi-tap[data-state="scanning"] .rp3{animation-delay:.8s}
.ssi-tap[data-state="scanning"] .s-wave{opacity:1;animation:ssi-tap-blink 1.2s ease-in-out infinite}
/* found: tick pops, phone buzzes once, plate core turns Leaf */
.ssi-tap[data-state="found"] .s-chk{opacity:1;transform-box:fill-box;transform-origin:center;animation:ssi-tap-pop .3s cubic-bezier(.2,0,0,1) both}
.ssi-tap[data-state="found"] .shake{animation:ssi-tap-shake .3s linear 1}
.ssi-tap[data-state="found"] .core{fill:var(--green-100,#CFE3C8)}
/* notfound: phone just off the plate, dashed target shows where to aim */
.ssi-tap[data-state="notfound"] .ph{transform:translate(30px,22px)}
.ssi-tap[data-state="notfound"] .s-err{opacity:1}
.ssi-tap[data-state="notfound"] .aim{opacity:1;animation:ssi-tap-blink 1.2s ease-in-out infinite}
/* qr: phone over the QR sticker, camera corners on screen */
.ssi-tap[data-state="qr"] .ph{transform:translate(39px,0px)}
.ssi-tap[data-state="qr"] .s-qr{opacity:1}
@media (prefers-reduced-motion: reduce){
.ssi-tap[data-state="idle"] .rp,.ssi-tap[data-state="scanning"] .rp{opacity:.5}
.ssi-tap[data-state="idle"] .rp1,.ssi-tap[data-state="scanning"] .rp1{transform:scale(1.2)}
.ssi-tap[data-state="idle"] .rp2,.ssi-tap[data-state="scanning"] .rp2{transform:scale(1.6)}
.ssi-tap[data-state="idle"] .rp3,.ssi-tap[data-state="scanning"] .rp3{opacity:0}
.ssi-tap[data-state="notfound"] .aim{opacity:1}
}
@media (prefers-reduced-motion: reduce){.ssi-tap *{animation:none !important}}
</style>
<g clip-path="url(#ssi-tap-clip)"><rect class="bg" x="0" y="0" width="320" height="260" rx="16"></rect><g filter="url(#ssi-tap-ink)">

<!-- wall + A5 sign above the shelf, arrow points at the plate -->

<style>
.ssi-fine .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-fine .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-fine .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-fine .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-fine .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-fine .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-fine .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-fine .fp{fill:var(--paper-0,#FFFFFF)} .ssi-fine .fo{fill:var(--oat-200,#E9DFCC)} .ssi-fine .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-fine .fl{fill:var(--green-100,#CFE3C8)} .ssi-fine .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-fine .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-fine .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-fine .fg{fill:var(--green-900,#1F3D2B)} .ssi-fine .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-fine .fi{fill:var(--ink-900,#2B241E)} .ssi-fine .fsl{fill:var(--slate-600,#51666D)} .ssi-fine .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-fine .tb{transform-box:fill-box;transform-origin:center}
.ssi-fine .tbb{transform-box:fill-box;transform-origin:50% 100%}
.ssi-fine .out{opacity:0}
@media (prefers-reduced-motion: reduce){.ssi-fine *{animation:none !important}}
</style>

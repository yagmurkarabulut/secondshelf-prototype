<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-fine" viewBox="0 0 320 200" role="img" aria-label="A tidy shelf with a tick">
<title>A tidy shelf with a tick</title>
<defs>
<filter id="ssi-fine-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<clipPath id="ssi-fine-clip"><rect x="0" y="0" width="320" height="200" rx="16"></rect></clipPath>

<clipPath id="ssi-full-clip"><rect x="0" y="0" width="240" height="160" rx="16"></rect></clipPath>
</defs>
<style>
.ssi-full .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-full .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-full .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-full .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-full .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-full .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-full .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-full .fp{fill:var(--paper-0,#FFFFFF)} .ssi-full .fo{fill:var(--oat-200,#E9DFCC)} .ssi-full .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-full .fl{fill:var(--green-100,#CFE3C8)} .ssi-full .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-full .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-full .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-full .fg{fill:var(--green-900,#1F3D2B)} .ssi-full .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-full .fi{fill:var(--ink-900,#2B241E)} .ssi-full .fsl{fill:var(--slate-600,#51666D)} .ssi-full .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-full .tb{transform-box:fill-box;transform-origin:center}
.ssi-full .tbb{transform-box:fill-box;transform-origin:50% 100%}

@media (prefers-reduced-motion: reduce){.ssi-full *{animation:none !important}}

<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-fill" viewBox="0 0 320 124" role="img" aria-label="Shelf with free spots that fill as you add items" data-mine="0">
<title>Shelf with free spots that fill as you add items</title>
<defs>
<filter id="ssi-fill-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<clipPath id="ssi-fill-clip"><rect x="0" y="0" width="320" height="124" rx="16"></rect></clipPath>
</defs>
<style>
.ssi-fill .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-fill .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-fill .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-fill .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-fill .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-fill .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-fill .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-fill .fp{fill:var(--paper-0,#FFFFFF)} .ssi-fill .fo{fill:var(--oat-200,#E9DFCC)} .ssi-fill .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-fill .fl{fill:var(--green-100,#CFE3C8)} .ssi-fill .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-fill .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-fill .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-fill .fg{fill:var(--green-900,#1F3D2B)} .ssi-fill .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-fill .fi{fill:var(--ink-900,#2B241E)} .ssi-fill .fsl{fill:var(--slate-600,#51666D)} .ssi-fill .fr{fill:var(--stone-300,#CFC6B6)}
.ssi-fill .tb{transform-box:fill-box;transform-origin:center}
.ssi-fill .tbb{transform-box:fill-box;transform-origin:50% 100%}
.ssi-fill [class^="m"]{display:none}
@keyframes ssi-fill-drop{0%{transform:translateY(-48px);opacity:0}55%{transform:translateY(2px) scaleY(.94);opacity:1}78%{transform:translateY(-2px)}100%{transform:none;opacity:1}}
.ssi-fill .drop{animation:ssi-fill-drop .45s cubic-bezier(.2,0,0,1) both}
.ssi-fill[data-mine="1"] .m1,.ssi-fill[data-mine="2"] .m1,.ssi-fill[data-mine="3"] .m1,.ssi-fill[data-mine="4"] .m1,.ssi-fill[data-mine="5"] .m1,.ssi-fill[data-mine="6"] .m1{display:inline}
.ssi-fill[data-mine="1"] .g1,.ssi-fill[data-mine="2"] .g1,.ssi-fill[data-mine="3"] .g1,.ssi-fill[data-mine="4"] .g1,.ssi-fill[data-mine="5"] .g1,.ssi-fill[data-mine="6"] .g1{display:none}
.ssi-fill[data-mine="2"] .m2,.ssi-fill[data-mine="3"] .m2,.ssi-fill[data-mine="4"] .m2,.ssi-fill[data-mine="5"] .m2,.ssi-fill[data-mine="6"] .m2{display:inline}
.ssi-fill[data-mine="2"] .g2,.ssi-fill[data-mine="3"] .g2,.ssi-fill[data-mine="4"] .g2,.ssi-fill[data-mine="5"] .g2,.ssi-fill[data-mine="6"] .g2{display:none}
.ssi-fill[data-mine="3"] .m3,.ssi-fill[data-mine="4"] .m3,.ssi-fill[data-mine="5"] .m3,.ssi-fill[data-mine="6"] .m3{display:inline}
.ssi-fill[data-mine="3"] .g3,.ssi-fill[data-mine="4"] .g3,.ssi-fill[data-mine="5"] .g3,.ssi-fill[data-mine="6"] .g3{display:none}
.ssi-fill[data-mine="4"] .m4,.ssi-fill[data-mine="5"] .m4,.ssi-fill[data-mine="6"] .m4{display:inline}
.ssi-fill[data-mine="4"] .g4,.ssi-fill[data-mine="5"] .g4,.ssi-fill[data-mine="6"] .g4{display:none}
.ssi-fill[data-mine="5"] .m5,.ssi-fill[data-mine="6"] .m5{display:inline}
.ssi-fill[data-mine="5"] .g5,.ssi-fill[data-mine="6"] .g5{display:none}
.ssi-fill[data-mine="6"] .m6{display:inline}
.ssi-fill[data-mine="6"] .g6{display:none}

@media (prefers-reduced-motion: reduce){.ssi-fill *{animation:none !important}}
</style>

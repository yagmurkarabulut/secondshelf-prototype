<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-nocoupon" viewBox="0 0 240 160" role="img" aria-label="An empty coupon outline next to food you could leave">
<title>An empty coupon outline next to food you could leave</title>
<defs>
<filter id="ssi-nocoupon-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>
<clipPath id="ssi-nocoupon-clip"><rect x="0" y="0" width="240" height="160" rx="16"></rect></clipPath>
</defs>
<style>
.ssi-nocoupon .k{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-nocoupon .k2{fill:none;stroke:var(--green-900,#1F3D2B);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-nocoupon .kp{fill:none;stroke:var(--paper-0,#FFFFFF);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ssi-nocoupon .ka{fill:none;stroke:var(--terracotta-500,#C2593A);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ssi-nocoupon .kd{fill:none;stroke:var(--stone-500,#8C8477);stroke-width:2;stroke-linecap:round;stroke-dasharray:4 5}
.ssi-nocoupon .kc{fill:none;stroke:var(--clay-500,#8A6F4A);stroke-width:2;stroke-linecap:round;stroke-dasharray:3 4}
.ssi-nocoupon .bg{fill:var(--cream-100,#F6F1E7)}
.ssi-nocoupon .fp{fill:var(--paper-0,#FFFFFF)} .ssi-nocoupon .fo{fill:var(--oat-200,#E9DFCC)} .ssi-nocoupon .fs{fill:var(--sand-200,#E8D7B9)}
.ssi-nocoupon .fl{fill:var(--green-100,#CFE3C8)} .ssi-nocoupon .ft{fill:var(--terracotta-100,#F0DFD2)} .ssi-nocoupon .fT{fill:var(--terracotta-500,#C2593A)}
.ssi-nocoupon .fy{fill:var(--ochre-500,#BF8B2E)} .ssi-nocoupon .fg{fill:var(--green-900,#1F3D2B)} .ssi-nocoupon .fc{fill:var(--clay-500,#8A6F4A)}
.ssi-nocoupon .fi{fill:var(--ink-900,#2B241E)} .ssi-nocoupon .fsl{fill:var(--slate-600,#51666D)} .ssi-nocoupon .fr{fill:var(--stone-300,#CFC6B6)}

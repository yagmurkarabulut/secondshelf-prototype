<svg xmlns="http://www.w3.org/2000/svg" class="ss-ill ssi-photohow" viewBox="0 0 320 240" role="img" aria-label="A hand holds a phone over all the items on a table and takes one photo of them together">
<title>A hand holds a phone over all the items on a table and takes one photo of them together</title>
<defs>
<filter id="ssi-photohow-ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7"></feTurbulence><feDisplacementMap in="SourceGraphic" scale="1.8" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter>

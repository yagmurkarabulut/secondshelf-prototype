.ssi-photohow .frame{animation:ssi-photohow-frame 5.0s cubic-bezier(.2,0,0,1) infinite}
@keyframes ssi-photohow-lift{0.00%{transform:translateY(150px)}4.00%{transform:translateY(150px)}18.00%{transform:translateY(0)}72.00%{transform:translateY(0)}88.00%{transform:translateY(150px)}100.00%{transform:translateY(150px)}}
@keyframes ssi-photohow-corners{0.00%{transform:scale(1.25);opacity:0}20.00%{transform:scale(1.25);opacity:0}26.00%{transform:scale(1);opacity:1}100.00%{transform:scale(1);opacity:1}}
@keyframes ssi-photohow-flash{0.00%{opacity:0}33.00%{opacity:0}35.00%{opacity:.95}42.00%{opacity:0}100.00%{opacity:0}}
@keyframes ssi-photohow-ok{0.00%{transform:scale(0)}43.00%{transform:scale(0)}47.00%{transform:scale(1.25)}50.00%{transform:scale(1)}72.00%{transform:scale(1)}78.00%{transform:scale(0)}100.00%{transform:scale(0)}}
.ssi-photohow .lift{animation:ssi-photohow-lift 5.0s cubic-bezier(.3,0,.2,1) infinite} .ssi-photohow .corners{animation:ssi-photohow-corners 5.0s cubic-bezier(.2,0,0,1) infinite} .ssi-photohow .flash{opacity:0;animation:ssi-photohow-flash 5.0s linear infinite} .ssi-photohow .ok{animation:ssi-photohow-ok 5.0s cubic-bezier(.2,0,0,1) infinite}
@media (prefers-reduced-motion: reduce){.ssi-photohow *{animation:none !important;transition:none !important}}
